- id: c.3
  question: Naive diversification uses {equal} weights. Efficient diversification uses
    {optimized} weights. Naive has no {estimation error}.
  answer: '[''equal'', ''optimized'', ''estimation error'']'
  difficulty: 2
  tags:
  - comparison
- id: c.4
  question: 'Beta formula: β = Cov(r_i, r_m) / {Var(r_m)}. Stock with β = 1.5 has {150%}
    of market sensitivity. β = {0} means no market correlation.'
  answer: '[''Var(r_m)'', ''150%'', ''0'']'
  difficulty: 2
  tags:
  - formula
- id: c.5
  question: CAPM expected return = r_f + {β} × ({r_m} - r_f). Alpha = actual return
    minus {CAPM expected return}.
  answer: '[''β'', ''r_m'', ''CAPM expected return'']'
  difficulty: 2
  tags:
  - formula
- id: c.6
  question: Total risk = {systematic} risk + {idiosyncratic} risk. Systematic risk
    measured by {beta}. Idiosyncratic risk diversifies {away}.
  answer: '[''systematic'', ''idiosyncratic'', ''beta'', ''away'']'
  difficulty: 2
  tags:
  - terminology
- id: c.7
  question: 'Stock A: β = 1.5, r_f = 3%, r_m = 10%. CAPM expected = {13.5%}. If actual
