- id: '4.1'
  question: What is Payment for Order Flow (PFOF)?
  options:
    a: Broker receives payment from wholesalers for routing retail orders to them
    b: Fee exchanges charge for order routing
    c: Commission paid by retail traders for market orders
    d: Fee for using dark pools
  answer: a
  explanation: 'PFOF = wholesaler pays broker to route retail orders. Broker gets
    ~$0.003/share. Wholesaler profits by internalizing and crossing flow. Critics:
    conflict with best execution.'
  difficulty: 1
  tags:
  - terminology
- id: '4.2'
  question: Which participant is MOST likely to use a VWAP algorithm to execute a
    large order?
  options:
    a: Retail trader buying 100 shares
    b: HFT firm arbitraging ETF vs underlying
    c: Day trader scalping 1-2 cent moves
    d: Mutual fund manager rebalancing $200M
  answer: d
  explanation: VWAP spreads execution across the day to match volume-weighted price.
    Only large institutional orders (mutual funds, pensions) need this. Retail 100
    shares executes instantly.
  difficulty: 1
  tags:
  - scenario
- id: '4.3'
  question: 'A market maker''s primary source of profit is:'
  options:
    a: The bid-ask spread
    b: Predicting stock direction
    c: Long-term capital appreciation
    d: Dividend income
  answer: a
  explanation: MMs profit from spread (buy bid, sell ask). They are liquidity providers,
    not directional forecasters. Spread may be just $0.01-0.03 but multiplied across
    millions of shares.
  difficulty: 1
  tags:
  - concept
- id: '4.4'
  question: In a stressed market, which participant is OBLIGATED to continue providing
    two-sided quotes?
  options:
    a: HFT firm
    b: NYSE Designated Market Maker
    c: Hedge fund
    d: Retail broker
  answer: b
  explanation: NYSE DMMs are obligated to maintain fair and orderly markets even in
    stress. HFTs can (and do) widen spreads or stop quoting. This obligation is why
    NYSE DMMs exist.
  difficulty: 2
  tags:
  - concept
- id: '4.5'
  question: An institution wants to sell 1M shares. Which execution approach minimizes
    market impact?
  options:
    a: One market order at market open
    b: Iceberg order on one exchange
    c: Algorithm slicing across venues + dark pools over multiple days
    d: Limit order at best ask
  answer: c
  explanation: 1M shares is massive. One market order would crash the price. Algo
    slicing across exchanges + dark pools + time reduces impact. Multi-day execution
    may be needed.
  difficulty: 2
  tags:
  - scenario
- id: '4.6'
  question: Which statement about HFT is TRUE?
  options:
    a: HFT always increases market volatility
    b: HFT uses speed advantages to capture arbitrage and provide liquidity
    c: HFT is illegal in the United States
    d: HFT firms only trade for their own accounts, never as market makers
  answer: b
  explanation: HFT uses sub-millisecond speed for arbitrage, market making, and other
    strategies. It provides tighter spreads (benefit) but can also front-run (harm).
    Legal in US but regulated.
  difficulty: 2
  tags:
  - concept
- id: '4.7'
  question: 'Block trade of 50,000 XYZ shares executes at $49.80 while market price
    is $50.00. The $0.20 discount represents:'
  options:
    a: Market manipulation
    b: Liquidity premium — buyer charges for taking large block
    c: Mistake by the block desk
    d: Trading error that will be corrected
  answer: b
  explanation: Buyer providing liquidity to a large sell order demands compensation.
    $0.20 × 50,000 = $10,000 discount. Standard block trade discount for taking on
    concentrated position risk.
  difficulty: 2
  tags:
  - scenario
- id: '4.8'
  question: Which of the following is NOT a typical HFT strategy?
  options:
    a: Latency arbitrage across venues
    b: Market making with automated quotes
    c: Fundamental long-term value investing
    d: Detecting large orders and trading ahead
  answer: c
  explanation: Fundamental value investing requires months/years horizon. HFT operates
    in microseconds to seconds. Holding periods measure milliseconds, not fiscal quarters.
  difficulty: 1
  tags:
  - comparison
- id: '4.9'
  question: 'Market maker sees persistent buy orders and builds a net short position.
    To manage risk, the MM will likely:'
  options:
    a: Do nothing — inventory risk is normal
    b: Raise ask price and lower bid price to attract sellers
    c: Buy calls to hedge short exposure
    d: Stop quoting until inventory normalizes
  answer: b
  explanation: 'MM adjusts quotes: lower bid (reduce buying), raise ask (increase
    selling). If already short from selling to buyers, MM raises ask to slow selling
    and lowers bid to encourage buying back. Options also used for hedging.'
  difficulty: 3
  tags:
  - scenario
- id: '4.10'
  question: What percentage of US equity volume is attributed to retail traders?
  options:
    a: ~5%
    b: ~25%
    c: ~50%
    d: ~75%
  answer: b
  explanation: Retail accounts for ~25% of daily volume, up from ~10% pre-COVID. Zero-commission
    brokers and mobile trading apps drove the increase. Retail consistently provides
    uninformed flow.
  difficulty: 2
  tags:
  - terminology
