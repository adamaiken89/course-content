subject: Equity Trading Fundamentals
language: en
time_budget_hours: 36
target_level: intermediate
domain: equity-trading
prerequisites: []
learning_objectives:
  - Define equity instruments and differentiate stock types
  - Understand market structure, order types, and trading mechanics
  - Value equities using multiples and DCF frameworks
  - Analyze financial statements from a trader's perspective
  - Apply technical analysis and risk management principles
  - Navigate IPOs, corporate actions, and regulatory landscape
  - Build and manage a diversified equity portfolio
