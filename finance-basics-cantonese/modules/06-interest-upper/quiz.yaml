- id: '6.1'
  question: 單利公式係乜?
  options:
    a: P × (1 + r)^t
    b: P × (1 + r/n)^(n × t)
    c: P / (r × t)
    d: P × r × t (本金 × 利率 × 時間)
  answer: d
  explanation: '單利公式: 利息 = 本金 (P) × 年利率 (r) × 年數 (t)。注意: 利率要用小數 (4% = 0.04), 時間要用年。b
    同 c 係複利公式。'
  difficulty: 1
  tags:
  - terminology
  - formula
- id: '6.2'
  question: 本金 $100,000, 利率 4%, 5 年單利, 利息幾多?
  options:
    a: $121,665
    b: $4,000
    c: $20,000
    d: $21,665
  answer: c
  explanation: 單利 = $100,000 × 0.04 × 5 = $20,000。b 係 1 年嘅利息, a 係複利 5 年嘅總額, d 係複利 5 年嘅利息。
  difficulty: 1
  tags:
  - calculation
  - formula
- id: '6.3'
  question: 本金 $100,000, 利率 4%, 5 年複利 (年計息), 總額幾多?
  options:
    a: $120,000
    b: $121,665
    c: $108,000
    d: $140,000
  answer: b
  explanation: 複利 = $100,000 × (1 + 0.04)^5 = $100,000 × 1.21665 = $121,665。a 係單利總額,
    c 係簡單加 8%, d 係 10 年單利嘅終值 (用錯計法)。
  difficulty: 2
  tags:
  - calculation
  - formula
- id: '6.4'
  question: 本金 $50,000, 利率 3.5%, 30 年複利, 終值大約幾多?
  options:
    a: $140,000
    b: $200,000
    c: $52,500
    d: $105,000
  answer: a
  explanation: '複利終值 = $50,000 × (1.035)^30 = $50,000 × 2.8068 ≈ $140,340。c 係單利利息
    (冇滾存), b 係本金翻倍 (約 20 年就達到, 30 年複利會再多), d 係估算過高。記住: 30 年複利 ≈ 本金 × 2.81 (對 3.5%)。'
  difficulty: 3
  tags:
  - calculation
  - scenario
- id: '6.5'
  question: Rule of 72 嘅作用係乜?
  options:
    a: '心算本金翻倍需要嘅年數, 公式: 72 / 年利率(%)'
    b: 計算複利嘅稅後回報
    c: 預測股票價格
    d: 計算單利總額
  answer: a
  explanation: 'Rule of 72 係一個實用估算: 本金翻倍年數 ≈ 72 / 年利率(%)。例如 6% 利率 → 約 12 年翻倍。局限: 5-12%
    利率範圍最準, 太高/太低有 ±10% 誤差。'
  difficulty: 1
  tags:
  - terminology
  - formula
- id: '6.6'
  question: 如果你想 10 年後將 $10,000 變 $20,000, 用複利需要年利率大約幾多?
  options:
    a: 10%
    b: 7.18%
    c: 5%
    d: 20%
  answer: b
  explanation: '用複利公式: $20,000 = $10,000 × (1+r)^10 → (1+r)^10 = 2 → 1+r = 2^(1/10)
    = 1.0718 → r = 7.18%。用單利需要 10% (計: $10,000 + $10,000 × r × 10 = $20,000 → r =
    10%)。複利低 2.82% 已經達標, 證明複利威力。'
  difficulty: 3
  tags:
  - calculation
  - scenario
- id: '6.7'
  question: 以下邊個情境用複利?
  options:
    a: 信用卡欠款 $10,000, 年利率 30%, 月結複利
    b: 私人貸款, 按月平息還款
    c: 政府 T-Bill, 到期一次過還本付息
    d: 香港銀行 1 年定存, 到期拎晒利息
  answer: a
  explanation: '信用卡係典型複利: 結餘每日計息, 月結複利, 所以卡數越滾越大。b 係平息 (近似單利), c 係到期一次過計息,
    d 拎走利息 = 單利效果。記住:
    借貸複利對你有害 (卡數), 投資複利對你有利 (投資/退休)。'
  difficulty: 2
  tags:
  - concept
  - scenario
- id: '6.8'
  question: 30 年後, $100,000 本金用 4% 單利 vs 4% 複利 (年滾存), 終值差距大約幾多?
  options:
    a: $20,000 (10%)
    b: $100,000 (45%)
    c: $200,000 (90%)
    d: $0 (一樣)
  answer: b
  explanation: '單利 30 年: $100,000 × 4% × 30 = $120,000 利息, 終值 $220,000。複利 30 年: $100,000
    × (1.04)^30 = $324,340。差 $324,340 - $220,000 = $104,340, 約 47% 差距。30 年時間放大複利效應,
    接近翻倍。'
  difficulty: 3
  tags:
  - calculation
  - scenario
- id: '6.9'
  question: 點解越早開始儲蓄, 退休時資產越多?
  options:
    a: 因為年輕人風險承受力高, 投資回報較好
    b: 因為年輕人投資知識較多
    c: 因為複利需要時間累積, 越早開始, 滾存年期越長
    d: 因為年輕時負擔較少, 可以儲更多
  answer: c
  explanation: 複利嘅核心係「時間」。差 10 年開始儲蓄, 假設同樣月供 $3,000 同 8% 年回報, 25 歲開始 65 歲有 ~$10.5M, 35
    歲開始只有 ~$4.5M。差 10 年, 終值差 2.3 倍。唔係年輕人特別聰明/儲得多, 純粹係時間畀複利滾。**時間係複利嘅朋友, 越長越幫你**。
  difficulty: 2
  tags:
  - concept
  - application
- id: '6.10'
  question: 你每月用信用卡簽 $5,000, 年利率 30% 月結複利, 1 年後如果完全冇還, 卡數大約幾多?
  options:
    a: $10,000 (本金翻倍)
    b: $5,000 (本金)
    c: $5,344 (月息 0.6%, 1 年)
    d: $6,500 (月息 2.5%, 1 年)
  answer: d
  explanation: '信用卡年利率 30% → 月利率 30% ÷ 12 = 2.5%。月結複利 1 年: $5,000 × (1 + 0.025)^12
    = $5,000 × 1.3449 ≈ $6,724, 最接近 d 嘅 $6,500。記住: 卡數唔還 = 30% 年利率複利, 一年後本 + 息已經滾大約 34%。
    **卡數係普通人最大嘅財務陷阱**。'
  difficulty: 3
  tags:
  - calculation
  - scenario
  - misconception

