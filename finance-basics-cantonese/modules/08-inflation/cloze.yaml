- id: "c.1"
  question: "通脹 (Inflation) 係指一般物價持續上升, 令 {錢購買力下降}。主要原因包括 {需求拉動}、{成本推動} 同 {貨幣供應}。"
  answer: "錢購買力下降、需求拉動、成本推動、貨幣供應"
  explanation: "需求拉動 (錢追貨)、成本推動 (原料貴)、貨幣供應 (央行印錢) 都係通脹成因。"
  difficulty: 1
  tags: [terminology]

- id: "c.2"
  question: "香港 CPI 包括 {住屋 34%}、{食物 27%}、{交通 7%}、{醫療 7%} 等。最大比重係 {住屋}。"
  answer: "住屋 34%、食物 27%、交通 7%、醫療 7%、住屋"
  explanation: "住屋比重大因為香港人 30-40% 收入用喺住屋。"
  difficulty: 1
  tags: [terminology]

- id: "c.3"
  question: "實質回報公式係 {(1 + 名義) / (1 + 通脹) - 1}。當通脹 {3%}、銀行定存 {5%} 時, 實質回報約 {1.94%}。"
  answer: "(1 + 名義) / (1 + 通脹) - 1、3%、5%、1.94%"
  explanation: "Fisher 精確公式。簡化版 (通脹細) 名義-通脹 ≈ 實質, 但精確 1.94% 唔係 2%。"
  difficulty: 2
  tags: [formula]

- id: "c.4"
  question: "Rule of 72 用嚟計 {幾多年後購買力減半}。香港通脹 3%, 即係 {24 年} 後 $100 只值 $50。"
  answer: "幾多年後購買力減半、24 年"
  explanation: "72 ÷ 3% = 24。精確計: 100 / (1.03)²⁴ ≈ $49.2, 接近 $50。"
  difficulty: 1
  tags: [terminology]

- id: "c.5"
  question: "Rule of 72 真實公式係 {69.3 / r × 100}, 用 72 因為 {易記 + 對小利率 < 10% 夠準}。"
  answer: "69.3 / r × 100、易記 + 對小利率 < 10% 夠準"
  explanation: "真實係 log(2)/log(1+r) × 100 = 69.3/r。用 72 整數易記, 對 r < 10% 夠準。"
  difficulty: 2
  tags: [formula]

- id: "c.6"
  question: "$100000 放床下底, 通脹 3%, 10 年後購買力剩 {約 $74,000}。投資股票 30 年 (實質 6%), 變成 {約 $574,000}。"
  answer: "約 $74,000、約 $574,000"
  explanation: "現金實質每年 -3%, 股票實質 6%, 30 年差距 10 倍。"
  difficulty: 2
  tags: [calculation]

- id: "c.7"
  question: "對抗通脹嘅常見工具包括 {股票}、{房地產}、{通脹掛鈎債券 (iBond)} 同 {商品 (黃金)}。最簡單係 {投資追蹤指數 ETF}。"
  answer: "股票、房地產、通脹掛鈎債券 (iBond)、商品 (黃金)、投資追蹤指數 ETF"
  explanation: "股票/房地產租金跟通脹升, iBond 本金跟 CPI 調整, 黃金傳統對沖。最簡單係 ETF (盈富 2800.HK)。"
  difficulty: 1
  tags: [application]

- id: "c.8"
  question: "退休規劃要計 {實質} 回報, 唔係 {名義}。目標 {1000 萬 (今日錢)}, 30 年後通脹 3% 計要 {~2400 萬 (未來錢)}。"
  answer: "實質、名義、1000 萬 (今日錢)、~2400 萬 (未來錢)"
  explanation: "今日嘅 1000 萬, 30 年後通脹 3% 要 1000 × (1.03)³⁰ ≈ 2427 萬先夠。"
  difficulty: 2
  tags: [application, formula]

- id: "c.9"
  question: "現金擺床下底: 名義 {0%}、通脹 {3%}、實質 {-3%}。定存 5% 通脹 3%: 名義 {5%}、實質 {+1.94%}。"
  answer: "0%、3%、-3%、5%、+1.94%"
  explanation: "現金實質 -3% (蝕), 定存 5% 實質 +1.94% (微賺)。投資一定要高過通脹先有實質正回報。"
  difficulty: 2
  tags: [calculation]

- id: "c.10"
  question: "通脹 5% 時, Rule of 72 計 {14.4 年} 後購買力減半。通脹 10% 時, {7.2 年} 後減半。"
  answer: "14.4 年、7.2 年"
  explanation: "72/5 = 14.4, 72/10 = 7.2。通脹愈高, 錢貶值愈快。"
  difficulty: 2
  tags: [calculation]
