  question: "矽谷銀行 2023 倒閉 4 個 Bias 互動: {Anchoring} (30 年安全歷史)、{Confirmation} (同業話放心)、{Overconfidence} (研究過唔會倒)、{Availability} (媒體報穩陣)。結果: {48 小時內擠提倒閉}。"
  answer: "Anchoring、Confirmation、Overconfidence、Availability、48 小時內擠提倒閉"
