  question: "What is the primary difference between a traditional developer and an agentic developer?"
  options:
    a: "Agentic developers write more code"
    b: "Agentic developers delegate coding tasks to AI agents while focusing on architecture and review"
    c: "Agentic developers do not need to understand code"
