- type: mcq
  question: A bond trades below par. Its coupon rate versus yield relationship?
  options:
    b: Coupon < yield
    a: Coupon > yield
    c: Equal
    d: Undefined
  answer: b
  explanation: 'Discount price implies the market demands more than the coupon pays: yield exceeds coupon.'
  difficulty: 2
  tags:
  - calculation
  id: cum.1
  source_modules:
  - 1
- type: mcq
  question: Which cash-flow feature most complicates bond pricing math?
  options:
    c: Embedded options like calls changing expected life
    a: Ticker symbols
    b: Settlement currency
    d: ISIN length
  answer: c
  explanation: Calls/puts make cash flows path-dependent, requiring scenario or OAS pricing instead of
    a single discounting.
  difficulty: 2
  tags:
  - concept
  id: cum.2
  source_modules:
  - 2
