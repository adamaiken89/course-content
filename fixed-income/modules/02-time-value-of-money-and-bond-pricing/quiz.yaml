- id: '2.1'
  question: Present value of $5,000 received in 4 years, discount rate 6% annually?
  options:
    a: $3,960.47
    b: $3,500.00
    c: $4,200.00
    d: $4,716.98
  answer: a
  explanation: PV = 5,000 / (1.06)^4 = 5,000 / 1.2625 = $3,960.47
  difficulty: 1
  tags:
  - calculation
  - tvm
- id: '2.2'
  question: What is bond price formula based on?
  options:
    b: Sum of present value of all future cash flows
    a: Average of past prices
    c: Issuer's credit rating
    d: Stock price of issuer
  answer: b
  explanation: Bond price = PV(coupons) + PV(face value). Bond is series of future
    cash flows discounted at market yield.
  difficulty: 1
  tags:
  - terminology
  - pricing
- id: '2.3'
  question: 5yr bond, 8% coupon semi-annual, YTM 6%. How many periods and periodic
    yield?
  options:
    b: 10 periods, 3% periodic yield
    a: 5 periods, 6% periodic yield
    c: 10 periods, 6% periodic yield
    d: 5 periods, 3% periodic yield
  answer: b
  explanation: 'Semi-annual: periods = 5 × 2 = 10. Periodic yield = 6%/2 = 3%. Periodic
    coupon = 8%/2 × $1,000 = $40.'
  difficulty: 1
  tags:
  - calculation
  - semi-annual
- id: '2.4'
  question: Bond pays $25 coupon semi-annually, face $1,000, 3yr maturity, YTM 4%.
    What is price?
  options:
    d: $1,027.57
    a: $972.50
    b: $1,000.00
    c: $1,083.33
  answer: d
  explanation: Periodic coupon = $25, periods = 6, periodic yield = 2%. PV coupons
    = 25 × [1-1.02^-6]/0.02 = 25 × 5.601 = $140.03. PV principal = 1000/1.02^6 = $887.54.
    Total = $1,027.57
  difficulty: 2
  tags:
  - calculation
  - pricing
- id: '2.5'
  question: Clean price $980, accrued interest $12.50. What does buyer actually pay?
  options:
    b: $992.50
    a: $967.50
    c: $980.00
    d: $1,000.00
  answer: b
  explanation: Dirty price = clean + accrued = $980 + $12.50 = $992.50. Buyer pays
    dirty price.
  difficulty: 2
  tags:
  - terminology
  - settlement
- id: '2.6'
  question: YTM assumes which reinvestment condition?
  options:
    c: Coupons reinvested at same YTM
    a: Coupons reinvested at risk-free rate
    b: Coupons not reinvested
    d: Coupons reinvested at current yield
  answer: c
  explanation: YTM assumes all coupons reinvested at same YTM rate. If reinvestment
    rates differ, realized return differs from YTM.
  difficulty: 2
  tags:
  - terminology
  - ytm
- id: '2.7'
  question: Private bank client buys bond quoted at 101.25 clean. Coupon 4% semi-annual,
    90 days since last coupon (182-day period). What dirty price?
  options:
    a: $1,022.39
    b: $1,012.50
    c: $1,014.55
    d: $1,032.74
  answer: a
  explanation: Clean = $1,012.50. Accrued = (4%/2) × (90/182) × $1,000 = 2% × 0.495
    × $1,000 = $9.89. Dirty = $1,012.50 + $9.89 = $1,022.39
  difficulty: 2
  tags:
  - scenario
  - private-bank
- id: '2.8'
  question: Spot rate differs from YTM because...
  options:
    d: Spot rate applies a unique rate per maturity, YTM applies one rate to all cash
      flows
    a: Spot rate applies one discount rate to all cash flows
    b: YTM applies different rates per period
    c: They are identical
  answer: d
  explanation: Spot rates are unique zero-coupon rates per maturity. YTM is single
    flat rate applied to all cash flows of a bond.
  difficulty: 3
  tags:
  - terminology
  - spot-rates
- id: '2.9'
  question: 'Bond: $1,000 face, 6% coupon annual, 4yr, price $980. Approximate YTM?'
  options:
    c: 6.47%
    a: 5.76%
    b: 6.00%
    d: 7.12%
  answer: c
  explanation: 'Approx YTM = [60 + (1000-980)/4] / [(1000+980)/2] = [60+5]/990 = 65/990
    = 6.57%. Closest: 6.47% using more precise calc.'
  difficulty: 3
  tags:
  - calculation
  - ytm
- id: '2.10'
  question: Which scenario would make realized return diverge MOST from YTM?
  options:
    a: Bond held to maturity, reinvestment rates fall sharply
    b: Bond held to maturity, reinvestment rates constant
    c: Bond sold before maturity at unchanged yields
    d: Bond held to maturity in flat yield curve environment
  answer: a
  explanation: YTM assumes reinvestment at same rate. If rates fall, reinvested coupons
    earn less → realized return < YTM. This reinvestment risk is greatest when coupons
    are large and rates volatile.
  difficulty: 3
  tags:
  - scenario
  - ytm
  - risk

