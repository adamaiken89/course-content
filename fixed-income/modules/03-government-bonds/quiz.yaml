- id: '3.1'
  question: T-Bill with 180 days to maturity, discount rate 3.5%. Price per $1M face?
  options:
    a: $982,500
    b: $965,000
    c: $990,000
    d: $1,000,000
  answer: a
  explanation: Price = 1,000,000 × (1 - 0.035 × 180/360) = 1,000,000 × 0.9825 = $982,500
  difficulty: 1
  tags:
  - calculation
  - treasuries
- id: '3.2'
  question: Which Treasury type pays semi-annual coupon and has 10-year maturity?
  options:
    b: T-Note
    a: T-Bill
    c: T-Bond
    d: STRIPS
  answer: b
  explanation: 'T-Notes: 2-10yr, semi-annual coupon. T-Bills ≤1yr zero. T-Bonds 20-30yr.
    STRIPS are zero-coupon.'
  difficulty: 1
  tags:
  - terminology
  - treasuries
- id: '3.3'
  question: On-the-run Treasury yield is typically ___ off-the-run Treasury yield.
  options:
    a: lower than
    b: higher than
    c: equal to
    d: unrelated to
  answer: a
  explanation: On-the-run most liquid → investors accept lower yield (higher price).
    Off-the-run less liquid → higher yield compensation.
  difficulty: 2
  tags:
  - terminology
  - liquidity
- id: '3.4'
  question: How many STRIPS securities can be created from one 10yr Treasury with
    4% semi-annual coupon?
  options:
    d: '21'
    a: '1'
    b: '10'
    c: '20'
  answer: d
  explanation: 20 semi-annual coupons + 1 principal repayment = 21 separate zero-coupon
    securities.
  difficulty: 2
  tags:
  - terminology
  - strips
- id: '3.5'
  question: 'STRIPS appeal to investors seeking:'
  options:
    b: Known future value with no reinvestment risk
    a: Maximum current income
    c: Inflation protection
    d: Short-term liquidity
  answer: b
  explanation: STRIPS = zero-coupon → known maturity value. No coupon reinvestment
    risk. Price volatile (long duration).
  difficulty: 2
  tags:
  - scenario
  - strips
- id: '3.6'
  question: 'Fannie Mae bonds yield more than Treasuries because:'
  options:
    c: Credit risk premium (no explicit government guarantee)
    a: Longer maturity
    b: Higher coupon rate
    d: Lower liquidity only
  answer: c
  explanation: Agencies have implicit but not explicit government backing → credit
    premium over Treasuries. Also liquidity premium.
  difficulty: 2
  tags:
  - terminology
  - agencies
- id: '3.7'
  question: 'Private bank client asks: why does 10yr Treasury yield affect my corporate
    bond portfolio?'
  options:
    a: Corporate bonds priced as spread over Treasury benchmark
    b: It doesn't
    c: Treasury yields are unrelated to corporate credit
    d: Only stock market affects corporate bonds
  answer: a
  explanation: Corporate bond yield = Treasury benchmark + credit spread. Treasury
    move directly impacts corporate yields even if spread unchanged.
  difficulty: 2
  tags:
  - scenario
  - private-bank
- id: '3.8'
  question: 'Client calls: ''my TIPS principal adjusted up 2% with CPI. Did I earn
    2%?'''
  options:
    d: No, total return = coupon + inflation adjustment. Nominal return includes both
    a: Yes, 2% total return
    b: Only if held in taxable account
    c: TIPS don't pay coupons
  answer: d
  explanation: TIPS total return = real coupon + inflation adjustment to principal.
    The 2% CPI adjustment is part of return, not total return.
  difficulty: 3
  tags:
  - scenario
  - tips
- id: '3.9'
  question: Which is NOT a risk for Treasury bond investors?
  options:
    b: Credit default risk
    a: Interest rate risk
    c: Reinvestment risk
    d: Inflation risk
  answer: b
  explanation: Treasuries considered free of credit/default risk (full faith of US
    govt). Interest rate, reinvestment, and inflation risks remain.
  difficulty: 1
  tags:
  - terminology
  - risk
- id: '3.10'
  question: Bond equivalent yield of 180-day T-Bill priced at $980,000 per $1M face?
  options:
    c: 4.14%
    a: 3.50%
    b: 2.00%
    d: 4.00%
  answer: c
  explanation: BEY = (1,000,000-980,000)/980,000 × 365/180 = 20,000/980,000 × 2.0278
    = 4.14%
  difficulty: 3
  tags:
  - calculation
  - treasuries

