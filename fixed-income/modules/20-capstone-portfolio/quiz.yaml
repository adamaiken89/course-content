- id: '20.6'
  question: 'If yields rise 75bps as predicted, approximate portfolio price change
    (duration 4.5yr, convexity 0.4):'
  options:
    a: -3.375% + convexity adjustment of +0.1125% = -3.26%
    b: -7.5% + convexity adjustment of +0.4% = -7.1%
    c: -4.5% only
    d: +3.375% + convexity adjustment
  answer: a
  explanation: 'Duration effect = -4.5 × 0.75 = -3.375%. Convexity = 0.5 × 0.4 × (0.0075)^2
    = +0.1125%. Net = -3.26%. Note convexity formula: 0.5 × C × (Δy)^2.'
  difficulty: 3
  tags:
  - capstone
  - duration
  - convexity
  - calculation
- id: '20.7'
  question: 'Primary reason to avoid long-dated corporate bonds in this portfolio:'
  options:
    a: Most price sensitivity to rate increases + lower liquidity
    b: Too much yield
    c: Tax treatment different for long bonds
    d: ESG restrictions prohibit it
  answer: a
  explanation: Bearish rate view + long duration = maximum price decline. Also long
    corporate bonds less liquid than short/intermediate.
  difficulty: 2
  tags:
  - capstone
  - corporate bonds
  - duration
- id: '20.8'
  question: Agency MBS limited to 10% of portfolio. Which risk does this primarily
    control?
  options:
    d: Prepayment risk / negative convexity in falling rate environment
    a: Credit risk (agency MBS are risk-free)
    b: Liquidity risk
    c: Currency risk
  answer: d
  explanation: Agency MBS have negative convexity from prepayment risk. Limiting to
    10% controls convexity exposure that could distort portfolio duration.
  difficulty: 3
  tags:
  - capstone
  - MBS
  - convexity
  - risk
- id: '20.9'
  question: Client's TIPS allocation provides inflation hedge. Risk of placing TIPS
    in taxable account (vs IRA)?
  options:
    b: Both B and C apply
    a: TIPS have no special tax treatment
    c: TIPS generate phantom income — annual inflation adjustment taxed as income
    d: TIPS interest is exempt from state tax but not federal
  answer: b
  explanation: TIPS generate phantom income (inflation adjustment taxed yearly even
    though not received as cash). Interest exempt from state/local but taxable federally.
    For high-tax client, this creates cash-flow mismatch.
  difficulty: 3
  tags:
  - capstone
  - TIPS
  - tax
  - phantom income
- id: '20.10'
  question: Which rebalancing trigger is MOST important for maintaining portfolio
    risk profile?
  options:
    c: Duration rebalancing semi-annually (duration drifts as time passes and rates
      change)
    a: Rebalancing to yield targets monthly
    b: Rebalancing by bond rating quarterly
    d: Rebalancing based on tax-loss harvesting opportunities
  answer: c
  explanation: Duration drifts naturally as bonds age and rates move, changing portfolio
    risk profile. Semi-annual duration rebalancing keeps risk consistent with IPS.
  difficulty: 2
  tags:
  - capstone
  - rebalancing
  - risk

