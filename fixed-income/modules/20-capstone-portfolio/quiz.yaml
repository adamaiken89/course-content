- id: '20.1'
  question: 'Capstone portfolio $5M, target duration 4.5 years. Upgrade to Step 3:
    why underweight duration vs Bloomberg Agg (6yr) given bearish rate view?'
  options:
    a: Lower duration means less price decline when yields rise
    b: Longer duration bonds always have lower yields
    c: Bloomberg Agg includes equities
    d: Duration has no impact on portfolio returns
  answer: a
  explanation: Shorter duration = less sensitivity to rate increases. If yields rise
    50bps, 4.5yr duration portfolio falls ~2.25% vs 3% for 6yr duration.
  difficulty: 2
  tags:
  - capstone
  - duration
  - rate view
- id: '20.2'
  question: 'Tax-equivalent yield on muni yielding 2.7% given 48.4% tax rate:'
  options:
    c: 5.23%
    a: 2.70%
    b: 3.98%
    d: 6.35%
  answer: c
  explanation: TEY = 2.7% / (1 - 0.484) = 2.7% / 0.516 = 5.23%. Munis highly valuable
    for this client.
  difficulty: 2
  tags:
  - capstone
  - muni
  - tax
  - calculation
- id: '20.3'
  question: Portfolio generates $210K pre-tax income. Client needs $400K total. How
    to close gap?
  options:
    d: Supplement with equity dividends and real estate cash flow
    a: Increase bond portfolio to $10M
    b: Sell equities and buy more bonds
    c: Use margin loan to pay remainder
  answer: d
  explanation: Bond portfolio covers ~$255K incl. tax benefit. Remaining income from
    existing equity dividends ($5M, ~1.5-2% = $75-100K) and real estate ($3M, ~3-5%
    = $90-150K) closes gap.
  difficulty: 2
  tags:
  - capstone
  - income
  - portfolio construction
- id: '20.4'
  question: Client needs $1M liquidity for real estate in 2-3 years. Best asset to
    allocate for this?
  options:
    b: 1-5yr Treasury ladder + cash equivalents (20% of portfolio)
    a: 10-year corporate bonds
    c: High-yield bonds with high coupon
    d: Long-duration muni bonds
  answer: b
  explanation: 'Short Treasuries and cash provide predictable liquidity without forced
    sale losses. Total: $750K Treasuries + $250K cash = $1M.'
  difficulty: 2
  tags:
  - capstone
  - liquidity
  - allocation
