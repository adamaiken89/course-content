- id: '9.1'
  question: 'Macaulay duration of a zero-coupon bond equals:'
  options:
    b: Its maturity
    a: Half its maturity
    c: Zero
    d: Its modified duration
  answer: b
  explanation: 'Zero-coupon: single cash flow at maturity. Weighted avg time = maturity.'
  difficulty: 1
  tags:
  - terminology
  - duration
- id: '9.2'
  question: Modified duration 6.5, yield +0.25%. Approximate price change?
  options:
    b: -1.63%
    a: +1.63%
    c: -0.16%
    d: +0.16%
  answer: b
  explanation: ΔP ≈ -Modified D × Δyield = -6.5 × 0.0025 = -0.01625 = -1.63%
  difficulty: 1
  tags:
  - calculation
  - duration
- id: '9.3'
  question: 'Two bonds same maturity. Bond A: 5% coupon. Bond B: 2% coupon. Which
    has higher duration?'
  options:
    a: Bond B
    b: Bond A
    c: Equal
    d: Cannot determine
  answer: a
  explanation: Lower coupon → more weight on distant principal → higher duration.
    Bond B has higher duration.
  difficulty: 2
  tags:
  - scenario
  - duration
- id: '9.4'
  question: DV01 (PVBP) = $450. Yield +5bp. Approximate dollar loss?
  options:
    c: $2,250
    a: $450
    b: $900
    d: $90
  answer: c
  explanation: $450 per bp × 5bp = $2,250
  difficulty: 2
  tags:
  - calculation
  - pvbp
- id: '9.5'
  question: 'Key-rate duration used for:'
  options:
    b: Analyzing sensitivity to specific maturity points on curve
    a: Measuring credit risk
    c: Calculating YTM
    d: Measuring convexity
  answer: b
  explanation: Key-rate D measures sensitivity to 1bp change at specific maturity
    (e.g., 2yr, 10yr). Useful for non-parallel shifts.
  difficulty: 2
  tags:
  - terminology
  - key-rate
- id: '9.6'
  question: 'Barbell portfolio: 50% in 2yr (D=1.9), 50% in 30yr (D=18). Portfolio
    D?'
  options:
    a: '9.95'
    b: '10.50'
    c: '19.90'
    d: '15.00'
  answer: a
  explanation: Portfolio D = 0.5 × 1.9 + 0.5 × 18 = 0.95 + 9 = 9.95
  difficulty: 2
  tags:
  - calculation
  - portfolio
- id: '9.7'
  question: Private bank client holds $10M bonds, D=7.0. Rates rise 30bp. Expected
    P&L?
  options:
    d: -$210,000
    a: +$210,000
    b: -$70,000
    c: +$70,000
  answer: d
  explanation: ΔP ≈ -D × Δy × P = -7.0 × 0.003 × $10M = -$210,000
  difficulty: 2
  tags:
  - scenario
  - private-bank
- id: '9.8'
  question: 'Modified D = Macaulay D / (1 + YTM/k). k stands for:'
  options:
    a: Periods per year
    b: Coupon rate
    c: Years to maturity
    d: Face value
  answer: a
  explanation: k = payment periods per year (2 for semi-annual). Adjusts Macaulay
    D to periodic yield.
  difficulty: 2
  tags:
  - terminology
  - calculation
- id: '9.9'
  question: Duration assumes which yield curve shift?
  options:
    d: Parallel
    a: Non-parallel
    b: Curve flattening
    c: Curve steepening
  answer: d
  explanation: Duration is linear approximation for parallel yield shifts. For non-parallel,
    key-rate duration needed.
  difficulty: 2
  tags:
  - terminology
  - limitation
- id: '9.10'
  question: 'Bond with high duration benefits most from:'
  options:
    c: Falling interest rates
    a: Rising interest rates
    b: Rising inflation
    d: Credit downgrade
  answer: c
  explanation: High duration → greater sensitivity to rate moves. Rates fall → price
    rises more for high-duration bond.
  difficulty: 1
  tags:
  - scenario
  - duration

