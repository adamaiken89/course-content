  - liquidity
- id: '13.6'
  question: 'Portfolio trading allows:'
  options:
    d: Trading entire bond portfolio in single block
    a: Trading only one bond at a time
    b: Buying bond ETFs only
    c: Trading on margin
  answer: d
  explanation: 'Portfolio trading: list of bonds traded as single risk transfer. Growing
    trend, especially for IG.'
  difficulty: 2
  tags:
  - terminology
  - trading
- id: '13.7'
  question: Private bank client wants to buy $10M of a small muni issue. Expected
    liquidity?
  options:
    a: Illiquid — wide spreads, hard to find natural seller
    b: Very liquid — tight spreads
    c: Same as on-the-run Treasury
    d: Guaranteed execution at mid-price
  answer: a
  explanation: 'Small muni issues: infrequent trading, limited dealer inventory →
    wide spreads, difficult execution for size.'
  difficulty: 2
  tags:
  - scenario
  - private-bank
- id: '13.8'
  question: 'All-to-all trading means:'
  options:
    c: Any market participant can trade with any other
    a: Dealers only trade with each other
    b: Only central bank trades
    d: Retail only
  answer: c
  explanation: 'All-to-all: platforms allow investors to trade directly with each
    other, not just through dealers.'
  difficulty: 2
  tags:
  - terminology
  - electronic
- id: '13.9'
  question: Which factor MOST affects corporate bond bid-ask spread?
  options:
    b: Liquidity (trade frequency, issue size)
    a: Coupon rate
    c: Accrued interest
    d: Day of week
  answer: b
  explanation: 'Liquidity dominates: frequent trading + large issue size → tight spreads.
    Illiquid bonds have wide spreads.'
  difficulty: 2
  tags:
  - terminology
  - liquidity
- id: '13.10'
  question: 'Dealers widen spreads during stress because:'
  options:
    b: Inventory risk increases — harder to hedge, capital constrained
    a: They want higher profits
    c: Regulations require it
    d: Clients prefer wider spreads
  answer: b
  explanation: 'Stress: dealer inventory risk rises, bid-ask hedging cost increases,
    balance sheet constraints bind. Wider spreads compensate.'
  difficulty: 3
  tags:
  - scenario
  - dealer

