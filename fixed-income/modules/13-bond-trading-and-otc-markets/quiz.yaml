- id: '13.4'
  question: 'HY corporate bond typical bid-ask spread:'
  options:
    d: 25-100bp
    a: 1-5bp
    b: 5-10bp
    c: 200-500bp
  answer: d
  explanation: 'HY bonds: less liquid, higher credit risk → wider spreads. Typically
    25-100bp depending on rating and size.'
  difficulty: 2
  tags:
  - terminology
  - liquidity
- id: '13.5'
  question: 'Bond market liquidity in March 2020:'
  options:
    b: Deteriorated sharply (spreads blew out)
    a: Improved significantly
    c: Remained unchanged
    d: Moved to exchange trading
  answer: b
  explanation: 'COVID stress: liquidity evaporated. IG spreads jumped from 10bp to
    100bp+. Fed intervention restored function.'
  difficulty: 2
  tags:
