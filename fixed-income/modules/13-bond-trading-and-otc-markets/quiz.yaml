- id: '13.1'
  question: 'Bonds primarily trade on:'
  options:
    a: Over-the-counter (dealer network)
    b: Centralized stock exchanges
    c: Futures exchanges
    d: Electronic auction every hour
  answer: a
  explanation: Bonds trade OTC. Dealers quote prices to customers. No centralized
    exchange like equities.
  difficulty: 1
  tags:
  - terminology
  - market
- id: '13.2'
  question: 'On-the-run 10yr Treasury typical bid-ask spread:'
  options:
    a: 0.5-1bp
    b: 10-20bp
    c: 25-50bp
    d: 100bp
  answer: a
  explanation: 'On-the-run Treasuries: most liquid instrument globally. 0.5-1bp typical.'
  difficulty: 1
  tags:
  - terminology
  - liquidity
- id: '13.3'
  question: 'TRACE provides:'
  options:
    c: Post-trade transparency for corporate bonds
    a: Real-time equity prices
    b: Credit ratings
    d: Currency exchange rates
  answer: c
  explanation: 'TRACE (FINRA): all corporate bond trades reported publicly. Price,
    volume, yield.'
