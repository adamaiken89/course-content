- id: '12.1'
  question: 'In CDS, protection buyer:'
  options:
    b: Makes periodic payments to seller
    a: Receives premium
    c: Has no counterparty risk
    d: Must own the underlying bond
  answer: b
  explanation: Protection buyer pays periodic premium (CDS spread) to seller. In return,
    seller compensates if credit event occurs.
  difficulty: 1
  tags:
  - terminology
  - cds
- id: '12.2'
  question: 'Standard running coupon for IG CDS is:'
  options:
    b: 100bp
    a: 50bp
    c: 500bp
    d: 1000bp
  answer: b
  explanation: IG standard coupon = 100bp. HY = 500bp. Upfront payment adjusts for
    difference vs market spread.
  difficulty: 1
  tags:
  - terminology
  - cds
- id: '12.3'
  question: Which ISDA credit event applies only to corporates?
  options:
    c: Bankruptcy
    a: Failure to pay
    b: Restructuring
    d: Repudiation
  answer: c
  explanation: Bankruptcy is corporate-specific. Repudiation/moratorium is sovereign-specific.
    Failure to pay and restructuring apply to both.
  difficulty: 2
  tags:
  - terminology
  - credit-events
- id: '12.4'
  question: Recovery = 30%, PD = 3%. Fair CDS spread estimate?
  options:
    a: 210bp
    b: 90bp
    c: 180bp
    d: 300bp
  answer: a
  explanation: Spread ≈ (1-0.30) × 3% = 0.70 × 3% = 2.1% = 210bp
  difficulty: 2
  tags:
  - calculation
  - cds
- id: '12.5'
  question: 'CDS basis = -40bp means:'
  options:
    a: CDS spread < bond spread by 40bp
    b: CDS spread > bond spread by 40bp
    c: Bond is trading at discount
    d: CDS has no value
  answer: a
  explanation: 'Basis = CDS - bond spread. Negative: CDS cheaper than cash bond. Buy
    bond, buy CDS → arb profit.'
  difficulty: 2
  tags:
  - terminology
  - basis
- id: '12.6'
  question: CDX.NA.IG contains how many North American IG entities?
  options:
    c: '125'
    a: '50'
    b: '100'
    d: '250'
  answer: c
  explanation: CDX.NA.IG = 125 IG names. CDX.NA.HY = 100 HY names. iTraxx Europe =
    125 names.
  difficulty: 2
  tags:
  - terminology
  - indices
- id: '12.7'
  question: What happens to CDS if reference entity defaults?
  options:
    d: Protection seller pays protection buyer (par - recovery)
    a: CDS expires worthless
    b: Both parties terminate
    c: CDS continues with different entity
  answer: d
  explanation: Credit event → auction determines recovery price. Seller pays buyer
    (par - recovery) × notional.
  difficulty: 2
  tags:
  - scenario
  - cds
- id: '12.8'
  question: 'Negative basis trade:'
  options:
    b: Buy bond, buy CDS
    a: Short bond, sell CDS
    c: Buy bond, sell CDS
    d: Short bond, buy CDS
  answer: b
  explanation: Negative basis = CDS cheap vs cash. Buy bond (earn spread), buy CDS
    (pay cheap premium). Net positive carry + hedged.
  difficulty: 3
  tags:
  - scenario
  - basis
- id: '12.9'
  question: Private bank client wants to hedge credit risk without selling bonds.
    Best tool?
  options:
    a: CDS
    b: Treasury future
    c: Interest rate swap
    d: Equity put
  answer: a
  difficulty: 2
  tags:
  - scenario
  - private-bank
- id: '12.10'
  question: 'CDS indices roll every:'
  options:
    d: Every 6 months
    a: Monthly
    b: Quarterly
    c: Annually
  answer: d
  explanation: CDX and iTraxx roll every 6 months (March/September). New series issued
    with updated constituent list.
  difficulty: 2
