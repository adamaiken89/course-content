- id: '1.1'
  question: A bond with face value $1,000 and coupon rate 6% pays how much annually?
  options:
    d: $60
    a: $6
    b: $600
    c: $1,060
  answer: d
  explanation: Annual coupon = coupon rate × face value = 0.06 × $1,000 = $60
  difficulty: 1
  tags:
  - terminology
  - calculation
- id: '1.2'
  question: Bond selling above face value is called a ___ bond
  options:
    d: premium
    a: discount
    b: par
    c: zero-coupon
  answer: d
  explanation: 'Premium bond: market price > face value. Yield < coupon rate.'
  difficulty: 1
  tags:
  - terminology
- id: '1.3'
  question: If market interest rates rise, what happens to existing bond prices?
  options:
    a: They fall
    b: They rise
    c: They stay the same
    d: They double
  answer: a
  explanation: Inverse relationship. New bonds pay higher coupons → old bonds less
    attractive → price falls to match yield.
  difficulty: 1
  tags:
  - pricing
  - core
- id: '1.4'
  question: Current yield is $50 annual coupon / $950 market price. What is it?
  options:
    a: 5.26%
    b: 5.00%
    c: 4.76%
    d: 5.50%
  answer: a
  explanation: $50/$950 = 0.0526 = 5.26%. Current yield ignores maturity gain/loss.
  difficulty: 2
  tags:
  - calculation
- id: '1.5'
  question: For a discount bond, which is true?
  options:
    b: Yield > coupon rate
    a: Yield < coupon rate
    c: Yield = coupon rate
    d: Yield is zero
  answer: b
  explanation: 'Discount bond: price < par. Buyer gets coupon + price appreciation
    to par → YTM > coupon rate.'
  difficulty: 2
  tags:
  - pricing
- id: '1.6'
  question: Client holds $5M par of 3% bonds. Market now yields 4%. What best describes
    client's position?
  options:
    a: Bonds trading at discount
    b: Bonds trading at premium
    c: Bonds trading at par
    d: Bonds have been called
  answer: a
  explanation: Market yields (4%) > coupon (3%) → bonds must sell below par to be
    competitive. Client holds discount bonds.
  difficulty: 2
  tags:
  - scenario
  - pricing
- id: '1.7'
  question: Which yield measure accounts for both coupon income AND price change from
    purchase to maturity?
  options:
    b: Yield to Maturity
    a: Current yield
    c: Coupon rate
    d: Dividend yield
  answer: b
  explanation: 'YTM = total return assuming held to maturity: coupons + price convergence
    to par. Current yield ignores price gain/loss.'
  difficulty: 2
  tags:
  - terminology
  - yield
- id: '1.8'
  question: A premium bond is purchased. Which is most likely TRUE over its life?
  options:
    b: Bond price falls towards par at maturity
    a: Bond price rises towards maturity
    c: Bond price stays constant
    d: Bond is always called before maturity
  answer: b
  explanation: Premium bond price gradually declines to par as maturity approaches.
    Buyer loses premium over time, offset by higher coupon.
  difficulty: 3
  tags:
  - scenario
  - pricing
- id: '1.9'
  question: Two bonds identical except Bond A = 5yr maturity, Bond B = 10yr maturity.
    Rates rise 1%. Which price falls more?
  options:
    c: Bond B
    a: Bond A
    b: Both fall equally
    d: Neither price changes
  answer: c
  explanation: Longer maturity = more future cash flows discounted at new higher rate.
    Price impact greater for longer bonds.
  difficulty: 3
  tags:
  - scenario
  - pricing
  - duration-intro
- id: '1.10'
  question: 'Private banking context: client says ''my bond fund lost 2% value this
    month''. Most likely cause?'
  options:
    c: Interest rates increased
    a: Bond default
    b: Coupon payment missed
    d: Fund fees increased
  answer: c
  explanation: Monthly bond fund value changes are overwhelmingly driven by interest
    rate moves (via inverse price relationship). Default is rare for IG.
  difficulty: 2
  tags:
  - scenario
  - private-bank
- id: '1.11'
  question: What is the clean price plus accrued interest called?
  options:
    d: Dirty price
    a: Par value
    b: Coupon rate
    c: Yield to maturity
  answer: d
  explanation: Dirty price = clean price + accrued interest. The actual amount buyer
    pays. Quoted price in market is clean.
  difficulty: 2
  tags:
  - pricing
  - settlement
- id: '1.12'
  question: Which day count convention is used for US Treasury bonds?
  options:
    b: ACT/ACT
    a: 30/360
    c: ACT/360
    d: ACT/365
  answer: b
  explanation: US Treasuries use ACT/ACT (actual days ÷ actual days in period). US
    corporates/munis use 30/360. Money market uses ACT/360.
  difficulty: 3
  tags:
  - day-count
  - terminology
- id: '1.13'
  question: US bond market settles how many business days after the trade date?
  options:
    a: T+1
    b: T+0 (same day)
    c: T+2
    d: T+3
  answer: a
  explanation: US bond market moved to T+1 in May 2024 (was T+2). One business day
    after trade for buyer payment and seller delivery.
  difficulty: 2
  tags:
  - settlement
- id: '1.14'
  question: Bond with 5% semiannual coupon, 90 days into 180-day period. What is accrued
    interest per $1,000 face?
  options:
    c: $12.50
    a: $25.00
    b: $22.50
    d: $5.00
  answer: c
  explanation: Semiannual coupon = $25. Daily = $25/180 = $0.1389. 90 days × $0.1389
    = $12.50 accrued.
  difficulty: 3
  tags:
  - calculation
  - accrued-interest

