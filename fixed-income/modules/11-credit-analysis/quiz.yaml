- id: '11.7'
  question: 'Rising star is:'
  options:
    a: HY to IG upgrade
    b: A tech company IPO
    c: Bond with above-market coupon
    d: TIPS with inflation adjustment
  answer: a
  explanation: 'Rising star: upgraded from HY to IG. New buyer base enters → price
    rally.'
