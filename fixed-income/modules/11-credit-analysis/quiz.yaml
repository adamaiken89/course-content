- id: '11.8'
  question: 'Private bank client wants highest recovery in default. Recommend:'
  options:
    b: Senior secured bond
    a: Subordinated unsecured bond
    c: Preferred stock
    d: Convertible bond
  answer: b
  explanation: 'Senior secured: highest priority. Collateral-backed. Recovery 50-80%.
    Subordinated: 10-30%.'
  difficulty: 1
  tags:
  - scenario
  - private-bank
- id: '11.9'
  question: 'A distressed exchange is considered:'
  options:
    d: Technical default (bondholders accept worse terms)
    a: Normal refinancing
    b: Rating upgrade event
    c: Merger arbitrage
  answer: d
  explanation: 'Distressed exchange: bondholders swap bonds at less-favorable terms.
    Credit event — often treated as default.'
  difficulty: 2
  tags:
  - terminology
  - credit-events
- id: '11.10'
  question: Which industry typically has highest leverage tolerance?
  options:
    b: Utilities
    a: Technology
    c: Energy
    d: Pharmaceuticals
  answer: b
  explanation: 'Utilities: stable cash flows, regulated returns → can support higher
    leverage (3-5x). Tech: low debt typically.'
