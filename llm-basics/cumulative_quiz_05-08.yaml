- id: cum.9
  type: mcq
  source_modules:
  - 6
  question: RLHF 嘅三步係？
  options:
    a: Human compare → Train reward model → RL training
    b: Collect data → Train model → Deploy
    c: Pretrain → Instruct → Align
    d: Tokenize → Embed → Attend
  answer: a
  explanation: 人類比較 outputs → train reward model → 用 RL optimize for high reward。
  difficulty: 2
  tags:
  - process
- id: cum.10
  type: mcq
  source_modules:
  - 8
  question: Self-consistency 喺邊種情況最有用？
  options:
    a: Deterministic 計算
    b: 多種 possible reasoning paths
    c: Fact recall
    d: Single step 問題
  answer: b
  explanation: 多條 reasoning paths converge 到同一答案，你對答案更有信心。
  difficulty: 2
  tags:
  - application
