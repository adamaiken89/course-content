  question: Transformer block 嘅兩個主要部分係？
  options:
    a: Self-Attention + FFN
    b: Tokenizer + Embedding
    c: Encoder + Decoder
    d: Training + Inference
  answer: a
  explanation: Self-attention（資訊交換）+ FFN（資訊處理）係 Transformer block 嘅核心。
  difficulty: 2
  tags:
  - recall
