- id: cum.3
  type: mcq
  source_modules:
  - 7
  question: MoE 嘅關鍵 insight 係？
  options:
    a: 越多 experts 越好
    b: 唔係所有 token 需要全部參數
    c: Router 唔需要 training
    d: MoE replace attention
  answer: b
  explanation: MoE insight = 唔同 token 需要唔同嘅 processing capacity，唔需要 activate 全部參數。
  difficulty: 2
  tags:
  - concept
- id: cum.4
  type: tf
  source_modules:
  - 8
  statement: CoT 嘅「Let's think step by step」對所有問題類型都一樣有效。
  answer: false
  explanation: 對 fact recall（recall only）冇幫助，對 creative tasks 可能 kill 創意。最 effective
    係多步驟推理問題。
  difficulty: 2
  tags:
  - comprehension
- id: cum.5
  type: mcq
  source_modules:
  - 5
  question: Residual connection 嘅主要用途係？
  options:
    a: 加快運算速度
    b: 減少參數量
    c: 解決 vanishing gradient
    d: 令 output 更長
  answer: c
  explanation: Residual connection 俾 gradient 一條 shortcut 由 output 直接流返 input，令 deep
    network 可以 train。
  difficulty: 2
  tags:
  - recall
- id: cum.6
  type: mcq
  source_modules:
  - 7
  question: MoE 嘅 load balancing failure 係指？
  options:
    a: GPU 記憶體爆咗
    b: Router 壞咗
    c: Experts 數量唔夠
    d: 大部分 tokens 去晒同一個 expert
  answer: d
  explanation: 如果 router 將 90% tokens 送同一個 expert，其他 experts 學唔到嘢。用 auxiliary loss
    解決。
  difficulty: 2
  tags:
  - comprehension
