- type: mcq
  question: What signals positive testing ROI for a component?
  options:
    b: It encodes a contract that breaks often and is cheap to test
    a: It renders text
    c: It has no props
    d: It uses Redux
  answer: b
  explanation: ROI = failure cost × likelihood vs test cost; contracts with real breakage risk earn their
    tests.
  difficulty: 2
  tags:
  - synthesis
  id: cum.1
  source_modules:
  - 1
- type: mcq
  question: Why prefer Testing Library queries by role/label over test-id selectors?
  options:
    c: They mirror how users and assistive tech find elements, so tests survive refactors
    a: They are shorter
    b: They run faster
    d: They avoid async waits
  answer: c
  explanation: Accessible queries tie tests to behavior rather than implementation details.
  difficulty: 1
  tags:
  - recall
  id: cum.2
