- id: cum.38
  type: mcq
  question: A busy learner wants to protect long-term retention with the least time per week. Which schedule wins?
  source_modules:
  - 18
  options:
    a: Cramming every topic in one long Sunday session
    b: Reviewing only due cards for about 10 minutes daily
    c: Re-reading the full notes every single day
    d: Skipping review until the week before the final exam
  answer: b
  explanation: Daily short reviews of due cards exploit spacing and hit the highest-retention moments — the most efficient real-world schedule.
  difficulty: 3
  tags:
  - application
  - scenario
