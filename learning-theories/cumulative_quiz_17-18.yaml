- id: cum.36
  type: mcq
  question: In FSRS-5, what happens immediately after you rate a card 'Again' on review?
  source_modules:
  - 18
  options:
    a: Stability drops and the next interval shrinks to a short value
    b: The interval doubles so you see it less often
    c: The card is permanently removed from the deck
    d: Stability is unchanged and only difficulty rises
  answer: a
  explanation: "'Again' signals a lapse: stability falls, difficulty rises, and the next interval is short so the card returns soon."
  difficulty: 2
  tags:
  - concept
  - application
- id: cum.37
  type: tf
  statement: Spaced repetition should schedule each successfully recalled card at a longer interval every time it is reviewed.
  answer: true
  explanation: Expanding intervals is the spacing effect applied — each success grows the gap, which keeps recall effort high and load low.
  difficulty: 1
  tags:
  - concept
  - cross-module
  source_modules:
