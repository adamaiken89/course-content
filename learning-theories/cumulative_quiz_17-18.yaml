- id: cum.34
  type: mcq
  question: Which layout minimizes split attention in a lesson on the human heart?
  source_modules:
  - 17
  options:
    a: A diagram with the labels placed directly on the labelled parts
    b: A full-page diagram with explanations printed on the next page
    c: The same diagram repeated six times with different labels
    d: A dense wall of text with a small diagram at the very bottom
  answer: a
  explanation: Keeping related information together avoids back-and-forth searching — the split-attention effect. Separating labels or burying visuals adds extraneous load.
  difficulty: 2
  tags:
  - application
  - scenario
- id: cum.35
  type: cloze
  question: 'A key goal of content design is to keep {extraneous} load low while leaving room for germane load that builds schemas.'
  answer: extraneous
  explanation: Extraneous load comes from poor presentation; germane load is the mental effort that actually constructs understanding.
  difficulty: 3
  tags:
  - terminology
  - concept
