- id: cum.29
  type: mcq
  question: Which sleep state is most strongly linked to consolidating declarative (fact-based) memories?
  source_modules:
  - 14
  options:
    a: Rapid-eye-movement sleep only
    b: Slow-wave sleep together with later REM
    c: Stage 1 light drowsiness
    d: Waking rest without any sleep
  answer: b
  explanation: Slow-wave sleep supports hippocampus-to-cortex transfer, and later REM continues integration; both phases matter for consolidation.
  difficulty: 3
  tags:
  - concept
  - synthesis
- id: cum.30
  type: cloze
  question: 'Consolidation of new facts is strongest during {slow}-wave sleep, when memories replay from the hippocampus into cortex.'
  answer: slow
  explanation: Slow-wave sleep provides the reactivation and replay that stabilizes hippocampal traces into cortical networks.
