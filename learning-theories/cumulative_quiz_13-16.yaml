- id: cum.25
  type: tf
  statement: Listening to a podcast while reading allows two tasks to use separate attention resources, so learning is unaffected.
  answer: false
  explanation: Attention is a single limited pool — task-switching between reading and audio drains working memory and weakens encoding.
  difficulty: 2
  tags:
  - misconception
  - cross-module
