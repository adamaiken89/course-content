- id: cum.32
  type: mcq
  question: Using a formula learned in class to solve the same kind of problem on a differently worded exam question is which type of transfer?
  source_modules:
  - 16
  options:
    a: Zero transfer
    b: Far transfer
    c: Near transfer
    d: Negative transfer
  answer: c
  explanation: Transfer within the same domain with minor contextual change is near transfer; applying to a new domain is far transfer.
  difficulty: 3
