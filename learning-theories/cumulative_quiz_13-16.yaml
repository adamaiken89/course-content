- id: cum.27
  type: mcq
  question: What does selective attention do?
  source_modules:
  - 13
  options:
    a: Focuses on one input while filtering out competing inputs
    b: Splits processing equally across every available input
    c: Eliminates the need for conscious awareness entirely
    d: Stores a perfect copy of everything seen for later use
  answer: a
  explanation: Selective attention prioritizes chosen stimuli while suppressing others — which is why divided-attention study (podcast plus reading) fails.
  difficulty: 2
  tags:
  - terminology
  - concept
