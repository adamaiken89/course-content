- id: cum.26
  type: tf
  statement: A good night's sleep after studying helps consolidate the material into long-term memory.
  answer: true
  explanation: Slow-wave sleep and REM phases support consolidation; sleep deprivation substantially impairs retention.
  difficulty: 1
  tags:
