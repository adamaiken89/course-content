- id: cum.17
  type: mcq
  question: Which practice is a desirable difficulty rather than an undesirable one?
  source_modules:
  - 9
  options:
    a: Highlighting while reading a textbook
    b: Re-reading the same passage four times
    c: Forcing recall from memory before checking the answer
    d: Removing all challenge to feel fluent
  answer: c
  explanation: Effortful retrieval is a desirable difficulty — it feels harder now but yields stronger long-term retention than fluent re-reading.
  difficulty: 2
  tags:
  - synthesis
  - misconception
- id: cum.18
  type: mcq
  question: Which option is NOT an example of a desirable difficulty?
  source_modules:
  - 9
  options:
    a: Interleaving different problem types
    b: Spacing reviews further apart over time
    c: Using a hint or cue before recalling the answer
    d: Taking a practice test before studying the material
  answer: c
  explanation: Giving hints reduces the retrieval effort and can short-circuit the difficulty that makes practice desirable. The others add productive difficulty.
  difficulty: 2
  tags:
  - concept
  - application
- id: cum.19
  type: cloze
  question: 'Desirable difficulties are learning conditions that require more {effort} at study time but reliably improve long-term retention.'
  answer: effort
  explanation: Difficulty is desirable only when the extra effort serves encoding and retrieval strength — difficulty without learning value is just frustration.
  difficulty: 3
  tags:
  - concept
  - synthesis
  source_modules:
  - 9
- id: cum.20
  type: mcq
  question: What is the term for accurately judging how well you actually know a topic?
  source_modules:
  - 10
  options:
    a: Fluency
    b: Calibration
    c: Interleaving
    d: Mnemonics
  answer: b
  explanation: Calibration measures how closely confidence matches performance. Fluency is the misleading ease that makes calibration harder.
  difficulty: 1
  tags:
  - terminology
  - concept
