- id: cum.23
  type: mcq
  question: Which feedback is most effective for a wrong answer on a practice question?
  source_modules:
  - 12
  options:
    a: A mark showing correct or incorrect only
    b: An explanation delivered after the learner has attempted an answer
    c: Showing the correct answer before the learner tries
    d: Delaying feedback indefinitely to encourage guessing
  answer: b
  explanation: Timely, elaborative feedback after an attempt corrects errors and explains the reasoning — strongest for learning.
  difficulty: 2
