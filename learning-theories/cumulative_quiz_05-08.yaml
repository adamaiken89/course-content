- id: cum.9
  type: mcq
  question: Which practice is a desirable difficulty rather than an undesirable one?
  source_modules:
  - 5
  options:
    a: Highlighting while reading a textbook
    b: Re-reading the same passage four times
    c: Forcing recall from memory before checking the answer
    d: Removing all challenge to feel fluent
  answer: c
  explanation: Retrieval from memory with effort is a desirable difficulty — it strengthens storage and retrieval strength. Highlighting and re-reading feel fluent but produce weak learning.
  difficulty: 2
  tags:
  - synthesis
  - misconception
- id: cum.10
  type: mcq
  question: A student studies statistics problems grouped by type for an hour. What change would most improve transfer?
  source_modules:
  - 8
  options:
    a: Study twice as many problems of each type
    b: Interleave problem types within the session
    c: Use only easier problems to build confidence
    d: Skip practice entirely and re-read worked examples
  answer: b
  explanation: Interleaving forces discrimination between problem types, improving the ability to recognize which approach fits — key to transfer.
  difficulty: 3
  tags:
  - cross-module
  - synthesis
