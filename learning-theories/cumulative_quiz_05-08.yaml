- id: cum.15
  type: mcq
  question: Which study method best simulates real test conditions?
  source_modules:
  - 7
  options:
    a: Re-reading the textbook passage three times
    b: Self-quizzing from memory, then checking the answer
    c: Making one neat summary and never revisiting it
    d: Underlining every key sentence in a bright color
  answer: b
  explanation: Self-quizzing practises retrieval under test-like conditions — the mechanism behind the testing effect.
  difficulty: 1
  tags:
  - application
  - scenario
