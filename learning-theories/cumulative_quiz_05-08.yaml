- id: cum.12
  type: mcq
  question: A diagram of the water cycle is shown with labels while the narrator explains each stage aloud. Why does this illustrate dual coding?
  source_modules:
  - 6
  options:
    a: The content is coded in both a visual channel and a verbal channel
    b: The learner is forced to recall the answer before seeing it
    c: The two formats confirm the same single mental representation
    d: Listening while looking doubles the total study time
  answer: a
  explanation: "Paivio's theory: combining a picture (visual) with narration (verbal) creates two linked codes, improving later retrieval."
  difficulty: 2
  tags:
  - concept
  - scenario
