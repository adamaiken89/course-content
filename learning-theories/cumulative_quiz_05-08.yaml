  type: tf
  statement: A passage feels easy to re-read, which is a reliable sign that the material has been deeply processed and remembered.
  answer: false
  explanation: Fluency from re-reading is a misleading signal. Deep processing requires meaning-building and effortful retrieval, which often feel harder.
