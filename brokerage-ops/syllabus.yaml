subject: "Brokerage Operations & OMS/EMS Full Lifecycle"
language: en
time_budget_hours: 40
target_level: intermediate
domain: "brokerage operations, OMS, EMS, trade lifecycle"
prerequisites: []
learning_objectives:
  - "Understand full trade lifecycle: from pre-trade to settlement"
  - "Master multi-asset class core attributes and their impact on OMS"
  - "Master order types, price logic, and bookkeeping mechanics"
  - "Understand execution system routing, algo trading, and market structure"
  - "Understand settlement, fee calculation, pricing and valuations"
  - "Connect pre-trade domain with execution/post-trade domain"
  - "Understand market data, pricing, regulatory reporting, and exception management"

modules:
