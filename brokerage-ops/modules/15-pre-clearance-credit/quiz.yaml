- id: '15.1'
  question: What is the main difference between Restricted List and Watch List?
  options:
    a: Restricted List is a hard block; Watch List is a soft block
    b: Restricted List is for employee trading; Watch List is for institutional clients
    c: There is no difference, just different names
    d: Restricted List is managed by the exchange; Watch List is auto-generated by the OMS
  answer: a
  explanation: Restricted List (from underwriting/M&A advisory) triggers a hard block — the order cannot be sent. Watch List (a potential risk marker) triggers a soft block — the order can proceed but needs extra review or monitoring. Confusing the two is a serious regulatory error.
  difficulty: 1
  tags:
  - terminology
- id: '15.2'
  question: Which description of the PDT (Pattern Day Trader) rule is correct?
  options:
    a: PDT counts reset at end of day — 3 day trades today, fresh count tomorrow
    b: PDT is based on a rolling 5-trading-day window — today's day trades stay in the window for 5 days
    c: PDT only applies to cash accounts
    d: PDT limit is max 5 day trades in 5 trading days
  answer: b
  explanation: PDT counts on a rolling 5-trading-day basis. Day 1's day trades are not removed until day 6. Trigger is equity below $25K AND at least 3 day trades in the rolling 5 days. Not a daily reset.
  difficulty: 2
  tags:
  - concept
- id: '15.3'
  question: 'A brokerage OMS receives an institutional order: cash account buying $15M MSFT, balance $12M. The group has another margin account with $8M. How should the pre-trade gate handle this?'
  options:
    a: Reject, cash account balance insufficient
    b: Accept, because group aggregated buying power $20M > $15M
    c: Skip credit check, release the order
    d: Only send a warning, do not block
  answer: b
  explanation: 'Group-level aggregated buying power: $12M (cash) + $8M (margin) = $20M, enough for the $15M order. But the OMS must support cross-account/group-level credit checks, not single-account-only — a common OMS gap.'
  difficulty: 3
  tags:
  - scenario
- id: '15.4'
  question: What is the concentration limit check formula?
  options:
    a: Held Value × Order Value ≤ Threshold
    b: Order Value − Held Value ≥ Threshold
    c: (Held Value + Order Value) ÷ Total Equity ≤ Threshold
    d: Total Equity ÷ Held Value ≥ Threshold
  answer: c
  explanation: 'Concentration limit checks the combined held position plus the new order against equity. Formula: (Held Value + Order Value) ÷ Total Equity ≤ Threshold. Example: a single security ≤ 20% of account equity.'
  difficulty: 1
  tags:
  - formula
- id: '15.5'
  question: In the credit hold-release pattern, when is a credit hold released?
  options:
    a: Only at end of trading day
    b: Only when the client deposits more funds
    c: When the order is cancelled, rejected, or execution settles
    d: Credit holds are never released
  answer: c
  explanation: The credit hold is placed at order entry and released when the order is cancelled, rejected, or the execution settles. This prevents available credit from being double-counted across concurrent orders.
  difficulty: 2
  tags:
  - concept
- id: '15.6'
  question: Under Reg T, a margin account with $50K cash can buy up to how much in securities?
  options:
    a: $50K
    b: $75K
    c: $150K
    d: $100K
  answer: d
  explanation: Reg T requires 50% initial margin, so buying power is Cash × 2. $50K cash supports $100K of securities. Day Trading Buying Power (DTBP) is 4× equity, and it applies only to Pattern Day Traders.
  difficulty: 1
  tags:
  - terminology
- id: '15.7'
  question: A PDT-flagged client has $60K equity and a $10K overnight requirement. What is their Day Trading Buying Power (DTBP)?
  options:
    a: $200K
    b: $100K
    c: $120K
    d: $240K
  answer: a
  explanation: 'DTBP = (Equity − Overnight Requirement) × 4. Here: ($60K − $10K) × 4 = $200K. DTBP applies to same-day liquidity products for pattern day traders.'
  difficulty: 2
  tags:
  - calculation
- id: '15.8'
  question: 'Client A holds AAPL $1M, MSFT $600K, GOOGL $400K, total equity $2M. Concentration rule: single tech stock ≤ 25%. The client orders another $200K AAPL. How should the OMS handle it?'
  options:
    a: Approve — AAPL would be exactly 50%, which is allowed
    b: Approve — total tech exposure stays under 60%
    c: Reject — AAPL rises to ~54.5% of equity and tech sector exposure also breaches, two violations
    d: Approve with a warning, since the rule is informational
  answer: c
  explanation: New AAPL position = $1M + $200K = $1.2M, or 54.5% of $2M equity — above the 25% concentration threshold. Tech sector exposure = $1.8M/$2M = 90%, also breaching typical sector limits. Both violations hard block the order.
  difficulty: 3
  tags:
  - scenario
- id: '15.9'
  question: What is the PAD (Personal Account Dealing) check in pre-clearance?
  options:
    a: A check that the client has enough cash
    b: A check that the product is on the approved list
    c: A check on the trader's last execution price
    d: A check on employee/family personal account trades, requiring a hard block or pre-approval
  answer: d
  explanation: PAD applies to employee and family personal account trades. It requires a hard block or pre-approval workflow and notifies compliance and HR. It is part of the pre-clearance layer for employee accounts.
  difficulty: 1
  tags:
  - terminology
- id: '15.10'
  question: 'A brokerage processes 10,000 orders/sec, and every credit check does a real-time balance query taking 200ms. What is the problem and the fix?'
  options:
    a: The balance system is overwhelmed by ~2,000 concurrent queries — fix with cached balances (TTL) for small orders and live queries only above a threshold
    b: No problem — the balance system scales automatically
    c: The problem is latency — the fix is to drop the credit check entirely
    d: The problem is cost — the fix is to batch all checks overnight
  answer: a
  explanation: 10,000 orders/sec × 200ms = 2,000 concurrent queries, overwhelming the balance system. Fix — cached balance with a short TTL for small orders, live queries only above a threshold, and batched aggregate holds for small-order credit.
  difficulty: 2
  tags:
  - application
