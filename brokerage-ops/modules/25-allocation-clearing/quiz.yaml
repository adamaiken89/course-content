- id: '25.7'
  question: Why does the institutional market need affirmation on T+0 while retail does not?
  options:
    a: Institutional orders split across many accounts, each with different settlement instructions — T+0 affirmation leaves time to fix errors before settlement
    b: Retail orders are too small for regulators to care
    c: The SEC requires affirmation only for retail trades
    d: Institutions do not trust their brokers
  answer: a
  explanation: An institutional block may split across 50 accounts with different settlement instructions. Errors found at T+1 leave no time to fix before settlement, so both sides verify details on T+0. Retail has a single account with fixed instructions — no affirmation needed.
  difficulty: 2
  tags:
  - concept
- id: '25.8'
  question: A client fails to affirm by T+0, but the broker already sent DTC settlement instructions. What happens on T+1?
  options:
    a: The trade settles automatically the next day
    b: DTCC cancels the trade
    c: The SEC receives an automatic alert
    d: DSD/DK — CNS marks the trade unconfirmed and it cannot auto-settle; if unresolved it becomes a fail with NSCC buy-in risk
  answer: d
  explanation: A missed T+0 affirmation puts the trade in DSD (Don't Settle / DK) status — CNS cannot auto-settle an unconfirmed trade. If unresolved before cut-off it is flagged as a fail, potentially triggering NSCC buy-in penalties.
  difficulty: 3
  tags:
  - scenario
- id: '25.9'
  question: What is the correct order of the CNS (Continuous Net Settlement) process?
  options:
    a: DTC settlement → CNS netting → trade comparison
    b: CNS netting → trade comparison → DTC settlement
    c: Trade comparison → CNS netting → DTC settlement
    d: Matching → allocation → confirmation
  answer: c
  explanation: 'CNS runs three steps: (1) trade comparison ensuring buyer and seller agree, (2) CNS netting aggregating positions into net amounts, (3) DTC settlement executing securities transfer while NSCC guarantees fund settlement.'
  difficulty: 1
  tags:
  - concept
- id: '25.10'
  question: What was the SEC's primary motivation for shortening the US equity settlement cycle from T+2 to T+1 in 2024?
  options:
    a: Increase broker revenue from faster cycles
    b: Reduce settlement (counterparty) risk by shrinking the window in which a party could default
    c: Match the European T+2 convention
    d: Reduce regulatory reporting volume
  answer: b
  explanation: Shrinking the settlement window reduces counterparty risk. The shorter cycle also pressures post-trade systems — affirmation must complete on T+0 with no buffer day, and STP rate must rise because manual intervention windows are gone.
  difficulty: 3
  tags:
  - concept
