- id: '25.1'
  question: A block trade fills partially (only 75% executed). To treat all clients fairly, which method should the OMS allocation engine use?
  options:
    a: FIFO — earliest-submitting clients get full allocation first
    b: Pro-rata — proportionally reduce all client allocations
    c: LIFO — latest-submitting clients get priority
    d: Random allocation
  answer: b
  explanation: Pro-rata shrinks every account's allocation proportionally so all clients share the partial-fill impact fairly. FIFO can leave later accounts with zero allocation, potentially violating fiduciary duty for ERISA accounts.
  difficulty: 2
  tags:
  - concept
- id: '25.2'
  question: In institutional trading, what is the main difference between affirmation and confirmation?
  options:
    a: They are identical — just different terminology
    b: Affirmation is used for retail; confirmation for institutional
    c: Affirmation is a T+0 intent confirmation; confirmation is the T+1 formal legal document
    d: Affirmation is sent by the SEC; confirmation by the client
  answer: c
  explanation: Affirmation happens on T+0 so the institutional client and broker agree on trade details early. Confirmation is the T+1 formal confirmation, admissible as evidence. Retail has no affirmation step.
  difficulty: 1
  tags:
  - terminology
- id: '25.3'
  question: Since May 28, 2024, what is the settlement cycle for US stocks and ETFs?
  options:
    a: T+1
    b: T+0
    c: T+2
    d: T+3
  answer: a
  explanation: The SEC shortened US equity settlement from T+2 to T+1 effective May 28, 2024. US Treasuries remain T+0, FX spot stays T+2.
  difficulty: 1
  tags:
  - terminology
- id: '25.4'
  question: What is the primary function of NSCC CNS (Continuous Net Settlement)?
  options:
    a: Match buy and sell orders during execution
    b: Calculate trading commissions
    c: Generate regulatory reports
    d: Net each participant's post-trade buys and sells into a single net position to reduce settlement volume
  answer: d
  explanation: CNS nets already-executed trades post-trade — each participant's buys and sells combine into one net position. Matching happens at execution, not in CNS. CNS also handles comparison and NSCC guarantees fund settlement.
  difficulty: 2
  tags:
  - concept
- id: '25.5'
  question: Which allocation timing model must be used for ERISA / fiduciary accounts?
  options:
    a: Post-trade — for maximum flexibility
    b: Pre-trade — ratios set before order placement and strictly followed
    c: FIFO
    d: On-the-day random allocation
  answer: b
  explanation: Pre-trade allocation sets ratios before placement and is required for fiduciary/ERISA accounts; ratios must be strictly followed. Post-trade allocation is flexible but GIPS requires completion before T+1 with timestamps.
  difficulty: 2
  tags:
  - concept
- id: '25.6'
  question: What is the settlement cycle for US Treasuries?
  options:
    a: T+1
    b: T+2
    c: T+0 (same day)
    d: T+3
  answer: c
  explanation: US Treasuries settle T+0 same-day, a long-standing convention. US stocks/ETFs are T+1 since May 2024, FX spot and European equities are T+2.
  difficulty: 1
  tags:
