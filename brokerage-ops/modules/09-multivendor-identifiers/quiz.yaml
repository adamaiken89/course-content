  question: In the futures contract code ESZ5, what do Z and 5 represent?
  options:
    a: Z = Chicago Mercantile Exchange, 5 = contract version
    b: Z = December contract month, 5 = last digit of year (2025)
    c: Z = cash settlement, 5 = physical delivery
    d: Z = index futures, 5 = E-mini series
  answer: b
  explanation: "Futures contract codes use standard month codes: F(Jan) G(Feb) H(Mar) J(Apr) K(May) M(Jun) N(Jul) Q(Aug) U(Sep) V(Oct) X(Nov) Z(Dec). Z = December, 5 = 2025. ES = E-mini S&P 500."
  difficulty: 2
  tags:
  - terminology
- id: '9.2'
  question: Which futures contract month code represents September?
  options:
    a: Z
    b: H
    c: M
    d: U
  answer: d
  explanation: "Month codes: F(Jan) G(Feb) H(Mar) J(Apr) K(May) M(Jun) N(Jul) Q(Aug) U(Sep) V(Oct) X(Nov) Z(Dec). U = September, Z = December."
  difficulty: 1
