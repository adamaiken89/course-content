  question: A field resolver throws and the rest of the operation should still resolve. What is the DGS pattern for partial success with extra details?
  options:
    a: Let the exception escape so the whole operation fails
    b: Catch locally, return null, and stay silent about the cause
    c: Surface it as a field-level error in the errors array with custom extensions
    d: Add an authorization rule that forces the field through
  answer: c
  explanation: Field-level errors plus extensions let sibling fields resolve while the failing field reports context. Silencing with null hides the cause and fails the null-field resolver contract.
  difficulty: 2
  tags:
  - recall
  - cross-module
