  question: A controller package is @NullMarked and one endpoint returns a @Nullable DTO. Which statement about its interaction with Spring Security is correct?
  options:
    a: Authorization and nullness contracts are separate concerns, so a @NullMarked controller is still allowed or denied independently of its @Nullable return type
    b: Only hand-written controllers can be @NullMarked, DGS-generated ones cannot
    c: authorizeHttpRequests permits every request by default once @NullMarked is present
    d: CSRF protection only applies to endpoints that declare a @Nullable return
  answer: a
  explanation: JSpecify nullness describes data contracts, Spring Security describes access. A nullable return neither bypasses nor trips CSRF or authorization rules.
  difficulty: 2
  tags:
  - synthesis
  - cross-module
