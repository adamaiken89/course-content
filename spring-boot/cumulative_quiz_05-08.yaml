  question: Which pairing of MapStruct and Jackson 3 is correct when a mapper component copies a record DTO?
  options:
    a: Both MapStruct and Jackson register mappers at runtime via component scanning
    b: Jackson 3 needs an explicit DgsJsonMapper because record components are not visible
    c: unmappedTargetPolicy REPORT_ERROR is validated during JSON serialization
    d: MapStruct generates mapper implementations at compile time while Jackson 3 binds records through canonical constructor components
  answer: d
  explanation: MapStruct runs annotation processors at build time, Jackson 3 binds records via their canonical constructor and parameter names. No runtime glue or explicit DGS mapper is needed.
  difficulty: 3
  tags:
  - synthesis
  - cross-module
