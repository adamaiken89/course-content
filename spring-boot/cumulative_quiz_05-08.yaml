  question: With Spring Security 7 (CSRF default-on), an unauthenticated POST to a permissive-looking API path returns 403. Most likely cause?
  options:
    a: Missing CORS configuration
    b: CSRF protection enabled by default blocks unsafe methods
    c: Password encoder mismatch for the anonymous user
    d: authorizeHttpRequests requires ROLE_ADMIN on that path
  answer: b
  explanation: Security 7 enables CSRF by default, and CSRF filters reject unsafe methods like POST before authorization. CORS, encoders, and roles do not explain a blanket 403 on unsafe verbs.
  difficulty: 1
  tags:
  - misconception
  - recall
