- id: "c.1"
  question: "A custom component implementing the {HealthIndicator} interface folds your subsystem's status into the /actuator/health aggregate."
  answer: HealthIndicator
  explanation: Actuator auto-discovers HealthIndicator beans and includes their UP or DOWN state in the aggregate health response.
  difficulty: 1
  tags: [terminology]

- id: "c.2"
  question: "With probes enabled, k8s uses {readiness} to decide whether to route traffic to a pod, and liveness to decide whether to restart it."
  answer: readiness
  explanation: Readiness DOWN stops traffic without killing the pod, while a failed liveness probe risks restart loops.
  difficulty: 2
  tags: [concept, process]

- id: "c.3"
  question: "Micrometer measures monotonically increasing events with a {Counter} and duration distributions with a Timer."
  answer: Counter
  explanation: Counters only go up and fit event totals, while timers record latency distributions with percentiles.
  difficulty: 1
  tags: [terminology, comparison]

- id: "c.4"
  question: "The {Observation} API is a single instrumentation point that federates to both metrics and tracing."
  answer: Observation
  explanation: One observation feeds a metric timer and a span through the OTel bridge, keeping the two consistent.
  difficulty: 1
  tags: [terminology, concept]

- id: "c.5"
  question: "A trace crosses a service boundary because the outbound client propagates the {traceparent} header."
  answer: traceparent
  explanation: The W3C traceparent header carries the trace context, so the receiving service continues the same trace.
  difficulty: 2
  tags: [concept, process]

- id: "c.6"
  question: "Structured JSON logs carry the request traceId because the tracing bridge writes it into {MDC}."
  answer: MDC
  explanation: The Mapped Diagnostic Context holds per-request keys that the JSON encoder emits on every log line for correlation.
  difficulty: 2
  tags: [concept, terminology]

- id: "c.7"
  question: "You flip a logger to DEBUG without a restart by POSTing a configuredLevel to the {loggers} endpoint."
  answer: loggers
  explanation: /actuator/loggers reads and sets runtime log levels, which is how you debug a live method without redeploying.
  difficulty: 2
  tags: [process, terminology]

- id: "c.8"
  question: "A hand-spawned virtual thread starts with empty thread-locals, so async logs lose their traceId unless you re-apply MDC with a {ContextSnapshot}."
  answer: ContextSnapshot
  explanation: The snapshot captures thread-local context at the hand-off and reopens it on the worker, mirroring the module 11 SecurityContext fix.
  difficulty: 3
  tags: [concept, process]

- id: "c.9"
  question: "GET /actuator/{heapdump} streams an .hprof snapshot you can profile after a memory spike."
  answer: heapdump
  explanation: The heapdump endpoint exports a JVM heap snapshot for offline analysis when the pod may soon be recycled.
  difficulty: 1
  tags: [terminology, process]

- id: "c.10"
  question: "Tagging a metric with an entity identifier such as orderId causes {cardinality} explosion in the time series."
  answer: cardinality
  explanation: A new label value per order creates a never-reused time series, growing storage and scrape cost until the registry thrashes.
  difficulty: 3
  tags: [concept, terminology]
