  question: Boot 4 drops RestTemplateBuilder auto-configuration. A team migrating from Boot 3 must do what to keep using RestTemplate?
  options:
    a: Register a RestTemplateBuilder bean explicitly in their own configuration
    b: Rely on feature packaging to keep injecting the builder with no code change
    c: Keep public-field property binding to configure the client
    d: Enable an outbound HTTP module flag in application properties
  answer: a
  explanation: RestTemplate is now opt-in. Under modular starters the team must add the RestTemplate starter or register the builder bean themselves rather than inheriting auto-configuration.
  difficulty: 1
  tags:
  - recall
  - misconception
  - cross-module
