  question: A DGS query resolves an author field per book, firing one database hit per author (the N+1 problem). What is the production fix?
  options:
    a: Inline all author lookups inside a single large @DgsQuery method
    b: Enlarge the mapping SQL to preload authors and ignore per-field resolution
    c: Replace the one-at-a-time loader with a BatchLoader or MappedBatchLoader
    d: Disable virtual threads so lookups serialize predictably
  answer: c
  explanation: DGS coalesces per-field loader calls into a single batch. BatchLoader keeps key order, MappedBatchLoader gives key lookup with dedup, killing the N+1 fan-out. Big queries and bigger SQL only hide the problem.
  difficulty: 2
  tags:
  - synthesis
  - cross-module
