  question: Boot 4 removed public-field binding in @ConfigurationProperties. An app that relied on mutable public fields should migrate how?
  options:
    a: Annotate every public field with @Value so the binder reads them
    b: Move to a constructor-bound class or record annotated @ConfigurationProperties
    c: Split each field into its own properties class so PropertyMapper handles it
    d: Keep the public fields but add spring-boot-configuration-processor as a fallback
  answer: b
  explanation: Public-field binding is gone in Boot 4. Constructor binding via a record, or getters and setters, is the supported path. @Value, PropertyMapper, and the metadata processor do not restore field binding.
  difficulty: 3
  tags:
  - misconception
  - cross-module
- id: cum.4
  type: mcq
  source_modules:
