  statement: Boot 4 removes Undertow support, so every Tomcat-based application must switch to a different embedded server.
  answer: false
  explanation: Undertow support is removed, which only affects teams that chose Undertow. Tomcat, Jetty, and Reactor Netty remain first-class embedded servers.
