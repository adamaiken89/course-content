  statement: A MappedBatchLoader that deduplicates its input keys must still return an entry for every originally requested key, not just the unique ones.
  answer: true
  explanation: DGS expects one mapping per requested key. Dropping entries for duplicated keys, even while deduping the downstream work, breaks key resolution for that request scope.
  difficulty: 1
