  question: A federated entity fetcher batches child lookups by parent ID. Which loader shape guarantees the returned values line up with the input keys across the whole batch?
  options:
    a: A plain BatchLoader alone with no ordering contract
    b: A per-request cache keyed only by child class name
    c: DgsGraphQLClient with default request headers
    d: MappedBatchLoader, which receives all keys and returns a map that keeps their order
  answer: d
  explanation: MappedBatchLoader hands you every requested key and expects one entry per key in return, so ordering and dedup stay under your control. Order drift or missing keys corrupts the ChildKey-to-priority map and breaks parent lookup.
  difficulty: 3
  tags:
  - synthesis
  - cross-module
