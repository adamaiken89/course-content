  question: DGS resolves N+1 by coalescing field loads into one batch, and a loader that returns values keyed by input lookup instead of raw position is a {MappedBatchLoader}.
  answer: MappedBatchLoader
  explanation: BatchLoader matches values by position, MappedBatchLoader by key. MappedBatchLoader also dedups repeated keys, which pairs well with virtual-thread concurrency.
  difficulty: 2
