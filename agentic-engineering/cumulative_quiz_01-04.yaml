  question: In opencode-style architecture, what separates the main loop from subagents?
  options:
    c: Subagents get scoped context and return compressed results, protecting the main window
    a: They share one infinite context
    b: They bypass tools
    d: They write directly to git config
  answer: c
  explanation: Delegation with context isolation keeps retrieval quality high over long sessions.
