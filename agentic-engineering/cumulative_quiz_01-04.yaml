- type: mcq
  question: Core mindset shift when engineering with agents?
  options:
    b: Write specs and guardrails, review outputs, iterate fast
    a: Avoid automation entirely
    c: Prompt once and ship
    d: Disable all tools
  answer: b
  explanation: 'Agentic work treats the agent as a junior collaborator: clear intent, verification loops,
    fast feedback.'
