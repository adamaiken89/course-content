- type: mcq
  question: Zustand's core value proposition?
  options:
    b: Minimal store API outside React with selector-based subscription slices
    a: Immutable global classes
    c: Time-travel only
    d: Built-in routing
  answer: b
  explanation: Stores live outside React; components subscribe via selectors so only relevant slices re-render.
