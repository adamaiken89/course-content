- id: '19.1'
  question: What is the single largest cause of state management migration failure?
  options:
    b: Big bang rewrite
    a: Wrong choice of state management library
    c: Insufficient test coverage
    d: Team resistance to change
  answer: b
  explanation: Big bang rewrites create risk proportional to codebase size. Testing
    impossible. Rollback impossible. Incremental migration (strangler fig, module-by-module)
    limits risk per step.
  difficulty: 1
  tags:
  - concept
- id: '19.2'
  question: Which migration strategy lets you toggle between old and new implementation
    per feature?
  options:
    a: Feature flag
    b: Module-by-module
    c: Strangler fig
    d: Parallel run
  answer: a
  explanation: Feature flags wrap old and new implementations behind a boolean. Flip
    flag to switch per feature. Rollback flips flag back. Replaces code at runtime,
    not at deployment.
  difficulty: 1
  tags:
  - terminology
- id: '19.3'
  question: When migrating useReducer to Zustand, what does each reducer case become?
  options:
    a: A store method that calls set()
    b: A switch statement in a dispatch method
    c: A separate store
    d: An action type constant
  answer: a
  explanation: Each reducer case becomes a store method. The switch statement and
    action types are replaced by individual functions like addTodo, toggleTodo, removeTodo.
    The logic stays identical, only the container changes.
  difficulty: 1
  tags:
  - concept
- id: '19.4'
  question: During migration from Context to Zustand, a component accidentally uses
    both useContext(AuthContext) and useAuthStore(). What problem occurs?
  options:
    b: State values diverge between the two systems
    a: TypeScript compilation error
    c: Infinite re-render loop
    d: Bundle size doubles
  answer: b
  explanation: Context and Zustand store are independent copies. Mutating one does
    not update the other. A component reading both may see stale data from one system.
    Prevent with lint rules or by hydrating Zustand store from context on init.
  difficulty: 2
  tags:
  - application
- id: '19.5'
  question: What is the Zustand equivalent of Redux Toolkit's createAsyncThunk lifecycle
    (pending/fulfilled/rejected)?
  options:
    a: Explicit set() calls inside the async action method
    b: Extra reducers in createSlice
    c: Zustand middleware pipeline
    d: Auto-generated by the devtools middleware
  answer: a
  explanation: 'Zustand has no createAsyncThunk. The lifecycle is explicit: set({
    loading: true }) before API call, set({ loading: false, data }) on success, set({
    loading: false, error }) on failure. More code but more control. Named third parameter
    to set() enables DevTools tracing per lifecycle phase.'
  difficulty: 2
  tags:
  - comparison
- id: '19.6'
  question: A team migrates a 50k LOC Redux app module-by-module. What is the recommended
    first module to migrate?
  options:
    c: Smallest independent feature (e.g., theme toggle, notifications)
    a: Auth — because every component reads it
    b: Checkout — because it generates revenue
    d: The most complex reducer with 30 action types
  answer: c
  explanation: 'Start small. First module: low risk, teaches team the pattern, builds
    confidence. Auth is high-risk (every component depends on it). Complex reducers
    increase migration surface. Theme toggle or notification preferences are independent
    and safe.'
  difficulty: 2
  tags:
  - application
- id: '19.7'
  question: 'Dual-write during migration means:'
  options:
    d: Processing every action in both old and new stores and comparing outputs
    a: Writing both unit and integration tests for each store
    b: Maintaining both old and new documentation
    c: Assigning two developers to each migration task
  answer: d
  explanation: Dual-write sends the same action to both Redux and Zustand stores,
    then compares resulting state. Divergence indicates logic mismatch. Used in staging
    to build confidence before cutover. Not suitable for production due to double-processing
    overhead.
  difficulty: 1
  tags:
  - concept
- id: '19.8'
  question: A migration currently has both old Redux store and new Zustand store active.
    Both need to read the user's auth token. What is the recommended approach?
  options:
    c: Create a bridge via Redux store subscription that updates Zustand store
    a: Duplicate token in both stores, keep them in sync manually
    b: Make Zustand the single source of truth and deprecate Redux auth immediately
    d: Wrap all components in a provider that passes token via props
  answer: c
  explanation: 'Bridge via subscription: Redux store subscribes to changes, Zustand
    store.setState() on auth token change. This prevents divergence without requiring
    immediate full migration of auth. Redux remains owner during migration; Zustand
    is read-only replica.'
  difficulty: 3
  tags:
  - scenario
- id: '19.9'
  question: After migrating a Redux slice with 200 reducer tests, what is the recommended
    test strategy?
  options:
    d: Write 200 parity tests, confirm logic matches, then reduce to meaningful subset
    a: Delete all 200 tests — they are covered by the new store
    b: Only test components, not stores
    c: Keep all 200 tests running against both old and new stores permanently
  answer: d
  explanation: Parity tests confirm old and new produce same outputs for same inputs.
    After confidence builds (2 weeks without divergence), reduce to ~50 meaningful
    integration tests. Redundant tests are maintenance burden. Deleting without parity
    validation risks undiscovered logic differences.
  difficulty: 2
  tags:
  - application
- id: '19.10'
  question: A team maintains two state management systems during migration. Which
    risk is the code review checklist primarily designed to prevent?
  options:
    b: Mixed patterns — same component accessing both old and new state management
    a: Performance regression in the new Zustand store
    c: Missing TypeScript types for the new store
    d: Inadequate test coverage for new features
  answer: b
  explanation: Mixed patterns (a component using both useContext and useStore) cause
    state divergence, bugs, and confused developers. Code review checklist explicitly
    catches this. Other concerns (performance, types, tests) are important but secondary.
    Mixed access is the most common and dangerous migration bug.
  difficulty: 3
  tags:
  - scenario

