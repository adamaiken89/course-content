- id: '7.1'
  question: What must you pass as the third argument to Zustand's `set()` to see meaningful
    action names in Redux DevTools?
  options:
    c: A string label describing the action
    a: A unique store ID
    b: A boolean indicating whether to replace state
    d: The current state snapshot
  answer: c
  explanation: 'Third argument to `set()` is the action type name shown in DevTools.
    Without it, all mutations appear as `anonymousActionType` (default: `''stateChange''`).'
  difficulty: 1
  tags:
  - terminology
- id: '7.2'
  question: Which of the following is a benefit of function-based actions over string-constant
    actions in Zustand?
  options:
    a: TypeScript autocomplete on the action method name
    b: Actions are serializable over WebSocket
    c: Actions appear as named entries in DevTools action log
    d: Actions can be logged and replayed for undo/redo
  answer: a
  explanation: 'Function-based actions like `store.addTodo(text)` give full TypeScript
    autocomplete. String constants require manual typing of `{ type, payload }` objects.


    A and D are benefits of string constants (serializable, replayable). C can work
    with named third arg regardless of style.'
  difficulty: 2
  tags:
  - comparison
- id: '7.3'
  question: A Zustand store has 12 action types, undo/redo requirements, and cross-slice
    updates. Which pattern should you use?
  options:
    b: Reducer pattern with string-constant action types
    a: Direct set() mutations for each action
    c: Function-based actions only
    d: External state management outside Zustand
  answer: b
  explanation: 12 action types with undo/redo and cross-slice updates need reducer
    pattern. String constants enable serializable action log for undo/redo. Direct
    set() would scatter mutation logic across unrelated functions. Function-based
    actions are not serializable for replay.
  difficulty: 2
  tags:
  - scenario
- id: '7.4'
  question: How do you dispatch an action from a WebSocket handler using Zustand's
    Redux pattern?
  options:
    d: Import the store and call store.getState().dispatch({ type, payload })
    a: Wrap the WebSocket handler in a React component and call useDispatch
    b: Create a new Zustand store inside the WebSocket callback
    c: Use Redux Toolkit's createAsyncThunk instead
  answer: d
  explanation: Zustand stores exist outside React. `store.getState()` returns the
    full state object including actions. No Component or Provider wrapper needed —
    call dispatch directly from any context.
  difficulty: 1
  tags:
  - application
- id: '7.5'
  question: What is the main reason to unit-test a reducer function separately from
    the store?
  options:
    d: Reducers are pure functions — tests run without React environment or store
      setup
    a: Reducer tests are slower but more thorough
    b: Zustand stores cannot be tested in isolation
    c: Reducer tests automatically cover middleware behavior
  answer: d
  explanation: Reducers are pure `(state, action) => state` functions. They require
    no React, no store creation, no middleware. Fast to run, easy to reason about.
    Store integration tests cover the wiring (middleware, subscriptions, devtools)
    separately.
  difficulty: 1
  tags:
  - concept
- id: '7.6'
  question: A form has 3 fields, a submit button, and 1 API call. Which approach is
    most appropriate?
  options:
    a: Direct set() mutations inside the component
    b: Reducer pattern with 4 action types (UPDATE_FIELD_1, UPDATE_FIELD_2, UPDATE_FIELD_3,
      SUBMIT)
    c: External Redux store with createSlice
    d: useRef for all fields to avoid re-renders
  answer: a
  explanation: '3 fields + 1 submit = simple state. Reducer pattern would add 4 action
    types, a switch statement, and a dispatch function — ceremony without benefit.
    Direct set() is simpler, more readable, and co-located with the component. Rule:
    if no conditionals in set() callback, direct mutation wins.'
  difficulty: 2
  tags:
  - scenario
- id: '7.7'
  question: In Zustand's `devtools` middleware, what appears in the DevTools action
    log if you omit the third parameter to `set()`?
  options:
    b: The value configured as `anonymousActionType` (default `'stateChange'`)
    a: An empty string
    c: '`undefined`'
    d: The previous state as a string
  answer: b
  explanation: The `anonymousActionType` option in the devtools middleware config
    sets the fallback label. Default is `'stateChange'`. Every unnamed mutation shows
    as the same label — useless for debugging multiple action types.
  difficulty: 2
  tags:
  - terminology
- id: '7.8'
  question: Which scenario forces the use of string-constant action types over function-based
    actions?
  options:
    b: You need to log and replay actions for undo/redo functionality
    a: You want TypeScript autocomplete on store actions
    c: You want to export action creators for reuse across modules
    d: You have fewer than 3 action types
  answer: b
  explanation: 'Undo/redo requires a serializable action log `{ type, payload }` that
    can be replayed or inverted. Function-based actions are closures — they capture
    scope at call time and cannot be replayed later.


    A and B work with either style. D is irrelevant to the decision.'
  difficulty: 3
  tags:
  - application
- id: '7.9'
  question: What happens when you have both a Redux slice and a Zustand reducer store
    managing `todos` in the same app?
  options:
    c: Both stores coexist independently — no conflict
    a: React throws an invariant violation
    b: Zustand store automatically syncs to Redux store
    d: Only one store can exist per app
  answer: c
  explanation: Zustand stores do not use React Context or Providers. They are plain
    JavaScript objects. Multiple stores (Redux + Zustand, or multiple Zustand) coexist
    without conflict. You can migrate features incrementally.
  difficulty: 1
  tags:
  - concept
- id: '7.10'
  question: 'A Zustand store uses the reducer pattern. A bug: dispatching an action
    outside React (from a WebSocket) updates the store state, but the UI does not
    re-render. What is the most likely cause?'
  options:
    a: The component's selector returns a stable reference preventing re-render
    b: The reducer function has a bug in the switch statement
    c: Zustand cannot trigger re-renders from outside React
    d: The WebSocket handler needs to be wrapped in act()
  answer: a
  explanation: 'Store state is correct (reducer tested, no bug) → selector returns
    same reference (e.g., `useStore((s) => s.todos)` returns new array, but the component
    compares by reference). Most likely: the component uses a selector that returns
    a derived value that does not change, or a parent stops propagation. Zustand does
    trigger re-renders from outside React via `useSyncExternalStore`.'
  difficulty: 3
  tags:
  - scenario

