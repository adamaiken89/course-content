- id: '15.1'
  question: What value does JSON.stringify produce for a Map with entries `[['key',
    'value']]`?
  options:
    a: '{}'
    b: '[["key","value"]]'
    c: '{"key":"value"}'
    d: '{"__type":"Map","value":[["key","value"]]}'
  answer: a
  explanation: 'JSON has no Map representation. JSON.stringify calls Map''s toJSON
    method, which returns {}. Arrays and objects serialize correctly; Maps and Sets
    become empty objects. Replacer functions can override this behavior.

    '
