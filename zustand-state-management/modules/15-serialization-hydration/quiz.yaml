- id: '15.7'
  question: A Zustand store at module level in a Next.js server component causes User
    B to see User A's data. What is the fix?
  options:
    a: Create a fresh store instance per request using `createStore` or `React.cache()`
    b: Add `'use client'` to the store file
    c: Use `persist` middleware with sessionStorage
    d: Add `useEffect` to reset store on mount
  answer: a
  explanation: 'Module-level stores are singletons — they persist across all requests
    in the server runtime. Concurrent requests share the same store instance, causing
    cross-request state leaks. Creating store per request (via factory function or
    React.cache()) isolates each request''s state. This is a server-side issue, not
    a client issue.

    '
