- id: '15.8'
  question: 'A store uses `persist` with `version: 2`. User has v1 data in localStorage.
    Which function handles converting v1 to v2 schema?'
  options:
    b: migrate
    a: merge
    c: partialize
    d: onRehydrateStorage
  answer: b
  explanation: 'The `migrate` function receives the persisted state and its version
    number. It applies sequential transformations to upgrade to the current version.
    merge handles combining persisted state with defaults, but does not handle schema
    version transformations. migrate runs before merge during rehydration.

    '
  difficulty: 2
  tags:
