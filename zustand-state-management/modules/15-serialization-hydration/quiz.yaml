- id: '15.10'
  question: In a persisted cart store, `merge` function receives corrupted localStorage
    data where `items` is `null`. What should the merge function do?
  options:
    c: Validate `items` is an array in merge; if not, use `current.items` (the default
      empty array)
    a: Spread `persisted` over `current` — corrupted data replaces defaults silently
    b: Throw an error to crash the app and alert the developer
    d: Call `localStorage.clear()` automatically
  answer: c
  explanation: 'merge is the safety valve for corrupted persisted state. Before applying
    persisted values, validate types and ranges. If items is null (corrupted), fall
    back to current.items (the empty array default). Throwing errors crashes the app
    for users. Silently spreading corrupted data propagates null errors downstream.
    localStorage.clear() loses potentially recoverable data.

    '
