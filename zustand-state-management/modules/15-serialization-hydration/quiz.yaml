- id: '15.3'
  question: A store uses `persist` middleware with default settings. Which of these
    state shapes survives round-trip serialization identically?
  options:
    d: '{ config: { host: ''localhost'', port: 3000 } }'
    a: '{ items: [{ id: ''1'', addedAt: new Date() }] }'
    b: '{ metadata: new Map([[''count'', 5]]) }'
    c: '{ fn: () => console.log(''hi'') }'
  answer: d
  explanation: 'Only plain objects, strings, numbers, booleans, null, and arrays survive
    JSON round-trip unchanged. Dates become strings, Maps become empty objects, functions
    are removed. Nested plain objects like `config` serialize and deserialize correctly.

    '
  difficulty: 1
  tags:
