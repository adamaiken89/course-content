- id: '15.6'
  question: You call `useStore.persist.skipHydration()` but never call `rehydrate()`.
    What is the result?
  options:
    b: Store never hydrates — component shows default state permanently
    a: Store hydrates on next state mutation
    c: Store hydrates after a 5-second timeout
    d: Store hydrates from sessionStorage instead
  answer: b
  explanation: 'skipHydration prevents the automatic rehydration that persist normally
    does on store creation. Manual rehydrate() triggers the read from storage. Without
    it, the store stays at default values. The persisted data remains in localStorage
    but is never loaded into the store.

    '
