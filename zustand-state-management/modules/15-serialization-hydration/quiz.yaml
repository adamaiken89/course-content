- id: '15.4'
  question: In `createJSONStorage(() => localStorage, { replacer, reviver })`, what
    does the `reviver` argument do?
  options:
    a: Restores custom types from their serialized form during JSON.parse
    b: Transforms values before they are written to localStorage
    c: Validates the store schema before persist runs
    d: Generates a storage key from the store name
  answer: a
  explanation: 'The reviver is passed to JSON.parse as the second argument. It runs
    on every key-value pair during deserialization, allowing reconstruction of custom
    types (Date, Map, Set) from their serialized markers. The replacer (not reviver)
    handles the write direction.

    '
