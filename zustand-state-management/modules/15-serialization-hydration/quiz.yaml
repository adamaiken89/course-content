- id: '15.2'
  question: 'A store has `createdAt: new Date()`. After persist + page refresh, `createdAt.getTime()`
    returns NaN. Why?'
  options:
    b: JSON.stringify converts Date to ISO string; JSON.parse returns a string, not
      a Date
    a: Date objects cannot be stored in Zustand stores
    c: persist middleware strips Date fields by default
    d: localStorage corrupts Date objects on write
  answer: b
  explanation: 'JSON.stringify calls Date.prototype.toJSON, which returns an ISO string.
    On rehydration, JSON.parse returns the string. Calling .getTime() on a string
    returns NaN. Fix with custom reviver that reconstructs Date objects.

    '
