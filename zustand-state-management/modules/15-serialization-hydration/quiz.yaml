- id: '15.9'
  question: Which pattern prevents React hydration mismatch when a Zustand store holds
    a persisted theme preference?
  options:
    c: Both A and B
    a: Use `suppressHydrationWarning` on the theme element
    b: Render default theme until client-side `useEffect` confirms hydration, then
      apply persisted value
    d: Move theme to a CSS custom property instead of className
  answer: c
  explanation: 'suppressHydrationWarning (A) skips React''s mismatch check for that
    element — server renders default, client rehydrates to persisted value without
    warning. The mounted guard (B) suppresses the client render until hydration completes,
    so the first client render matches the server. Both are valid; choose based on
    whether you want to suppress warnings (A) or defer rendering (B). CSS custom properties
    do not fix the underlying mismatch.

    '
