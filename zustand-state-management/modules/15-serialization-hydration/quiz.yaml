- id: '15.5'
  question: A Next.js Server Component imports a Zustand store using `persist` middleware
    with localStorage. What error occurs?
  options:
    d: 'ReferenceError: localStorage is not defined (during SSR)'
    a: Hydration mismatch warning in the browser
    b: TypeScript compilation error
    c: No error — localStorage returns undefined on server
  answer: d
  explanation: 'localStorage is a browser API. On the server (Node.js), it is not
    defined. persist middleware calls localStorage during store initialization, causing
    a ReferenceError. Fix: either use ''use client'' directive, or conditionally wrap
    persist with `typeof window !== ''undefined''`.

    '
