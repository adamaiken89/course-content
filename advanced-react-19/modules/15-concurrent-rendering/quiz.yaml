- id: '15.1'
  question: What lane does React assign to a state update wrapped in startTransition?
  options:
    a: TransitionLane
    b: SyncLane
    c: InputContinuousLane
    d: IdleLane
  answer: a
  explanation: startTransition marks all setState calls inside its callback as TransitionLane
    (green in DevTools). TransitionLane is interruptible by higher-priority lanes
    (SyncLane, InputContinuousLane). IdleLane is used by useDeferredValue, not startTransition.
  difficulty: 1
  tags:
  - terminology
- id: '15.2'
  question: A user types into a search field. The filter computation takes 150ms.
    What happens in concurrent mode vs legacy mode?
  options:
    c: Concurrent mode yields between fiber chunks, allowing typing during filter;
      legacy mode blocks
    a: Both modes block typing for 150ms
    b: Legacy mode yields; concurrent mode blocks
    d: Neither mode blocks — both use requestAnimationFrame
  answer: c
  explanation: Concurrent mode splits render into ~5ms chunks via time slicing. Browser
    processes input between chunks. Legacy mode renders synchronously — browser cannot
    process input until render completes.
  difficulty: 1
  tags:
  - comparison
- id: '15.3'
  question: Which statement about lane priority is correct?
  options:
    b: Lanes are bitmasks that React aggregates and tests via bitwise operations
    a: Lanes are numeric priorities (1-31) that React sorts inline
    c: Lanes are string labels compared alphabetically
    d: Lanes are only used in development mode
  answer: b
  explanation: Lanes are binary bitmasks (31 fit in a 32-bit integer). React aggregates
    pending lanes with bitwise OR, tests intersection with bitwise AND, and picks
    highest priority via bitScan operations. Numeric sorting would be slower and cannot
    represent batched lane combinations.
  difficulty: 2
  tags:
  - concept
- id: '15.4'
  question: When React is rendering a transition and a SyncLane update arrives, what
    happens?
  options:
    a: React throws away the transition work and restarts with SyncLane
    b: React finishes the transition render, then processes SyncLane update
    c: React merges both updates into one render
    d: React blocks the SyncLane update until transition completes
  answer: a
  explanation: React throws a special error from the work loop, discarding all partial
    transition work. It then restarts with the higher-priority SyncLane. This ensures
    urgent updates (SyncLane) are never blocked by lower-priority work.
  difficulty: 2
  tags:
  - concept
- id: '15.5'
  question: A filter list uses useDeferredValue for the query. What happens if the
    user types continuously for 2 seconds?
  options:
    d: The deferred value stays at the initial value until typing pauses, then catches
      up
    a: The deferred value updates mid-typing every 5ms
    b: The deferred value always updates synchronously
    c: The deferred value only updates when startTransition is called
  answer: d
  explanation: useDeferredValue uses IdleLane. React skips re-rendering the deferred
    subtree if urgent work (keystroke handling) keeps arriving. Once user pauses and
    idle frames are available, deferred value catches up to the final value. Intermediate
    keystroke values may be skipped.
  difficulty: 2
  tags:
  - application
- id: '15.6'
  question: A component calls startTransition(() => { setTab('analytics') }). The
    analytics tab suspends while loading data. What does the user see?
  options:
    b: Previous tab content until data loads
    a: Immediate Suspense fallback (spinner)
    c: Blank screen until data loads
    d: Error boundary because transitions cannot suspend
  answer: b
  explanation: Concurrent mode suppresses Suspense fallbacks during transitions. React
    keeps committing stale UI (previous tab) instead of showing a fallback. isPending
    becomes true to indicate background loading. This prevents spinner flash during
    navigation.
  difficulty: 2
  tags:
  - scenario
- id: '15.7'
  question: What mechanism does React use to yield control to the browser between
    fiber units?
  options:
    c: MessageChannel with postMessage
    a: setTimeout(fn, 0)
    b: Web Workers for parallel rendering
    d: process.nextTick
  answer: c
  explanation: React uses MessageChannel.postMessage to schedule continuation of work.
    The browser processes pending input, layout, and paint between the message being
    posted and the onmessage callback firing. setTimeout(0) is throttled to 4ms minimum
    in nested calls; MessageChannel fires in ~0-1ms.
  difficulty: 2
  tags:
  - concept
- id: '15.8'
  question: Which API prevents tearing when reading external store state during concurrent
    rendering?
  options:
    a: useSyncExternalStore
    b: useEffect with dependency array
    c: flushSync
    d: useRef to store snapshot
  answer: a
  explanation: useSyncExternalStore forces getSnapshot to run synchronously at commit
    time, ensuring render and commit use same store snapshot. Without it, a store
    update between render and commit produces UI with inconsistent state (tearing).
    React detects snapshot changes and re-renders synchronously.
  difficulty: 1
  tags:
  - terminology
- id: '15.9'
  question: A component shows a blue lane badge in DevTools but is wrapped in startTransition.
    What is the most likely cause?
  options:
    d: A setState outside the transition callback is triggering the re-render on DefaultLane
    a: DevTools always show blue for all transitions
    b: startTransition only works in production mode
    c: The component uses useDeferredValue which overrides startTransition
  answer: d
  explanation: startTransition only affects setState calls executed inside its callback.
    If any setState outside the callback triggers the render (e.g., a parent re-render,
    or a setState in the same handler but outside startTransition), it uses DefaultLane
    (blue). Check that all relevant setState calls are inside startTransition.
  difficulty: 3
  tags:
  - scenario
- id: '15.10'
  question: In React 19, what is the recommended way to update an external store (Zustand)
    inside useTransition?
  options:
    b: Use useSyncExternalStore + startTransition on the component that reads the
      store
    a: Call store.setState directly inside startTransition
    c: External stores cannot be used with transitions
    d: Wrap the entire store in useDeferredValue
  answer: b
  explanation: 'startTransition only wraps React setState calls. External store mutations
    bypass React''s scheduler. The correct pattern: use useSyncExternalStore for safe
    reads, then wrap the rendering of store-driven data in startTransition. For writes,
    trigger the store mutation outside transition and let useSyncExternalStore detect
    the change.'
  difficulty: 3
  tags:
  - application

