- id: '8.1'
  question: What happens when React encounters a 'use client' directive during Server
    Component rendering?
  options:
    a: It inserts a placeholder and the Client Component hydrates from that point
      downward
    b: It stops server rendering and throws an error
    c: It ships the component as HTML only with no interactivity
    d: It converts the component to a Server Component silently
  answer: a
  explanation: '''use client'' marks boundary. Server renders tree until boundary,
    inserts placeholder. Client bundle hydrates subtree. Component retains all interactivity
    via client-side hooks.'
  difficulty: 1
  tags:
  - concept
- id: '8.2'
  question: Which of these can be passed as a prop from a Server Component to a Client
    Component?
  options:
    b: A plain object with string values
    a: A function reference
    c: A React element created with createElement
    d: A class instance with methods
  answer: b
  explanation: 'Only serializable values cross boundary: strings, numbers, booleans,
    plain objects, arrays, Date, Map, Set, BigInt. Functions, class instances, Symbols,
    and React elements (except children) cannot serialize.'
  difficulty: 1
  tags:
  - concept
- id: '8.3'
  question: Where should the 'use server' directive be placed for a module-level Server
    Action?
  options:
    d: At the top of the file, making all exports Server Actions
    a: Above each individual function that needs server execution
    b: At the top of the calling Client Component
    c: In a separate configuration file
  answer: d
  explanation: '''use server'' at file top makes all exports Server Actions. Inline
    actions use ''use server'' as first statement in function body. File-level ''use
    server'' is preferred for reusable actions.'
  difficulty: 1
  tags:
  - terminology
- id: '8.4'
  question: An async Server Component fetches data from three independent database
    tables. What is the recommended pattern to minimize response time?
  options:
    c: Use Promise.all to fetch in parallel
    a: Use three sequential await statements
    b: Use three separate useEffect calls
    d: Fetch in a Server Action and return results
  answer: c
  explanation: Promise.all parallelizes independent fetches. Server Component awaits
    once for all results. Sequential awaits cause waterfall (total = sum). useEffect
    not available in Server Components. Server Actions for mutations, not data fetching.
  difficulty: 2
  tags:
  - scenario
- id: '8.5'
  question: What happens if a Client Component imports and renders a Server Component
    directly?
  options:
    c: React throws a runtime error — Server Component cannot be imported into Client
      Component
    a: The Server Component renders on server and sends HTML to client
    b: The Server Component renders on client with full functionality
    d: The import is ignored silently
  answer: c
  explanation: 'Client Component files ship to browser. Server Component files cannot
    execute in browser (no server APIs). React throws error. Correct pattern: pass
    Server Component as children prop to Client Component.'
  difficulty: 2
  tags:
  - concept
- id: '8.6'
  question: Which statement about inline Server Actions vs module-level Server Actions
    is correct?
  options:
    b: Module-level actions can be reused across multiple forms and components
    a: Inline actions have lower latency than module-level
    c: Inline actions cannot access the database
    d: Module-level actions must be async, inline actions can be sync
  answer: b
  explanation: Module-level ('use server' at file level) exports reusable actions
    importable by any component. Inline actions scoped to one component. Both access
    server APIs. Both must be async. Latency identical — compile to same RPC mechanism.
  difficulty: 2
  tags:
  - comparison
- id: '8.7'
  question: A Server Component page has three Suspense boundaries wrapping async children.
    One child takes 4s, another 200ms, another 50ms. How does content reach the browser?
  options:
    a: 50ms content arrives first, then 200ms, then 4s — each boundary streams independently
    b: All content arrives after 4s when slowest completes
    c: Content arrives in declaration order regardless of speed
    d: Only the fastest boundary renders; slower ones are discarded
  answer: a
  explanation: Each Suspense boundary streams independently. Fast resolved promises
    flush immediately. Slow sibling does not block fast ones. Client sees progressive
    enhancement—skeletons replaced as data arrives.
  difficulty: 2
  tags:
  - scenario
- id: '8.8'
  question: What is the correct way to test an async Server Component that queries
    a database?
  options:
    a: Mock the database module, await the component, and assert on rendered output
    b: Render the component in a browser test and assert on DOM
    c: Use only end-to-end tests since Server Components cannot be unit tested
    d: Test the database query directly and skip component rendering
  answer: a
  explanation: Mock DB module with vitest/jest, call component as async function,
    use renderToString or Testing Library to assert output. Server Components are
    deterministic — given same data, produce same output. No browser needed.
  difficulty: 3
  tags:
  - scenario
- id: '8.9'
  question: A developer needs a navigation sidebar that tracks active link (client
    state) wrapping server-fetched user data. What composition pattern should they
    use?
  options:
    b: Server Component wrapping Client Sidebar, pass user as serialized prop
    a: Client Sidebar component that imports and renders user Server Component
    c: Server Component that contains all interactivity inline
    d: Client Component that fetches user data in a useEffect
  answer: b
  explanation: 'Correct pattern: Server wrapper page → Server Component fetches user
    → Client Sidebar receives user as serializable prop. Server content can also be
    passed as children to Client Component. Option B causes runtime error. Option
    C impossible (no hooks in Server). Option D regresses to client-side fetch.'
  difficulty: 3
  tags:
  - scenario
- id: '8.10'
  question: Which statement accurately distinguishes Server Components from traditional
    SSR?
  options:
    d: Server Components produce zero client JS and never hydrate; SSR renders on
      server then hydrates fully on client
    a: Server Components and SSR are the same technology with different names
    b: SSR components ship zero JS to client; Server Components ship full JS bundle
    c: SSR is only for initial page load; Server Components work only for client interactions
  answer: d
  explanation: 'Critical distinction: SSR renders to HTML on server, ships JS bundle,
    hydrates — every component eventually runs in browser. Server Components never
    hydrate, never ship code. They produce serialized output consumed by client rendering.
    They complement SSR but are different architectural models.'
  difficulty: 1
  tags:
  - comparison

