- id: '13.1'
  question: What does the React Compiler do at build time?
  options:
    d: Injects useMemo, useCallback, and React.memo calls into components automatically
    a: Runs components on the server and sends HTML to the client
    b: Replaces JSX with direct DOM manipulation for faster rendering
    c: Compiles TypeScript to JavaScript with stricter type checking
  answer: d
  explanation: React Compiler transforms source at build time, injecting memoization
    calls (useMemo, useCallback, React.memo) into components and hooks. No runtime
    overhead — output is standard React code with automatic memoization.
  difficulty: 1
  tags:
  - terminology
- id: '13.2'
  question: How do you enable the React Compiler for a specific file?
  options:
    c: Add // @reactCompiler at the top of the file
    a: Add 'use compiler'; at the top of the file
    b: 'Set compilationMode: ''all'' in build config'
    d: Name the file with .compiler.tsx extension
  answer: c
  explanation: The // @reactCompiler directive at the top of the file opts it into
    compiler analysis. Files without the directive compile normally. This enables
    incremental adoption across a codebase.
  difficulty: 1
  tags:
  - terminology
- id: '13.3'
  question: A compiler-enabled component stores a computed value in a module-level
    variable. What happens?
  options:
    c: Compiler detects the leak and skips memoization
    a: Compiler memoizes the value and updates the module variable
    b: Compilation fails with an error
    d: Compiler creates a duplicate value inside the component
  answer: c
  explanation: Compiler detects values that 'leak' outside React's component lifecycle
    (module scope, singletons). It conservatively skips memoization rather than risk
    incorrect behavior when a value escapes React's management.
  difficulty: 2
  tags:
  - concept
- id: '13.4'
  question: Which pattern will the React Compiler successfully memoize?
  options:
    a: const fullName = `${first} ${last}`
    b: const value = data[dynamicKey as keyof Data]
    c: const value = ref.current
    d: const config = buildConfig(importedDefaults)
  answer: a
  explanation: Template literal from props/state is a derived value — compiler traces
    first/last to their sources and memoizes fullName. Dynamic key access, ref.current
    reads, and cross-module function calls are opaque to compiler analysis.
  difficulty: 2
  tags:
  - application
- id: '13.5'
  question: Your team enabled the compiler globally. A critical component enters infinite
    re-render. What is the fastest recovery?
  options:
    b: Remove // @reactCompiler from that specific file
    a: Revert the entire build to pre-compiler
    c: Add useMemo around every value in the component
    d: Increase StrictMode double-invoke threshold
  answer: b
  explanation: Incremental per-file opt-in means per-file rollback. Remove the directive
    from the broken component, fix its data flow, re-enable. No other files affected.
  difficulty: 1
  tags:
  - scenario
- id: '13.6'
  question: A component uses both compiler and manual useMemo. What is the result?
  options:
    a: Nested memoization — compiler wraps manual useMemo in another memo
    b: Compiler ignores the file — manual memoization takes precedence
    c: Compiler errors — manual useMemo not allowed with compiler
    d: Manual useMemo is replaced by compiler's copy
  answer: a
  explanation: Both apply. Compiler wraps values in its own memoization on top of
    existing useMemo — resulting in nested memo closures. Not incorrect but wastes
    memory. Remove redundant manual memo after compiler enable.
  difficulty: 2
  tags:
  - concept
- id: '13.7'
  question: A component passes an inline arrow function as prop to a child. With compiler
    enabled, what changes?
  options:
    a: Compiler wraps the function in useCallback — stable reference when deps unchanged
    b: Nothing — inline functions always create new references
    c: Compiler throws an error — inline functions are not allowed
    d: Compiler moves the function outside the component as a module-level helper
  answer: a
  explanation: Compiler traces the closure's dependencies and wraps it in useCallback.
    Same behavior as manual useCallback, but automatic and with precise dep tracking.
  difficulty: 1
  tags:
  - terminology
- id: '13.8'
  question: A suspended component with compiler enabled resumes after data arrives.
    What happens to compiler-memoized values?
  options:
    b: Values are recomputed and re-memoized on resume
    a: Values are preserved from before suspension
    c: Values are cleared — compiler disabled for suspended components
    d: Values are null until next render cycle
  answer: b
  explanation: Suspense discards the previous render output. On resume, component
    runs fresh — compiler recomputes all derived values and creates new memoization
    cache. No value carryover across suspend boundaries.
  difficulty: 2
  tags:
  - concept
- id: '13.9'
  question: What is the recommended approach for compiler adoption in CI for a large
    codebase?
  options:
    b: 'Phase 1: warnings only. Phase 2: new files require directive. Phase 3: all
      files required'
    a: Enable compiler globally on day one, fix errors in production
    c: Only run compiler locally — CI should not enforce compiler rules
    d: Run compiler only on test files, skip production builds
  answer: b
  explanation: 'Phased approach reduces risk: start with non-blocking warnings (team
    adapts), require directive on new files (grow adoption), finally require on all
    files (complete coverage). Each phase validates before escalation.'
  difficulty: 2
  tags:
  - scenario
- id: '13.10'
  question: A component reads store.getState() directly (not through a hook) and derives
    a value. Will the compiler memoize the derived value?
  options:
    d: No — store.getState() is a cross-module call, compiler skips
    a: Yes — derivation from any variable is memoized
    b: Yes — but only if the store is imported from a module with // @reactCompiler
    c: No — compiler skips all components that use external stores
  answer: d
  explanation: store.getState() is a direct call on an imported module value. Compiler
    cannot analyze the store's internal state changes — it treats it as opaque and
    skips memoization. Using a hook like useStore(selector) gives the compiler a stable
    memoization signal.
  difficulty: 3
  tags:
  - application

