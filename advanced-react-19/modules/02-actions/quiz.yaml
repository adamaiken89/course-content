- id: '2.1'
  question: What does useActionState return?
  options:
    a: '[state, action, pending]'
    b: '[state, dispatch]'
    c: '[action, pending, error]'
    d: '[state, action, error]'
  answer: a
  explanation: useActionState returns [data, formAction, isPending]. Unlike useState
    or useReducer which return [state, setter], useActionState includes the pending
    state that React manages automatically.
  difficulty: 1
  tags:
  - terminology
- id: '2.2'
  question: What directive marks a function as a Server Action callable from the client?
  options:
    d: use server
    a: use client
    b: use action
    c: use endpoint
  answer: d
  explanation: '"use server" marks functions callable from client code. React''s build
    step compiles these into POST endpoints. "use client" marks the client boundary
    — opposite direction.'
  difficulty: 1
  tags:
  - terminology
- id: '2.3'
  question: A Server Action throws an unexpected database error. What should handle
    this?
  options:
    a: The nearest React error boundary
    b: The action's own try/catch returning error state
    c: A global window.onerror handler
    d: The form's onSubmit event
  answer: a
  explanation: Unexpected errors (DB down, network failure) should propagate to an
    error boundary. The action's catch is for expected validation errors. Without
    an error boundary, the form stays in pending state permanently.
  difficulty: 2
  tags:
  - concept
- id: '2.4'
  question: What happens when a user submits a form with a Server Action and JavaScript
    is disabled?
  options:
    c: Form submits natively to the POST endpoint; server returns HTML response
    a: Nothing — form requires JS
    b: React falls back to client-side rendering
    d: Form submission is queued until JS loads
  answer: c
  explanation: Server Actions compile to POST endpoints during build. With JS disabled,
    the browser submits the form natively to that endpoint. The server processes the
    action and returns HTML. This is progressive enhancement.
  difficulty: 2
  tags:
  - application
- id: '2.5'
  question: When should you use useTransition instead of useActionState for a mutation?
  options:
    a: When the mutation does not involve a form element
    b: Always — useTransition is more general
    c: When the mutation needs error handling
    d: useActionState and useTransition are interchangeable
  answer: a
  explanation: useActionState requires a <form action> or formAction prop. useTransition
    wraps any async work. Use useActionState for forms, useTransition for buttons,
    links, or programmatic mutations outside forms.
  difficulty: 2
  tags:
  - comparison
- id: '2.6'
  question: How does React prevent stale closure bugs in useActionState?
  options:
    b: The action only receives FormData, not enclosing scope variables
    a: React freezes action scope at submission time
    c: useActionState uses refs internally to avoid closure capture
    d: It does not — you must use useCallback
  answer: b
  explanation: 'Server Actions accept only FormData or serializable arguments. Client
    actions that use setState or props will capture closures. Solution: read current
    state via useActionState''s prevState parameter instead of capturing from enclosing
    scope.'
  difficulty: 3
  tags:
  - concept
- id: '2.7'
  question: What does the prevState parameter in useActionState enable?
  options:
    b: Undo functionality and accumulator patterns
    a: Access to previous component props
    c: Synchronous state updates
    d: Cross-component state sharing
  answer: b
  explanation: prevState returns the previous action result. This enables accumulators
    (append to list), undo (swap with previous), and optimistic UI rollback (revert
    to previous value on error).
  difficulty: 2
  tags:
  - scenario
- id: '2.8'
  question: After a successful Server Action, how do you refresh displayed data?
  options:
    d: Use revalidatePath() or revalidateTag() inside the action
    a: Call window.location.reload()
    b: Set a local state flag to trigger useEffect
    c: The action auto-refreshes the view
  answer: d
  explanation: revalidatePath('/path') purges the server cache for a route. revalidateTag('tag')
    purges cached data fetches tagged with that key. React re-renders affected components
    with fresh data.
  difficulty: 2
  tags:
  - application
- id: '2.9'
  question: Can a Server Action read React state or props from the client component?
  options:
    c: No — Server Actions accept only FormData or serializable args
    a: Yes — Server Actions have full access to component scope
    b: Yes, but only through useActionState's prevState
    d: Yes, but only if wrapped in use client
  answer: c
  explanation: Server Actions compile to POST endpoints — they have no access to client
    React state, props, or closures. Data must be passed via FormData or serializable
    arguments (strings, numbers, plain objects).
  difficulty: 3
  tags:
  - concept
- id: '2.10'
  question: A search form fetches results on each keystroke via Server Action. What
    is the risk?
  options:
    b: Each keystroke triggers a server round-trip; use debounce or client-side filtering
    a: Server Actions cannot handle frequent calls
    c: Server Actions automatically batch keystrokes
    d: useActionState limits to one request at a time
  answer: b
  explanation: Server Actions are designed for form submission, not real-time input.
    Each keystroke fires a server request. Use client-side filtering, debounced API
    calls, or a dedicated search endpoint — not a Server Action wrapped in useActionState.
  difficulty: 3
  tags:
  - scenario

