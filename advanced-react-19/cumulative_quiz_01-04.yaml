- type: mcq
  question: Which three pillars define React 19 architecture per the course mental model?
  options:
    b: Actions, Transitions, React Compiler
    a: Hooks, classes, portals
    c: Redux, Saga, Reselect
    d: Suspense only
  answer: b
  explanation: React 19 reframes the model around Actions (mutations), Transitions (non-blocking updates),
    and the Compiler (auto-memoization).
  difficulty: 1
  tags:
  - recall
  id: cum.1
  source_modules:
  - 1
- type: mcq
  question: What does a Server Action integrate automatically that a plain fetch call does not?
  options:
    c: Pending state across the tree via useFormStatus and progressive enhancement
    a: SQL injection protection
    b: CSS scoping
    d: Bundle minification
  answer: c
  explanation: Actions wire pending/error state, form reset, and JS-disabled fallbacks; raw fetch handles
    none of that.
  difficulty: 2
  tags:
  - concept
  id: cum.2
  source_modules:
  - 2
- type: mcq
  question: Where is use(promise) allowed to suspend?
  options:
    a: Inside any component render under a Suspense boundary
    b: Only in event handlers
    c: Only in useEffect
    d: Nowhere — it is server-only
  answer: a
  explanation: use() unwraps promises during render and suspends to the nearest boundary, unlike useEffect-based
    fetching.
  difficulty: 2
  tags:
  - concept
  id: cum.3
  source_modules:
  - 3
- type: tf
  statement: useTransition marks updates as interruptible so input stays responsive during heavy re-renders.
  answer: true
  explanation: Transitions run at lower priority; urgent updates like typing can interleave.
  difficulty: 1
  tags:
  - recall
  id: cum.4
