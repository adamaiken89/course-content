- id: cum.1
  type: mcq
  source_modules:
  - 1
  question: "A writer is updating a row. With MVCC, what happens to a concurrent reader?"
  options:
    a: "Reader blocks until the writer commits"
    b: "Reader only sees rows visible in its own snapshot"
    c: "Reader waits on the writer row lock"
    d: "Reader raises a serialization failure"
  answer: b
  difficulty: 1
  tags:
  - cross-module
  - concept
- id: cum.2
  type: mcq
  source_modules:
  - 2
  question: "What does the planner use to estimate row counts and costs?"
  options:
    a: "Histograms from pg_statistic"
    b: "Measured times from EXPLAIN ANALYZE"
    c: "Rows cached from pg_stat_activity"
    d: "The logical order of WHERE clauses"
  answer: a
  difficulty: 2
  tags:
  - cross-module
  - concept
