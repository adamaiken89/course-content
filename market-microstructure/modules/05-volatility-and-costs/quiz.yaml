- id: '5.1'
  question: Which pair correctly names the two types of volatility from Harris?
  options:
    a: Systematic volatility and unsystematic volatility
    b: Speculative volatility and hedging volatility
    c: Fundamental volatility and transitory volatility
    d: Historical volatility and implied volatility
  answer: c
  explanation: Harris splits volatility into fundamental volatility (unanticipated
    changes in instrument values) and transitory volatility (trading by uninformed
    traders that later reverts). The other pairs are real finance vocabulary but not
    his two-part split.
  difficulty: 1
  tags:
  - terminology
- id: '5.2'
  question: What is the source of transitory volatility?
  options:
    a: Scheduled central bank announcements
    b: Changes in exchange fee schedules
    c: Unanticipated changes in instrument values
    d: Trading activity by uninformed traders demanding liquidity
  answer: d
  explanation: Transitory volatility comes from impatient uninformed traders taking
    standing quotes; prices diverge from value but eventually revert. Unanticipated
    value changes cause fundamental volatility instead, which does not revert.
  difficulty: 1
  tags:
  - concept
- id: '5.3'
  question: Which trio makes up total transaction costs?
  options:
    a: Market risk, credit risk, and liquidity risk
    b: Explicit costs, implicit costs, and missed trade opportunity costs
    c: Bid, ask, and midpoint prices
    d: Commissions, taxes, and tips
  answer: b
  explanation: Harris defines transaction costs as all trading costs = explicit +
    implicit + missed trade opportunity. Commissions and taxes are only pieces of
    the explicit bucket, and the other options are risk or quote vocabulary, not cost
    components.
  difficulty: 1
  tags:
  - terminology
- id: '5.4'
  question: Commissions, exchange fees, taxes, and trading-desk expenses are which
    component of transaction costs?
  options:
    a: Adverse selection costs
    b: Explicit costs
    c: Implicit costs
    d: Missed trade opportunity costs
  answer: b
  explanation: Explicit costs are "all costs that a cost accountant would easily identify."
    Implicit costs are spread and price impact; missed trade opportunity costs come
    from unfilled or late fills; adverse selection is a spread component, not a cost
    bucket.
  difficulty: 1
  tags:
  - concept
- id: '5.5'
  question: How does the realized spread differ from the effective spread?
  options:
    a: Effective spread uses the midpoint at time of trade; realized spread uses the
      midpoint observed after the trade
    b: Effective spread uses the closing price; realized spread uses the opening price
    c: The two are always identical because both use 2 x signed differences
    d: Realized spread is twice the commission, effective spread is not
  answer: a
  explanation: Both equal 2 x a signed trade-price-minus-midpoint difference, but
    effective spread uses the contemporaneous midpoint while realized spread uses
    a midpoint 5, 10, 15, or 60 minutes later. Their gap equals dealers losses to
    well-informed traders.
  difficulty: 2
  tags:
  - comparison
- id: '5.6'
  question: Why is implementation shortfall the only major cost benchmark a broker
    cannot game?
  options:
    a: It ignores unfilled orders entirely
    b: Its benchmark price is fixed at the decision moment, before the broker receives
      the order
    c: It compares fills to the day volume-weighted average price
    d: It only counts explicit commissions, which are publicly reported
  answer: b
  explanation: Because the benchmark midpoint is set when the manager decided to trade,
    the broker cannot time or mimic it — there is nothing to game toward. VWAP and
    closing-price benchmarks can be deflated by deferring or shaping execution.
  difficulty: 2
  tags:
  - concept
- id: '5.7'
  question: 'In the Plexus study: commissions 12 bps, market impact 20 bps, timing
    costs 53 bps, missed orders 16 bps. How large are the hidden costs in basis points?'
  options:
    a: 69 bps
    b: 101 bps
    c: 32 bps
    d: 25 bps
  answer: a
  explanation: Hidden costs = timing 53 + missed orders 16 = 69 bps, more than double
    the visible 12 + 20 = 32 bps. 101 bps is the total implementation shortfall, not
    just the hidden part.
  difficulty: 2
  tags:
  - calculation
- id: '5.8'
  question: A trader splits a 4,000-share buy into two clips and his broker reports
    a VWAP cost of zero. Why is that misleading?
  options:
    a: Splitting orders is prohibited, so the data is invalid
    b: VWAP excludes commissions, which were $400
    c: He was the only buyer, so his own average equals the day VWAP, yet he still
      paid the spread and moved the price against himself
    d: VWAP is calculated from the closing price, which was 30.20
  answer: c
  explanation: When your average fill equals the market average by construction, the
    VWAP benchmark reports zero no matter how much spread and impact you paid. Implementation
    shortfall against the decision-time midpoint correctly showed the full order cost.
  difficulty: 2
  tags:
  - scenario
- id: '5.9'
  question: A portfolio with beta 1.4 earns a raw return of 16% while the market returns
    10%. What is its risk-adjusted excess return (realized alpha)?
  options:
    a: 2%
    b: -2%
    c: 16%
    d: 6%
  answer: a
  explanation: Realized alpha = raw return - (beta x market return) = 16% - (1.4 x
    10%) = 16% - 14% = 2%. The 6% figure is the naive market-adjusted return, which
    wrongly credits the manager for simply running high beta.
  difficulty: 3
  tags:
  - calculation
- id: '5.10'
  question: Beardstown Ladies claimed 23.4%/yr for 10 years; auditors found 9.1%/yr
    against an S&P 500 return of 14.9%/yr. What does this episode illustrate?
  options:
    a: Because the club was skilled, regression to the mean proves the audit was wrong
    b: The auditors applied the wrong benchmark and the club really won
    c: Arithmetic returns compound exactly, so 23.4% was impossible
    d: Self-reported, unbenchmarked performance can hide roughly 6%/yr of market underperformance
      while the managers believe they are beating the market
  answer: d
  explanation: The audited 9.1% versus the market 14.9% is about 6%/yr of underperformance
    — wrong yardstick plus unchecked arithmetic. It shows absolute returns mean little
    without a benchmark and verification; regression to the mean works the other way,
    dragging selected high past returns down afterward.
  difficulty: 3
  tags:
  - scenario

