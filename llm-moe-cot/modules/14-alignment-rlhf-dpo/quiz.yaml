  answer: d
  difficulty: 2
  tags: []
- id: '14.2'
  question: RLHF pipeline 嘅正確順序係？
  options:
    b: SFT → Reward Model → PPO
    a: PPO → SFT → Reward Model
    c: Reward Model → PPO → SFT
    d: SFT → PPO → Reward Model
  answer: b
  difficulty: 2
  tags: []
- id: '14.3'
  question: Preference-based reward model training 用咩 loss function？
  options:
    c: Bradley-Terry pairwise loss
    a: Cross-entropy loss
    b: Contrastive loss
    d: Triplet margin loss
  answer: c
  difficulty: 2
  tags: []
