  difficulty: 2
  tags: []
- id: '14.9'
  question: Alignment 同 safety 有咩分別？
  options:
    a: Alignment 令 model 跟從意圖；safety 防止傷害
    b: 佢哋同義
    c: Safety 需要 reward model；alignment 唔需要
