  question: 點解 PPO optimisation 要包括對 SFT model 嘅 KL penalty？
  options:
    a: 防止 policy 利用 RM 缺陷 (reward hacking)
    b: 防止災難性遺忘 pre-training data
    c: 減少生成嘅計算成本
    d: 鼓勵多樣化回應
  answer: a
  difficulty: 2
  tags: []
- id: '14.5'
  question: DPO 相比 RLHF 嘅關鍵創新係乜？
  options:
    a: 用 policy ratio 表示 reward，消除 reward model
    b: 用更好 hyperparameters 嘅 PPO
    c: 用單一 responses 而唔係 pairs 訓練
    d: 需要 10 倍更多 preference data
  answer: a
  difficulty: 2
  tags: []
- id: '14.6'
  question: 邊種 alignment method 用 binary (好/壞) feedback 而唔係 pairwise comparisons？
  options:
    b: KTO
    a: DPO
    c: RLHF
    d: ORPO
  answer: b
  difficulty: 2
  tags: []
