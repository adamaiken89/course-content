- id: '14.1'
  question: 邊個最好描述 LLMs 中嘅 alignment problem？
  options:
    d: Pre-trained LM 生成合理但可能有害/無用嘅文字
    a: Model 記住 training data 而唔係泛化
    b: Model 無法處理長 context inputs
