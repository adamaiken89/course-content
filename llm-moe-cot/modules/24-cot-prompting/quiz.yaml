  question: Self-consistency 點樣改善 accuracy？
  options:
    a: Sampling 多個 CoT paths 然後對答案做 majority voting
    b: Fine-tune 喺正確嘅 reasoning paths 上面
    c: 用更大嘅模型嚟做 verification
    d: 增加 temperature 嚟鼓勵 exploration
  answer: a
  difficulty: 2
  tags: []
