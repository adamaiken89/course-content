  question: Auto-CoT 比起 manual few-shot CoT 嘅主要優勢係乜？
  options:
    c: 佢透過 clustering 自動揀 diverse exemplars
    a: 佢生成更長嘅 reasoning chains
    b: 佢完全消除 prompt sensitivity
