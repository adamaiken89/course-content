- id: '24.1'
  question: Kojima 2022 報告用 zero-shot CoT 喺 MultiArith 上面嘅 accuracy 提升係幾多？
  options:
    b: ~17% → ~78%
    a: ~50% → ~90%
    c: ~10% → ~40%
    d: Zero-shot CoT 比 direct 表現更差
  answer: b
  difficulty: 2
  tags: []
