  question: 點解 load imbalance 除咗浪費 expert capacity 之外仲有問題？
  options:
    b: 超載 experts 變成運算瓶頸 (critical path)
    a: 佢增加 GPU 記憶體用量
    c: 佢降低 embedding 質素
    d: 佢增加 attention 運算
  answer: b
  difficulty: 2
  tags: []
