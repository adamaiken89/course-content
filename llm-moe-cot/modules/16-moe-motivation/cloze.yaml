  difficulty: 2
  tags: []
- id: c.4
  question: 喺 MoE 入面，router 輸出計算為 g = {softmax(top-k(W_gate(x)))}。通常 k = {2}。
  answer: softmax(top-k(W_gate(x))) / 2
  difficulty: 2
  tags: []
- id: c.5
  question: MoE {decouples parameter count from compute per token}。加更多 experts 增加
