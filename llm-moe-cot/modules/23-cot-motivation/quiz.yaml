  question: 邊個最適合形容 anti-faithfulness (Turpin 2023)？
  options:
    a: 插入無關嘅資訊改變咗 reasoning steps 但答案仍然正確
    b: 模型跟住 reasoning steps 但 steps 有錯
    c: 模型為解決唔到嘅問題 hallucinate steps
    d: 模型拒絕生成 reasoning steps
  answer: a
  difficulty: 2
  tags: []
