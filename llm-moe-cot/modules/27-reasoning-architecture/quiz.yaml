  question: Implicit reasoning 同 explicit reasoning 有乜分別？
  options:
    c: Implicit 係 single forward pass 就計到答案；explicit 會 generate intermediate tokens
    a: Implicit 用 MoE；explicit 用 dense models
    b: Implicit 係 for image tasks；explicit 係 for text
    d: Implicit 用 RL 訓練；explicit 用 supervised learning
  answer: c
  difficulty: 2
  tags: []
