- id: '7.1'
  question: What is the loss function used in both causal LM and masked LM pretraining?
  options:
    a: '"Cross-entropy loss"'
    b: '"Mean squared error"'
    c: '"Hinge loss"'
    d: '"KL divergence"'
  answer: a
  explanation: '"Cross-entropy measures difference between predicted probability distribution
    and the true token. Both CLM and MLM use cross-entropy over relevant positions."'
  difficulty: 2
  tags: []
- id: '7.2'
  question: In teacher forcing, what input does the model receive at training time?
  options:
    b: '"Ground-truth previous tokens"'
    a: '"The model''s own previous predictions"'
    c: '"Randomly sampled tokens"'
    d: '"Averaged embeddings of ground-truth and predicted tokens"'
  answer: b
  explanation: '"Teacher forcing feeds ground-truth tokens as input. Model''s own
    predictions are only used at inference. This prevents error compounding during
    training."'
  difficulty: 2
  tags: []
- id: '7.3'
  question: '"A causal LM has vocab=50k, model assigns probability 0.8 to correct
    token at each position. What is approximate perplexity?"'
  options:
    a: '"1.25"'
    b: '"0.8"'
    c: '"1.44"'
    d: '"2.0"'
  answer: a
  explanation: '"Loss = -log(0.8) ≈ 0.223. PPL = exp(0.223) ≈ 1.25. Model is as uncertain
    as choosing between ~1.25 equally likely tokens — very confident."'
  difficulty: 2
  tags: []
- id: '7.4'
  question: BERT masks 15% of tokens. Of those, 80% become [MASK], 10% random tokens,
    10% unchanged. Why include unchanged tokens?
  options:
    b: '"Forces model to use context robustly rather than relying on [MASK] signal"'
    a: '"Saves compute because no loss computed for unchanged tokens"'
    c: '"Increases effective batch size"'
    d: '"Prevents overfitting to the training corpus"'
  answer: b
  explanation: '"If only [MASK] appeared, the model could rely on the mask token itself
    as signal. Including random and unchanged tokens forces the model to encode context
    regardless of mask presence — making representations robust for fine-tuning where
    no [MASK] exists."'
  difficulty: 2
  tags: []
- id: '7.5'
  question: What does perplexity (PPL) represent intuitively?
  options:
    a: '"Average branching factor — number of equally likely tokens model is uncertain
      between"'
    b: '"Accuracy at next-token prediction"'
    c: '"Number of training steps needed to converge"'
    d: '"Memory usage during inference"'
  answer: a
  explanation: '"PPL = exp(loss). If PPL=10, model is as uncertain as choosing among
    10 equally likely tokens. Lower PPL = more certain model. PPL of 1.0 = perfect
    prediction."'
  difficulty: 2
  tags: []
- id: '7.6'
  question: Why does CLM (decoder-only) scale better than MLM (encoder-only) for large
    models?
  options:
    c: '"CLM computes loss at every token position, providing more gradient signal
      per forward pass"'
    a: '"CLM uses less memory per layer"'
    b: '"CLM requires no tokenization"'
    d: '"CLM trains faster due to smaller vocabulary"'
  answer: c
  explanation: '"CLM computes loss over ALL tokens (dense signal). MLM computes loss
    over 15% of tokens (sparse). For same compute, CLM gets ~6.7x more training signal
    per token processed. This compounds at scale."'
  difficulty: 2
  tags: []
- id: '7.7'
  question: A model's training loss is 2.5 and validation loss is 3.8. What does this
    gap likely indicate?
  options:
    d: '"Overfitting — model memorises training data but fails to generalise"'
    a: '"Normal — validation loss is always higher"'
    b: '"Underfitting — model needs more training"'
    c: '"Grokking — sudden improvement expected"'
  answer: d
  explanation: '"Large gap (1.3 nats, 52% higher validation loss) signals overfitting.
    Model memorises training distribution narrow patterns. Normal gap should be much
    smaller (<5-10% of training loss)."'
  difficulty: 2
  tags: []
- id: '7.8'
  question: 'Two models report perplexity: Model A PPL=15, Model B PPL=20. Can we
    conclude Model A is better?'
  options:
    b: '"No — PPL not comparable unless both use same tokenizer and test corpus"'
    a: '"Yes — lower PPL always means better model"'
    c: '"Yes — but only for generation quality"'
    d: '"No — higher PPL means better diversity"'
  answer: b
  explanation: '"PPL depends on tokenizer granularity (finer tokenization → lower
    PPL artificially) and test corpus (easy text → lower PPL). Direct comparison requires
    identical tokenizer and test set."'
  difficulty: 2
  tags: []
- id: '7.9'
  question: '"You train a CLM. After 50k steps, loss=4.0. You switch to scheduled
    sampling (10% chance of using model''s own prediction as input at each step).
    What happens?"'
  options:
    c: '"Loss may spike initially because model sees distribution mismatch from training"'
    a: '"Loss drops immediately because model learns to correct own mistakes"'
    b: '"Loss stays identical — scheduled sampling only affects inference"'
    d: '"Training diverges immediately and never recovers"'
  answer: c
  explanation: '"Scheduled sampling exposes model to its own errors during training.
    Model trained with pure teacher forcing sees clean input. When fed model''s own
    (noisier) predictions, loss spikes initially because context distribution shifted.
    Over time it adapts, potentially improving robustness at inference."'
  difficulty: 2
  tags: []
- id: '7.10'
  question: Which pretraining objective does T5 use?
  options:
    d: '"Span corruption — replace random spans of text with sentinel tokens"'
    a: '"Causal LM (next token prediction)"'
    b: '"Masked LM (15% mask)"'
    c: '"Contrastive learning between paired sentences"'
  answer: d
  explanation: '"T5 uses span corruption: random contiguous spans (typically 15% of
    tokens) are replaced with sentinel tokens. Model reconstructs the original spans.
    This bridges CLM and MLM — generative and bidirectional."'
  difficulty: 2
  tags: []

