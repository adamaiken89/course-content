    d: Agentic tool use
  answer: a
  difficulty: 2
  tags: []
- id: '29.4'
  question: Agentic loop 嘅四個步驟係乜？
  options:
    c: Observe, plan, execute, reflect
    a: Train, test, deploy, monitor
    b: Tokenize, embed, attend, predict
    d: Reason, act, verify, correct
  answer: c
  difficulty: 2
  tags: []
