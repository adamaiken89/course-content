  answer: expert cache reuse / acceptance rate
  difficulty: 2
  tags: []
- id: c.7
  question: 超出 expert capacity 嘅 tokens 會被 {dropped} — 佢哋喺嗰層收唔到 expert computation，造成
    {information loss}。
  answer: dropped / information loss
  difficulty: 2
  tags: []
- id: c.8
  question: MoE 比 dense 嘅 speedup 低過 k/E 比率，因為每個 token 要將 {全部 E 個 experts} load 入
    VRAM，雖然只計 {k} 個。
  answer: 全部 E 個 experts / k
  difficulty: 2
  tags: []
