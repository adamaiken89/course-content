  question: "A model generates 'Step 1: A > B. Step 2: B > C. Therefore A > C.' When Step 2 changes to 'B < C', the model still outputs 'A > C'. What does this reveal?"
  options:
    a: The reasoning is faithful, the model uses all steps
    b: The reasoning is partially faithful, the model uses some steps
    c: The reasoning is unfaithful, the answer is computed independently of the steps (post-hoc rationalisation)
    d: The model has correctly re-derived the relationship from Step 1
  answer: c
  explanation: Changing a step without changing the answer shows the steps are rationalisation rather than causal; intervention tests expose this.
  difficulty: 3
  tags:
  - cross-module
  - evaluation
