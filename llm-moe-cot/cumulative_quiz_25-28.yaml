  - 28
  question: A leading cause of hallucination is that a next-token model can produce fluent, plausible-sounding text even when it does not know the true answer. Which statement captures the core problem?
  options:
    a: The model has perfect knowledge of all training data
    b: The model only ever answers when it is certain
    c: The model pretends to know the fact and generates accordingly
    d: The model stores all answers as key-value triples
  answer: c
  explanation: The objective rewards fluent continuations, not truth. When the true answer is absent from memory, the model still emits a fluent confabulation.
  difficulty: 2
  tags:
  - concept
  - synthesis
