  question: Intervention tests that edit one reasoning step and observe whether the answer changes measure the {faithfulness} of the chain.
  answer: faithfulness
  explanation: Faithfulness asks whether the stated steps actually drive the answer; low faithfulness means the chain is post-hoc.
  difficulty: 2
