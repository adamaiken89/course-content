- id: cum.51
  type: mcq
  source_modules:
  - 25
  question: What do intervention experiments generally find about chain-of-thought?
  options:
    a: Steps are partially faithful, some are used while others are post-hoc rationalisation
    b: Every step is strictly causal and load-bearing
    c: No step ever influences the final answer
    d: Steps only affect the style of the generated text
  answer: a
  explanation: "The picture is mixed: some steps are genuinely used, but models can also produce plausible chains that are not causally linked to the answer."
  difficulty: 3
  tags:
  - concept
  - synthesis
- id: cum.52
  type: mcq
  source_modules:
  - 26
  question: How does Tree-of-Thoughts go beyond Self-Consistency?
  options:
    a: It searches over reasoning branches with backtracking instead of only majority-voting over independent samples
    b: It removes all branching and picks a single best path
    c: It fine-tunes a verifier during decoding
    d: It uses a larger model at every step
  answer: a
  explanation: Self-consistency samples independent paths and votes; ToT maintains a tree of partial solutions and searches with backtracks.
  difficulty: 2
  tags:
  - concept
  - comparison
