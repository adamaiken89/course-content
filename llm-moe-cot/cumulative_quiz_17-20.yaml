- id: cum.38
  type: mcq
  source_modules:
  - 18
  question: Which router failure harms MoE training the most?
  options:
    a: Uniform routing that gives every expert an equal share
    b: Capacity factor set exactly to 1.0
    c: Using shared experts alongside routed ones
    d: Router collapse, where most tokens are sent to one or a few experts and others starve
  answer: d
  explanation: Collapse starves most experts of gradients and prediction signal, wasting capacity — the exact failure the load-balancing loss prevents.
  difficulty: 2
  tags:
  - concept
  - scenario
