  statement: An expert that receives no tokens for many steps stops receiving gradient updates and can stay dead for the rest of training.
  answer: true
  explanation: Dead experts get no gradient, so they never recover on their own; load-balancing losses and router tricks are designed to avoid them.
  difficulty: 2
  tags:
  - concept
  - synthesis
