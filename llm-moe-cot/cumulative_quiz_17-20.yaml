- id: cum.33
  type: mcq
  source_modules:
  - 18
  question: In Mixture-of-Experts, what problem does the auxiliary load-balancing loss solve?
  options:
    a: Expert parameters diverge during training
    b: Router sends tokens mostly to a few experts, leaving others unused
    c: Experts forget their specialised knowledge
    d: The capacity factor becomes too large
  answer: b
  explanation: Router collapse causes load imbalance. The auxiliary loss (importance/load/z-loss) penalises imbalanced routing so all experts get trained.
  difficulty: 2
  tags:
  - cross-module
  - training
- id: cum.34
  type: mcq
  source_modules:
  - 17
  question: Inside a MoE transformer layer, what does the router do?
  options:
    a: Sends each token to the top-k most relevant experts, then combines their outputs
    b: Trains every expert on every token to keep them general
    c: Merges all expert weights into one dense feed-forward matrix
    d: Replaces attention with expert operations
  answer: a
  explanation: A learned gating function scores experts per token, activates the top-k, and the weighted sum of their outputs feeds the next layer.
  difficulty: 1
  tags:
  - concept
  - mechanism
