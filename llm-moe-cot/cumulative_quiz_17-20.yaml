  question: What does research on expert specialisation typically find?
  options:
    a: Experts show loose topical specialisation and often route together with shared circuits, not hard hand-assigned topics
    b: Each expert cleanly owns one semantic topic such as math or code
    c: Specialisation is fixed at initialization and never changes
    d: Experts do not specialise at all once training finishes
  answer: a
  explanation: Learned expert groupings are soft and layer-dependent; clean topic ownership is mostly an intuition, not what probes reveal.
  difficulty: 3
  tags:
  - concept
  - synthesis
