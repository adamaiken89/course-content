  question: Why is a MoE model's memory footprint larger than its FLOPs would suggest?
  options:
    a: All experts must remain resident in memory even though only a few are active per token
    b: Expert weights are copied per GPU without sharing
    c: The router duplicates the token embeddings
    d: The KV cache is doubled for expert states
  answer: a
  explanation: Sparse activation limits FLOPs, but every expert's weights must be stored and loaded, so memory and bandwidth dominate MoE serving costs.
  difficulty: 1
