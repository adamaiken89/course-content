  question: Why does chain-of-thought help with arithmetic problems?
  options:
    a: It searches the whole internet for the answer
    b: It breaks the task into intermediate steps that reuse abilities the model already has
    c: It increases the model's parameter count during inference
    d: It activates hidden math experts in dense models
  answer: b
  explanation: CoT decomposes a hard problem into smaller, familiar steps, letting existing sub-abilities combine instead of failing at the whole task at once.
