  statement: Self-consistency (majority voting across multiple CoT paths) and Tree-of-Thoughts (search over reasoning branches) both explore multiple reasoning trajectories, but ToT uses search with backtracking while self-consistency uses parallel independent samples.
  answer: true
  explanation: Self-consistency votes across independent samples; ToT searches branches with BFS/DFS and backtracking. Both go beyond a single CoT path.
