  question: Zero-shot chain-of-thought is best described as which of these?
  options:
    a: Appending something like 'Let's think step by step' with no worked examples
    b: Providing ten labelled demonstrations of reasoning
    c: Fine-tuning the model on reasoning pairs
    d: Running an external symbolic solver
  answer: a
  explanation: Zero-shot CoT adds a reasoning instruction or hint with no examples, and the model produces a chain on its own.
