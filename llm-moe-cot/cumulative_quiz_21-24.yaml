  question: On multi-GPU MoE-serving, expert placement must balance which factors?
  options:
    a: Memory, communication bandwidth, and load across devices
    b: Exactly one expert per GPU regardless of size
    c: Running all experts on the first GPU for cache locality
    d: Disabling load balancing after training
  answer: a
  explanation: Experts are distributed across devices to fit memory, while routing must minimise cross-GPU all-to-all communication and keep devices balanced.
