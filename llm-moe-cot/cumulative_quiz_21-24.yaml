  statement: In MoE, increasing the number of experts always improves model quality because more specialised knowledge can be stored.
  answer: false
  explanation: More experts raise memory and communication costs without proportional quality gain, and make load balancing harder; huge counts like Switch 2048 need top-1 routing.
