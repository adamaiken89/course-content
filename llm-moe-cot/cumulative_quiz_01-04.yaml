  question: What is the core training objective of most current large language models?
  options:
    a: Classify text into a fixed set of labels
    b: Predict the next token given the preceding tokens
    c: Translate between any two languages
    d: Compress images into low-dimensional codes
  answer: b
  explanation: LLMs are next-token predictors; classification and translation are downstream capabilities, not the objective itself.
  difficulty: 1
