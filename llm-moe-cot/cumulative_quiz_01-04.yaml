  question: What role does a nonlinear activation function such as ReLU play in a neural network layer?
  options:
    a: It lets the network represent nonlinear functions by mixing linear layers
    b: It shrinks the vocabulary before feed-forward blocks
    c: It replaces attention during the forward pass
    d: It removes the need for weight matrices
  answer: a
  explanation: Stacking only linear layers stays linear; nonlinear activations let deeper stacks approximate arbitrary functions.
  difficulty: 3
  tags:
