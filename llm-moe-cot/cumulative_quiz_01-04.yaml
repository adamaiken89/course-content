  question: Which mechanism lets every token in a transformer layer exchange information with every other token in one step?
  options:
    a: Residual connection
    b: Self-attention
    c: Layer normalisation
    d: Dropout
  answer: b
  explanation: Self-attention gives each token a weighted view of all other positions — the core information-exchange mechanism of transformers.
