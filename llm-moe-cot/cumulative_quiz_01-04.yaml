  question: 'In attention, √d_k normalises the dot product because Q and K are drawn from distributions with variance {d_k}. Scaling by 1/√d_k restores unit variance.'
  answer: d_k
  explanation: Each of d_k dimensions contributes variance 1 under the unit-variance assumption, so the sum has variance d_k. Dividing by the square root restores unit scale.
