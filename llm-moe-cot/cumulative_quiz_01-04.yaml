  - synthesis
- id: cum.5
  type: mcq
  source_modules:
  - 3
  question: In dot-product attention, what do the query and key vectors together determine?
  options:
    a: Which position becomes the final output token
    b: The attention weight each token places on every other token
    c: The size of the embedding dictionary
    d: The number of layers left to run
  answer: b
  explanation: Q and K are compared per pair of positions; the softmax of their dot products gives the attention weights.
  difficulty: 2
  tags:
  - concept
  - mechanism
