- id: cum.60
  type: mcq
  source_modules:
  - 29
  question: Agentic LLM systems are best described as which of these?
  options:
    a: Models that always answer in one shot without tools
    b: Models that emit actions, observe feedback, and iterate in a loop until the task completes
    c: Static pipelines with no model decisions
    d: Ensembles that only choose the longest output
  answer: b
  explanation: "Agentic systems close the loop: they act, observe results, decide the next action, and repeat — often with tools and external state."
  difficulty: 3
  tags:
  - concept
  - application
