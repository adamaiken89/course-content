  question: Reasoning models such as o1 and R1 mainly extend capability by doing what?
  options:
    a: Scaling inference-time compute with RL-trained step evaluation and search
    b: Compressing the model through pruning at deployment
    c: Adding more decoder layers at runtime
    d: Ignoring the chain and sampling one long answer
  answer: a
  explanation: These models spend more compute at inference, guided by reward-style step evaluation over longer chains, to solve harder problems.
  difficulty: 2
  tags:
  - concept
  - mechanism
- id: cum.58
  type: mcq
  source_modules:
  - 29
  question: What is a core benefit of a multimodal MoE?
  options:
    a: Task-specific experts per modality add capacity without proportional dense-parameter cost
    b: All modalities share one identical expert set so nothing new is learned
    c: Modality experts remove the need for attention
    d: Tokens from different modalities are never mixed
  answer: a
  explanation: Sparse routing lets the model grow modality-specific expertise while keeping per-token compute manageable, a natural extension of MoE to multimodal inputs.
  difficulty: 2
  tags:
  - concept
  - application
