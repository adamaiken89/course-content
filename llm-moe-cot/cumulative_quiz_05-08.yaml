  - 7
  question: The standard pretraining objective for GPT-style models is {next}-token prediction over a large text corpus.
  answer: next
  explanation: Causal language modelling predicts the following token from only the tokens before it, over huge web-scale corpora.
  difficulty: 1
  tags:
  - terminology
  - recall
- id: cum.13
  type: mcq
  source_modules:
  - 6
  question: Why does BPE keep rare words recoverable instead of mapping them all to a single unknown token?
  options:
    a: Because it stores every rare word in a side index
    b: Because it converts rare words to synonyms before tokenizing
    c: Because it decomposes rare words into frequent subword pieces that the decoder can reassemble
    d: Because it ignores rare words entirely during training
  answer: c
  explanation: Subword decomposition preserves meaning and vocabularies stay small; the unknown token is only a fallback for out-of-vocabulary bytes.
  difficulty: 2
  tags:
  - concept
  - mechanism
