- id: cum.9
  type: mcq
  source_modules:
  - 5
  question: What does 'decoder-only' mean for an architecture such as GPT?
  options:
    a: The model has no cross-attention and the same stack both reads the input and generates output
    b: The model only outputs text and never accepts input
    c: The model uses a separate encoder for every layer
    d: The model drops attention and keeps only feed-forward blocks
  answer: a
  explanation: Decoder-only models process the whole prompt through one stack of blocks with causal self-attention, and generate tokens from that same stack.
  difficulty: 1
  tags:
  - terminology
  - recall
