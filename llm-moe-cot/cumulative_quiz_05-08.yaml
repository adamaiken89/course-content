  type: tf
  source_modules:
  - 8
  statement: Modern transformer variants need both layer normalization and residual connections; removing either usually destabilises or sharply degrades training.
  answer: true
  explanation: Residual connections preserve gradient flow; layer norm controls activation scale. Together they make very deep stacks trainable.
  difficulty: 3
  tags:
  - concept
  - synthesis
- id: cum.16
  type: tf
  source_modules:
  - 7
  statement: In causal language modelling, the model can look at only the tokens before a position, never the tokens after it, when predicting that position.
  answer: true
  explanation: A causal mask blocks future tokens, so the prediction at position t depends only on tokens 0..t-1.
  difficulty: 2
