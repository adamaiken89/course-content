  question: BPE tokenization splits text into {subword} units, which balances vocabulary size against coverage of rare words.
  answer: subword
  explanation: Subword tokenizers like BPE keep frequent words whole and split rare words into pieces that recur across the corpus.
  difficulty: 1
  tags:
  - terminology
  - recall
- id: cum.11
  type: mcq
  source_modules:
  - 5
  question: Why does a decoder-only model keep a KV cache during generation?
  options:
    a: To recompute past keys and values from scratch on every new token
    b: To avoid recomputing past key and value vectors for each newly generated token
    c: To double the size of the embedding table at inference
    d: To disable attention entirely for long sequences
  answer: b
  explanation: Past keys and values are unchanged across steps, so caching them avoids redundant recomputation and speeds up generation.
  difficulty: 2
  tags:
  - concept
  - mechanism
