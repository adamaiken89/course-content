  statement: GQA (Grouped-Query Attention) reduces KV cache size by sharing key/value heads across multiple query heads, at a small quality cost compared to full multi-head attention.
  answer: true
  explanation: GQA groups query heads to share KV heads, shrinking cache from h key/value heads to g much smaller g, as used in Llama 2/3.
