  question: Which activation family is common in the feed-forward blocks of modern LLMs?
  options:
    a: Gated linear units such as SwiGLU or GeGLU
    b: Hard sigmoid
    c: Tanh only
    d: No activation at all
  answer: a
  explanation: Gated activations like SwiGLU gate the hidden representation with a learned sigmoid factor and typically beat plain ReLU in transformer FFNs.
  difficulty: 2
