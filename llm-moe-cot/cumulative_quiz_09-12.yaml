  question: Why does RoPE (Rotary Position Embedding) preserve relative position information in attention?
  options:
    a: It adds a learned bias to attention logits based on absolute position
    b: It rotates Q and K vectors by angles proportional to position, making Q·Kᵀ depend on position difference
    c: It concatenates position IDs to token embeddings
    d: It uses a separate feed-forward network to encode position
  answer: b
  explanation: RoPE applies rotation matrices R(i) and R(j) to Q and K so attention depends only on the relative position j-i.
  difficulty: 2
  tags:
  - cross-module
  - architecture
