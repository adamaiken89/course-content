  type: mcq
  source_modules:
  - 12
  question: Which scaling law determines the optimal allocation of compute between parameters and data?
  options:
    a: Kaplan scaling law (larger models are more important than more data)
    b: Chinchilla scaling law (~20 tokens per parameter for compute-optimal training)
    c: Power law of irreducible loss
    d: Test-time compute scaling law
  answer: b
  explanation: Chinchilla recomputed scaling laws with a fixed compute budget, finding an optimal ~20 tokens per parameter allocation.
  difficulty: 2
  tags:
  - cross-module
  - theory
