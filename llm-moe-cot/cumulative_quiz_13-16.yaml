  question: Which best describes an emergent ability of large language models?
  options:
    a: A capability that is near-absent in small models but appears once a scale threshold is crossed
    b: A capability explicitly programmed by the training pipeline
    c: A capability that only exists in encoder-only models
    d: A capability that decreases as models grow larger
  answer: a
  explanation: Emergent abilities show a sharp, threshold-like jump in capability as model scale crosses a critical point.
  difficulty: 2
  tags:
  - concept
  - terminology
