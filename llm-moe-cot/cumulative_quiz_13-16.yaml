  question: How does Direct Preference Optimization (DPO) differ from classical RLHF?
  options:
    a: It requires a large reward model trained on human feedback
    b: It only fine-tunes the tokenizer instead of the weights
    c: It replaces all human data with synthetic labels
    d: It trains directly on pairwise preference data without a separate reward model or RL loop
  answer: d
  explanation: DPO re-derives the RL objective as a classification loss over preferences, removing the explicit reward model and PPO loop.
  difficulty: 3
  tags:
  - concept
  - comparison
