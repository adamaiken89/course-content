  question: Why does a Mixture-of-Experts model get more parameters without a proportional jump in compute cost?
  options:
    a: Only the top k experts compute for each token, so most parameters stay idle per forward pass
    b: Expert parameters are stored in compressed float4 to cut FLOPs
    c: The router halves the sequence length before the experts run
    d: Experts share weights, so nothing extra is added
  answer: a
  explanation: Sparse activation means each token touches only its top-k experts; FLOPs grow sublinearly while total parameter count (and memory) still grows.
  difficulty: 1
  tags:
  - concept
  - mechanism
