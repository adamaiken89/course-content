- id: '6.1'
  question: How does Tailwind JIT engine decide which CSS classes to generate?
  options:
    b: Scans source files for complete utility class name strings
    a: Generates all possible Tailwind utilities
    c: User manually lists classes in config
    d: Generates classes on every HTTP request
  answer: b
  explanation: JIT scans source files for full class name strings (e.g., 'bg-blue-500
    px-4'). Dynamically constructed strings (bg-${color}) may miss detection.
  difficulty: 1
  tags:
  - terminology
- id: '6.2'
  question: What problem does tailwind-merge solve?
  options:
    d: Resolves conflicting Tailwind utility classes predictably
    a: Merges Tailwind configs from multiple files
    b: Combines Tailwind with CSS Modules
    c: Minifies Tailwind class names
  answer: d
  explanation: 'Tailwind utilities have equal specificity. ''px-4 px-6'' — CSS source
    order determines winner. twMerge intelligently resolves conflicts: later explicit
    override wins.'
  difficulty: 2
  tags:
  - concept
- id: '6.3'
  question: What is the bundle size impact of Tailwind CSS (gzip, typical app)?
  options:
    c: 5-15 kB (purged, JIT-generated)
    a: 50-100 kB
    b: 0 kB — Tailwind has no output
    d: Depends on Tailwind version only
  answer: c
  explanation: JIT generates only used utilities. Typical Tailwind app outputs 5-15
    kB gzip CSS. Plus ~0.5 kB for reset/base styles.
  difficulty: 1
  tags:
  - concept
- id: '6.4'
  question: Which library provides type-safe variant definitions for Tailwind components?
  options:
    a: cva (class-variance-authority)
    b: clsx
    c: tailwind-merge
    d: tailwind-variants
  answer: a
  explanation: 'cva defines variants with TypeScript types. button({ variant: ''primary'',
    size: ''lg'' }) returns class string. Invalid variant name = TS error.'
  difficulty: 1
  tags:
  - terminology
- id: '6.5'
  question: How do you add custom brand colors in Tailwind v4?
  options:
    a: 'app.css → @theme { --color-brand: #6366f1; }'
    b: tailwind.config.ts → colors
    c: Inline style prop
    d: Cannot add custom colors — Tailwind only has defaults
  answer: a
  explanation: 'Tailwind v4 uses @theme directive in CSS. --color-brand: #6366f1 becomes
    bg-brand, text-brand, border-brand utilities.'
  difficulty: 2
  tags:
  - application
- id: '6.6'
  question: 'Tailwind classes: ''px-4 py-2 bg-blue-500 text-white rounded-md''. How
    many CSS rules does JIT generate?'
  options:
    d: 5 separate utility rules (padding-x, padding-y, background, color, border-radius)
    a: 1 combined rule
    b: Generated per component instance
    c: At least 10 rules
  answer: d
  explanation: 'Each Tailwind utility is a separate CSS rule with a single declaration.
    px-4 = .px-4 { padding-left: 1rem; padding-right: 1rem; }. They compose via multiple
    classes on one element.'
  difficulty: 2
  tags:
  - concept
- id: '6.7'
  question: What's the main readability concern with Tailwind at scale?
  options:
    b: className strings exceeding 10+ utilities become hard to scan
    a: File size too large
    c: Tailwind has no CSS equivalent
    d: Cannot write media queries
  answer: b
  explanation: 'A className string with 15+ utilities (including responsive variants,
    states, dark mode) becomes visually noisy. Pattern: extract into sub-components
    or use cva for complex states.'
  difficulty: 2
  tags:
  - scenario
- id: '6.8'
  question: Can Tailwind be used in React Server Components?
  options:
    c: Yes — class strings are static, zero runtime needed
    a: No — requires client-side JS
    b: Yes — but only with 'use client'
    d: No — only works with Pages Router
  answer: c
  explanation: Tailwind classes are string literals — no runtime, no hooks, no JavaScript
    execution needed. Fully RSC-compatible in any framework.
  difficulty: 2
  tags:
  - concept
- id: '6.9'
  question: A component has 20+ Tailwind classes with responsive prefixes, dark mode,
    and hover states. Best refactoring approach?
  options:
    c: Extract sub-components for each section
    a: Switch to CSS Modules
    b: Add more Tailwind classes
    d: Use inline styles
  answer: c
  explanation: Extract logical sub-components. Each gets its own className with fewer
    classes. Also consider cva for variant-heavy components. Not an either/or with
    Tailwind.
  difficulty: 3
  tags:
  - scenario
- id: '6.10'
  question: 'What happens when you dynamically construct a class name: className={`bg-${color}-500`}?'
  options:
    b: May fail — JIT can't scan dynamic expressions, class may not be generated
    a: Always works — Tailwind supports dynamic classes
    c: Throws compile error
    d: Generates all possible color variants
  answer: b
  explanation: JIT scans source files as strings. It reads className='bg-blue-500'
    but can't evaluate bg-${color}-500. If color='blue' at runtime, the class may
    not exist. Use full class names or safelist.
  difficulty: 3
  tags:
  - application
- id: '6.11'
  question: When does Tailwind become a WORSE choice than CSS Modules for a component?
  options:
    d: When a component's className string exceeds 20+ utilities with conditional
      logic
    a: Always — CSS Modules are better for everything
    b: When the app has fewer than 10 pages
    c: When using TypeScript
  answer: d
  explanation: At 20+ utilities in one className string, readability breaks. The component
    is too complex for inline Tailwind. Extract to CSS Modules or split into sub-components.
    Tailwind excels at simple to moderate complexity.
  difficulty: 2
  tags:
  - scenario
- id: '6.12'
  question: At what app size does Tailwind's single CSS file become a performance
    concern compared to per-page CSS Modules?
  options:
    a: 50+ pages (single file contains utilities from all pages)
    b: 5 pages
    c: Never — Tailwind always produces the smallest CSS
    d: 1000+ pages
  answer: a
  explanation: 'At 50+ pages, Tailwind generates a single file containing utilities
    from every page. Each page loads the full file but uses ~10%. Per-page CSS Modules
    would be smaller per route. Mitigation: per-route entry points.'
  difficulty: 2
  tags:
  - scenario

