- id: '17.1'
  question: What is the recommended pattern for migrating CSS approaches in a large
    React app?
  options:
    b: Strangler fig — gradual replacement during feature work
    a: Full rewrite over one weekend
    c: Rewrite all CSS first, then migrate components
    d: Only migrate when the library is deprecated
  answer: b
  explanation: The strangler fig pattern grows new architecture alongside old, replacing
    pieces during feature work. No big-bang rewrite. Each component migrates when
    it's already being touched.
  difficulty: 1
  tags:
  - concept
- id: '17.2'
  question: A component hasn't been modified in 3 years and uses an old CSS approach.
    Should you migrate it?
  options:
    d: No — if it works and no feature requires changes, migration has negative ROI
    a: Yes — all components must use the same approach
    b: Yes — but only if it's a leaf component
    c: No — old components should be deleted
  answer: d
  explanation: Never migrate a component unless touching it for a feature or bug fix.
    'Style-only' migrations create work with zero user-facing value. Migrate when
    you add a feature.
  difficulty: 2
  tags:
  - scenario
- id: '17.3'
  question: What's the FIRST step in any CSS migration?
  options:
    d: Extract design tokens to CSS custom properties
    a: Install the new CSS tool
    b: Rewrite the first component
    c: Notify all developers
  answer: d
  explanation: Extract design tokens (colors, spacing, fonts) to CSS custom properties
    FIRST. This decouples visual values from implementation. Both old and new approaches
    read from the same source. Changing a value updates both systems.
  difficulty: 2
  tags:
  - concept
- id: '17.4'
  question: What is the risk of creating 'CSS migration' tickets that don't include
    feature work?
  options:
    b: They create work with zero user-facing value, reducing business buy-in
    a: No risk — pure CSS tickets are efficient
    c: CSS cannot be migrated without feature changes
    d: They're the only way to ensure consistency
  answer: b
  explanation: 'Pure CSS migration tickets have no user-visible outcome. Management
    sees ''two sprints, zero features.'' Pair migration with feature work: ''Add search
    bar (and convert related component to CSS Modules).'''
  difficulty: 2
  tags:
  - scenario
- id: '17.5'
  question: During migration from styled-components to CSS Modules, an old component
    wraps a new component. How do they coexist?
  options:
    a: They coexist naturally — each file uses its own approach, CSS custom properties
      bridge theming
    b: Convert both at the same time
    c: Wrap the new component in ThemeProvider
    d: Convert the parent first
  answer: a
  explanation: Old and new components coexist in the same tree. Each uses its own
    styling approach. CSS custom properties bridge theming. The old component reads
    var(--color-primary), the new component reads the same var.
  difficulty: 2
  tags:
  - concept
- id: '17.6'
  question: A team of 10 starts migrating 300 styled-components to CSS Modules. What's
    the best progress metric?
  options:
    a: Percentage-based — '70% of components converted'
    b: Deadline-based — 'done by June'
    c: Time-based — '3 sprints for migration'
    d: No tracking — just work on it when possible
  answer: a
  explanation: Percentage of converted components is measurable and objective. 'Done
    by June' is a guess. Track converted/total weekly. Adjust timeline based on actual
    velocity, not estimates.
  difficulty: 1
  tags:
  - scenario
- id: '17.7'
  question: What's the first component type you should migrate in a CSS transition?
  options:
    c: A leaf component with simple styles (Button, Badge)
    a: The most complex component (Table)
    b: The root App component
    d: Any component with !important
  answer: c
  explanation: Start with leaf components (no children, simple styles). Low risk,
    fast success. Confidence builds. Complex components come later when the team is
    comfortable with the new approach.
  difficulty: 2
  tags:
  - scenario
- id: '17.8'
  question: How should you prevent new components from using the old approach during
    migration?
  options:
    c: ESLint rule that warns on old approach imports in new files
    a: Verbally remind developers in standup
    b: Delete the old library immediately
    d: Don't worry — it'll sort itself out
  answer: c
  explanation: ESLint rules enforce the constraint automatically. 'No new imports
    from styled-components after migration start date.' Combined with code review,
    this prevents old-approach usage in new files.
  difficulty: 1
  tags:
  - application
- id: '17.9'
  question: When should you remove the old approach's build pipeline?
  options:
    a: When zero imports of the old approach remain in source
    b: Immediately after starting migration
    c: When 50% of components are converted
    d: Never — keep both forever
  answer: a
  explanation: 'Remove old dependencies and build config when zero imports reference
    them. Removing too early blocks migration. Removing too late creates confusion.
    Verify: zero source imports, zero CI references, zero docs.'
  difficulty: 2
  tags:
  - concept
- id: '17.10'
  question: A team has 6 months to migrate 200 components. Their velocity is 5 components
    per week. What should they do?
  options:
    b: 'Prioritize: migrate highest-traffic components first, accept incomplete migration
      at month 6'
    a: Work overtime to meet deadline
    c: Cancel all features until migration is complete
    d: Hire 3 more developers for the migration
  answer: b
  explanation: At 5/week for 24 weeks = 120 components in 6 months. Realistically
    80-90% completion. Prioritize high-traffic components. '90% converted, no new
    old-style components' is a success state. Ship features alongside migration.
  difficulty: 3
  tags:
  - scenario

