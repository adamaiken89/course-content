- id: '2.1'
  question: 'In React, importing a CSS file in ComponentA.tsx affects:'
  options:
    b: The entire page/document
    a: Only ComponentA
    c: ComponentA and its children
    d: Only sibling components
  answer: b
  explanation: CSS in React is globally scoped regardless of which import triggers
    the load. Any CSS import affects the entire document.
  difficulty: 1
  tags:
  - terminology
- id: '2.2'
  question: What does BEM's double underscore (__) represent?
  options:
    a: An element (child of block)
    b: A modifier variant
    c: A nested block
    d: A CSS pseudo-class
  answer: a
  explanation: 'BEM convention: block__element. Example: button__icon means ''icon
    element inside button block''. block--modifier for variants.'
  difficulty: 1
  tags:
  - terminology
- id: '2.3'
  question: Which Sass feature creates invisible cross-component coupling in React?
  options:
    c: '@extend'
    a: Mixins
    b: Variables
    d: Nesting
  answer: c
  explanation: '@extend moves selectors to the extended rule''s location. If Component
    A extends a placeholder from Component B''s stylesheet, removing B breaks A. Styles
    become non-local.'
  difficulty: 2
  tags:
  - concept
- id: '2.4'
  question: 'A Sass variable $color-primary: #0366d6 is defined. How does it appear
    in the browser''s final CSS?'
  options:
    d: 'As the compiled value #0366d6'
    a: As $color-primary preserved in CSS
    b: As var(--color-primary)
    c: Undefined — Sass doesn't compile
  answer: d
  explanation: 'Sass variables are compile-time only. They get replaced with their
    literal value during build. Browser sees #0366d6, not $color-primary.'
  difficulty: 1
  tags:
  - concept
- id: '2.5'
  question: In Next.js App Router, where should global CSS be imported?
  options:
    a: Only root layout.tsx
    b: Any page.tsx
    c: Any component.tsx
    d: Only app/global.css
  answer: a
  explanation: App Router restricts global CSS imports to the root layout. Per-page
    global CSS is not supported — component CSS must be scoped (CSS Modules) or utility-based
    (Tailwind).
  difficulty: 2
  tags:
  - concept
- id: '2.6'
  question: Which scenario is a GOOD fit for plain CSS/Sass in React?
  options:
    d: Legacy codebase with existing Sass design tokens
    a: Component library consumed by 10 external apps
    b: Large team (30 devs) building new features daily
    c: RSC-first greenfield Next.js app
  answer: d
  explanation: Legacy codebases with Sass investment benefit from incremental migration.
    New apps, large teams, library distribution, and RSC apps benefit from scoped
    CSS approaches.
  difficulty: 3
  tags:
  - scenario
- id: '2.7'
  question: 'CSS specificity: .card .header .title .icon { color: blue; }. What specificity
    value is this?'
  options:
    b: 0,0,4,0
    a: 0,1,0,0
    c: 0,4,0,0
    d: 0,1,4,0
  answer: b
  explanation: Four classes = 0,0,4,0 (0 inline, 0 IDs, 4 classes, 0 elements). Deep
    nesting generates high specificity that later rules struggle to override without
    !important.
  difficulty: 2
  tags:
  - calculation
- id: '2.8'
  question: You need runtime theme switching (light/dark). Can Sass variables handle
    this alone?
  options:
    a: No — Sass compiles away, cannot change at runtime
    b: Yes — Sass compiles to CSS, browser reads variables
    c: Yes — use @media prefers-color-scheme
    d: No — Sass only works in development
  answer: a
  explanation: Sass variables are replaced with static values at build time. Runtime
    theme switching needs CSS custom properties (var(--color-bg)) which browser evaluates
    live.
  difficulty: 2
  tags:
  - concept
- id: '2.9'
  question: 'A dev writes button { padding: 8px 16px; } in a global stylesheet. Which
    problem occurs first at scale?'
  options:
    c: Naming collision — another .button rule overrides unexpectedly
    a: Performance — selector is too specific
    b: Syntax error — padding shorthand not supported
    d: React re-renders on every style change
  answer: c
  explanation: Global .button class affects every component rendering a button. Another
    component's .button style overrides via cascade order. No isolation means collisions
    are inevitable with scale.
  difficulty: 2
  tags:
  - scenario
- id: '2.10'
  question: What's the recommended nesting depth limit for Sass in React components?
  options:
    b: Maximum 1 level per component
    a: No limit — use as many levels as component tree
    c: Maximum 3 levels per component
    d: Maximum 5 levels per component
  answer: b
  explanation: Sass nesting reflects CSS specificity, not component hierarchy. One
    level per component keeps specificity low. Exceeding 3 levels indicates you need
    a child component, not deeper nesting.
  difficulty: 2
  tags:
  - concept

