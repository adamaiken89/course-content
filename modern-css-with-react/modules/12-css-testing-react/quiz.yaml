- id: '12.1'
  question: What do visual regression tests compare?
  options:
    b: Component screenshots against golden baselines
    a: CSS property values
    c: Class name strings
    d: Bundle size
  answer: b
  explanation: VRT captures screenshots of components and compares to stored baselines.
    Any pixel difference fails the test.
  difficulty: 1
  tags:
  - terminology
- id: '12.2'
  question: When a visual regression test fails, what's the correct response?
  options:
    d: Update golden snapshot if the visual change is intentional
    a: Revert the code change
    b: Ignore — tests are flaky
    c: Delete the snapshot
  answer: d
  explanation: Review the diff. If intentional (design change), update baseline. If
    unintentional (bug caused visual change), fix the code.
  difficulty: 2
  tags:
  - concept
- id: '12.3'
  question: What should you NOT test in CSS unit tests?
  options:
    c: 'Browser rendering of display: flex'
    a: Conditional class merging logic
    b: Variant selection (correct class for variant)
    d: twMerge conflict resolution
  answer: c
  explanation: 'Trust the browser''s CSS engine. Testing that display: flex works
    is testing the browser, not your code. Test your component''s variant logic and
    class merging.'
  difficulty: 2
  tags:
  - concept
- id: '12.4'
  question: Which tool provides automated accessibility audits?
  options:
    a: axe-core
    b: Playwright only
    c: Tailwind CSS
    d: clsx
  answer: a
  explanation: 'axe-core automates accessibility checks: contrast ratios, ARIA roles,
    keyboard navigation, focus indicators. Integrates with Playwright or Cypress.'
  difficulty: 1
  tags:
  - terminology
- id: '12.5'
  question: How do you test responsive breakpoint behavior?
  options:
    c: Assert grid-template-columns at different viewport sizes
    a: Take screenshots at every breakpoint
    b: Mock window.innerWidth
    d: Responsive behavior is untestable
  answer: c
  explanation: Set viewport size with page.setViewportSize(), assert CSS property
    values like grid-template-columns or flex-direction at each breakpoint.
  difficulty: 2
  tags:
  - application
- id: '12.6'
  question: A Button changes primary bg from blue to green. What tests catch this?
  options:
    d: Visual regression — screenshot comparison shows diff
    a: Unit test — expect(BUTTON.bg).toBe('green')
    b: TypeScript — color type changed
    c: Bundle analysis — CSS file size changed
  answer: d
  explanation: VRT catches the visual change automatically. Unit test testing specific
    color values would need manual update — VRT surfaces ALL visual diffs regardless
    of which property changed.
  difficulty: 3
  tags:
  - scenario
- id: '12.7'
  question: Why should you NOT test generated CSS Module class names?
  options:
    a: Class names are hashed — change with every build
    b: They are never visible to users
    c: CSS Modules don't generate class names
    d: They are not strings
  answer: a
  explanation: CSS Module class names include content hashes that change when CSS
    changes. Testing the exact hash is brittle. Test behavior or visual output instead.
  difficulty: 2
  tags:
  - concept
- question: Which assertion suits a CSS Modules unit test?
  options:
    b: Snapshot the compiled class mapping and assert expected class names are applied
    a: Compare pixel colors
    c: Assert bundle hash
    d: Check network waterfalls
  answer: b
  explanation: CSS Modules guarantee local class names; tests assert the mapped classes
    land on elements without depending on global names.
  difficulty: 2
  tags:
  - concept
  id: '12.8'

