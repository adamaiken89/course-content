- id: '1.1'
  question: Which CSS approach for React has ZERO runtime cost in the browser?
  options:
    a: CSS Modules
    b: styled-components
    c: Emotion
    d: Runtime CSS-in-JS
  answer: a
  explanation: CSS Modules are compiled at build time. Generated CSS file is loaded
    as static asset — no JavaScript runtime executes to apply styles.
  difficulty: 1
  tags:
  - terminology
- id: '1.2'
  question: Your Next.js App Router app uses React Server Components. Which approach
    requires `'use client'` for every styled component?
  options:
    b: styled-components
    a: CSS Modules
    c: Tailwind CSS
    d: Vanilla Extract
  answer: b
  explanation: Runtime CSS-in-JS (styled-components, Emotion) injects styles via JavaScript
    in browser — incompatible with RSC's server-only execution. Must use 'use client'.
  difficulty: 2
  tags:
  - concept
- id: '1.3'
  question: A teammate says 'I need CSS-in-JS to make styles dynamic based on props.'
    What's the correct response?
  options:
    d: False — class composition with clsx achieves the same
    a: True — only CSS-in-JS can read React props
    b: True — but only styled-components supports this
    c: False — inline styles are the only alternative
  answer: d
  explanation: Dynamic styles in React = conditional class toggling. clsx(styles.base,
    props.variant && styles[props.variant]) works with any CSS approach and costs
    zero runtime.
  difficulty: 2
  tags:
  - misconception
- id: '1.4'
  question: A team has 50 React components, Sass + BEM, migrating to Next.js App Router.
    They want to keep existing investment. Which approach fits best?
  options:
    c: Keep Sass for migrated pages, CSS Modules for new RSC components
    a: Rewrite everything in Tailwind
    b: Switch to styled-components for SSR
    d: Convert all Sass to Vanilla Extract
  answer: c
  explanation: Incremental migration preserves existing Sass work. New RSC components
    use CSS Modules (zero-cost, RSC-compatible). Avoids full rewrite risk.
  difficulty: 3
  tags:
  - scenario
- id: '1.5'
  question: Which approach is seeing growth in 2026 because it gives CSS-in-JJ syntax
    with zero runtime?
  options:
    d: Vanilla Extract
    a: Styled-components
    b: Plain CSS
    c: Sass
  answer: d
  explanation: Vanilla Extract reads .css.ts files at build time and outputs static
    CSS. TypeScript-first, zero runtime, RSC-compatible.
  difficulty: 1
  tags:
  - terminology
- id: '1.6'
  question: What problem does the native `@scope` CSS rule solve?
  options:
    b: Component-level CSS scoping without tooling
    a: Variable scoping in CSS
    c: Scoped animations
    d: Scoped font loading
  answer: b
  explanation: '@scope(.card) { ... } limits CSS rules to elements matching the scope
    root and its descendants — native scoping without CSS Modules or naming conventions.'
  difficulty: 1
  tags:
  - terminology
- id: '1.7'
  question: 'Approach A: 0 kB runtime, RSC-compatible, no auto-scoping. Approach B:
    0 kB runtime, RSC-compatible, auto-scoped. Identify A and B.'
  options:
    c: A = Plain CSS, B = CSS Modules
    a: A = Plain CSS, B = Tailwind
    b: A = CSS Modules, B = Plain CSS
    d: A = Tailwind, B = Plain CSS
  answer: c
  explanation: Both have zero runtime. Plain CSS lacks auto-scoping (global by default).
    CSS Modules auto-generate unique class names. Tailwind has ~0.5 kB runtime for
    resets.
  difficulty: 2
  tags:
  - comparison
- id: '1.8'
  question: Which decision axis matters MOST for choosing a CSS approach in 2026 React
    apps?
  options:
    c: RSC / Server Component compatibility
    a: Syntax preference
    b: Number of colors available
    d: File extension
  answer: c
  explanation: RSC compatibility cascades into runtime cost, bundle strategy, and
    component architecture. 2026 React is server-first; approaches that require client
    JS for styling lose most RSC benefits.
  difficulty: 2
  tags:
  - scenario
- id: '1.9'
  question: How does zero-runtime CSS-in-JS differ from runtime CSS-in-JS in bundle
    impact?
  options:
    a: Zero-runtime extracts styles to separate CSS files at build time; runtime injects
      via JS
    b: Both add the same runtime
    c: Runtime is smaller because it compresses styles
    d: Zero-runtime only works in development
  answer: a
  explanation: Runtime CSS-in-JS keeps style strings in JS bundle and injects via
    script. Zero-runtime generates static .css files during build, loaded separately
    — styles never touch JS bundle.
  difficulty: 1
  tags:
  - concept
- id: '1.10'
  question: You're building a React component library consumed by 5 internal apps.
    Which approach is most appropriate?
  options:
    d: Vanilla Extract (zero runtime, typed, CSS custom properties for theming)
    a: styled-components (ThemeProvider for all apps)
    b: Tailwind (each app uses same config)
    c: Global Sass (single stylesheet for all)
  answer: d
  explanation: Component libraries should impose zero runtime cost on consumers. Vanilla
    Extract extracts at build time, enforces type safety, and CSS custom properties
    let consumers theme without dependency on a specific JS library.
  difficulty: 3
  tags:
  - scenario
- id: '1.11'
  question: What is the recommended boundary rule for mixing CSS approaches in one
    app?
  options:
    b: One approach per component file — mixing happens at file import boundaries
    a: Use all approaches in every component
    c: Never mix — pick one approach for the whole app
    d: Mix freely — build tools handle conflicts automatically
  answer: b
  explanation: 'Each component file uses exactly one CSS approach. Mixing happens
    at the architecture level: a Tailwind page imports CSS Module components. Never
    combine styled-components + CSS Modules + inline styles in one file.'
  difficulty: 2
  tags:
  - concept
- id: '1.12'
  question: Your team wants to use Tailwind for layout and CSS Modules for complex
    widgets. Which combination pattern does this represent?
  options:
    a: Layer-based hybrid — each layer uses the best-fit approach
    b: Runtime + zero-runtime hybrid
    c: Single-approach dogma
    d: Legacy-first architecture
  answer: a
  explanation: 'Layer model: global foundation (plain CSS) → layout (Tailwind) → component
    (CSS Modules) → override (className). Each layer''s approach is chosen for its
    specific needs. Tailwind for speed, CSS Modules for isolation.'
  difficulty: 2
  tags:
  - concept

