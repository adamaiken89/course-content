- id: '15.1'
  question: Which CSS approach is best for a shared component library consumed by
    apps with different frameworks?
  options:
    c: CSS Modules + CSS custom properties
    a: styled-components (ThemeProvider)
    b: Tailwind (requires consumer to use Tailwind)
    d: Global Sass
  answer: c
  explanation: CSS Modules scope styles, CSS custom properties enable theming. Zero
    dependencies on consumer. Works with React, Vue, Angular — any framework that
    supports CSS.
  difficulty: 2
  tags:
  - scenario
- id: '15.2'
  question: In the capstone architecture, how do consumers customize component colors?
  options:
    a: Override CSS custom properties in their stylesheet
    b: Pass theme object to ThemeProvider
    c: Pass color prop to every component
    d: Modify library source code
  answer: a
  explanation: 'Library exposes --ds-color-* variables. Consumer overrides: :root
    { --ds-color-primary: #purple; }. No React code changes.'
  difficulty: 2
  tags:
  - application
- id: '15.3'
  question: Why does the capstone use cva + twMerge instead of just cva?
  options:
    d: twMerge lets consumers override variant classes via className prop
    a: cva doesn't work without twMerge
    b: cva generates conflicting classes
    c: twMerge replaces cva entirely
  answer: d
  explanation: cva handles variant selection. twMerge merges variant class string
    with consumer's className, resolving conflicts predictably.
  difficulty: 2
  tags:
  - concept
- id: '15.4'
  question: How does the capstone Card component respond to narrow containers?
  options:
    a: Uses @container query to detect width
    b: Accepts a variant prop
    c: Uses React Context for width
    d: ResizeObserver hook
  answer: a
  explanation: 'container-type: inline-size on .card + @container (max-width: 300px)
    reduces padding. No JavaScript, no prop — native CSS responsiveness.'
  difficulty: 1
  tags:
  - application
- id: '15.5'
  question: What would change if the library targeted internal use only (one team,
    one framework)?
  options:
    b: Could use Tailwind — no cross-framework concern
    a: Nothing — same architecture
    c: Must still avoid all dependencies
    d: Switch to inline styles
  answer: b
  explanation: Internal single-framework library removes cross-compatibility constraint.
    Tailwind, Vanilla Extract, or styled-components all viable.
  difficulty: 3
  tags:
  - scenario
- id: '15.6'
  question: 'Capstone testing approach includes:'
  options:
    c: VRT for visual regression + a11y audit
    a: Unit tests for variant logic only
    b: No tests — trust the CSS
    d: Only TypeScript compilation checks
  answer: c
  explanation: VRT (Playwright/Chromatic) for visual diffs. axe-core for a11y. Unit
    tests for variant/class merging. Integration tests for responsive behavior.
  difficulty: 2
  tags:
  - scenario
- id: '15.7'
  question: What makes the capstone's CSS approach 'RSC-compatible'?
  options:
    b: CSS Modules are build-time — no JavaScript for styles
    a: It uses 'use client' on every component
    c: It avoids CSS entirely
    d: Components are server-only
  answer: b
  explanation: CSS Modules produce static CSS files. No runtime style injection, no
    hooks, no context. Components can be Server or Client components freely.
  difficulty: 2
  tags:
  - concept
- id: '15.8'
  question: If you needed Vue AND React support for the library, which approach becomes
    problematic?
  options:
    d: cva (class-variance-authority)
    a: CSS Modules
    b: CSS custom properties
    c: Container queries
  answer: d
  explanation: cva is a JavaScript library — only available in JS/TS projects. CSS
    Modules and custom properties work universally. Container queries are CSS-native.
  difficulty: 3
  tags:
  - scenario

