  statement: LayerNorm 同 BatchNorm 嘅主要分別係 LayerNorm 沿 feature dimension normalize，BatchNorm 沿 batch dimension normalize。
  answer: true
  explanation: LayerNorm 係對每個 sample 獨立 normalize（沿 feature dimension），BatchNorm 係對整個 batch 嘅同一 feature normalize（沿 batch dimension）。
