  question: Scaling law 嘅 diminishing returns 指乜嘢？
  options:
    a: 模型越大，loss 下降越快
    b: 每倍 compute 帶嚟嘅 loss 下降越來越少
    c: 模型越大，loss 上升
    d: Compute 增加冇效果
  answer: b
  explanation: Diminishing returns = 每倍 compute 帶嚟嘅 loss 下降固定比例，但比例越來越細，每倍帶來嘅絕對提升越来越少。
  difficulty: 2
  tags:
