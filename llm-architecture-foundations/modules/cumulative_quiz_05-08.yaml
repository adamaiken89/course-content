  question: Temperature < 1 嘅效果？
  options:
    a: 輸出更隨機
    b: 輸出更 deterministic
    c: 唔影響
    d: 減少 token 數量
  answer: b
  explanation: T < 1 → softmax 嘅 value 更「尖」→ 高 probability 嘅 token 更突出 → 輸出更 deterministic。
