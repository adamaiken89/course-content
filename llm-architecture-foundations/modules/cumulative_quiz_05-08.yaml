  question: Pre-norm 嘅訓練穩定性點解比 post-norm 好？
  options:
    a: Pre-norm 有更多參數
    b: 梯度可以直接 pass through residual connection，穿過 LayerNorm 嘅路徑更短
    c: Post-norm 計算更慢
    d: Pre-norm 唔需要 LayerNorm
  answer: b
  explanation: Pre-norm 先做 LayerNorm，梯度可以直接 pass through residual connection，穿過 LayerNorm 嘅路徑更短，訓練更穩定。
  difficulty: 2
  tags:
  - recall
