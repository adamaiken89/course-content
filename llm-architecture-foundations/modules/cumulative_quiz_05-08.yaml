  question: Length extrapolation 指乜嘢？
  options:
    a: 模型可以處理更長嘅輸入
    b: 模型喺 training 時冇見過嘅長度上都能正常運作
    c: 模型嘅 parameter 數量增加
    d: 模型嘅 vocab size 增加
  answer: b
  explanation: Length extrapolation 指模型喺 training 時冇見過嘅序列長度上都能正常運作，唔會因為 position 超出 training 範圍而崩潰。
