  question: Autoregressive generation 嘅基本 loop？
  options:
    a: 一次過生成所有 token
    b: 輸入 prompt → 計算 next token → 加入序列 → 重複
    c: 隨機生成 token
    d: 用 RNN 生成
  answer: b
  explanation: Autoregressive 係逐個 token 生成：輸入 prompt → 計算 next token → 加入序列 → 重複直到 EOS。
