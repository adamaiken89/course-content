  question: Residual stream 嘅比喻？
  options:
    a: 流水線
    b: 每層只係喺主幹道旁邊「加車道」，唔攔截車流
    c: 電腦記憶體
    d: 硬碟儲存
  answer: b
  explanation: Residual stream 比喻成高速公路主幹道 — 每層只喺旁邊加車道（修改信號），唔攔截車流。呢個係深層 network 可訓練嘅關鍵。
  difficulty: 2
  tags:
  - recall
