  question: Prompt 敏感度嘅概率解釋？
  options:
    a: 模型有 bug
    b: Wording 改變 probability distribution shift，導致完全唔同嘅 output
    c: 模型太細
    d: 訓練資料唔夠
  answer: b
  explanation: 每個 token 都影響下一個 token 嘅概率分佈。Wording 改變 = probability distribution shift → 模型可能「揀」到完全唔同嘅 continuation。
