  question: 殘差流（residual stream）點解係深層 network 可訓練嘅關鍵？
  options:
    a: 增加模型嘅參數
    b: 梯度可以直接 pass through，唔使穿過每一層嘅 non-linear transformation
    c: 減少計算量
    d: 增加模型嘅 accuracy
  answer: b
  explanation: Residual connection 確保梯度可以直接 pass through，唔使穿過每一層嘅 non-linear transformation，解決深層 network 嘅梯度消失問題。
