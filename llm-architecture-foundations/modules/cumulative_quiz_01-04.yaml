  question: N-gram model 嘅主要問題？
  options:
    a: 計算太慢
    b: sparsity — n 越大，大部分 n-gram 喺 training data 冇出現過
    c: 唔能處理英文
    d: 需要 GPU
  answer: b
  explanation: N-gram model 嘅最大問題係 sparsity — n 越大，大部分組合喺 training data 冇出現過，probability 估唔到。
  difficulty: 2
  tags:
  - recall
- id: cum.2
  type: cloze
  source_modules:
  - 2
  question: BPE 一開始將文字拆成最細單位（字符），然後反覆合併最高頻嘅 pair，直到達到設定嘅 {vocab size}。
  answer: vocab size
  difficulty: 2
  tags:
  - recall
- id: cum.3
  type: mcq
  source_modules:
  - 3
  question: Cosine similarity 嘅值範圍？
  options:
    a: 0 到 1
    b: -1 到 1
    c: 0 到 ∞
    d: -∞ 到 ∞
  answer: b
  explanation: Cosine similarity = cos(θ)，範圍 -1（完全相反）到 1（完全相同）。
  difficulty: 1
  tags:
  - recall
- id: cum.4
  type: tf
  source_modules:
  - 4
  statement: Scaled dot-product attention 入面嘅 scaling factor √d_k 係為咗避免 softmax saturation。
  answer: true
  explanation: Q·K^T 嘅值隨 d_k 增大，未經 scaling 直接入 softmax 會導致梯度消失（saturation）。√d_k 將值壓返合理範圍。
  difficulty: 2
  tags:
  - recall
- id: cum.5
  type: mcq
  source_modules:
  - 5
  question: Residual connection 嘅核心作用？
  options:
    a: 減少參數
    b: 減少計算量
    c: 讓梯度可以直接 pass through，解決深層 network 嘅梯度消失問題
    d: 增加 non-linearity
  answer: c
  explanation: Residual connection 確保梯度可以從 output 直接 pass 到 input，唔會喺深層 network 入面消失。
  difficulty: 2
  tags:
  - recall
- id: cum.6
  type: cloze
  source_modules:
  - 6
  question: Sinusoidal positional encoding 用不同頻率嘅 {sin} 同 {cos} 函數為每個位置生成唯一嘅向量。
  answer: sin, cos
  difficulty: 2
  tags:
  - recall
- id: cum.7
  type: mcq
  source_modules:
  - 7
  question: KV cache 嘅核心價值？
  options:
    a: 減少模型大小
    b: 避免重複計算已生成 token 嘅 K/V，推理速度提升
    c: 減少 training 時間
    d: 增加 accuracy
  answer: b
  explanation: KV cache 將之前 token 嘅 K/V 存起，每次只需計算新 token，避免重複計算。
  difficulty: 2
  tags:
  - recall
- id: cum.8
  type: mcq
  source_modules:
  - 1
  question: Transformer 點解取代咗 RNN？
  options:
    a: Transformer 更細
    b: Transformer 可以 parallel 處理所有 token，RNN 必須 sequential
    c: Transformer 唔需要 GPU
    d: RNN 更準確
  answer: b
  explanation: Transformer 嘅 self-attention 可以同時處理整個序列，RNN 必須逐個 token 處理，parallel 效率差好遠。
  difficulty: 2
  tags:
  - recall
- id: cum.9
  type: tf
  source_modules:
  - 2
  statement: BPE 係 deterministic 嘅 tokenization 方法 — 同一個 input 永遠 produce 相同 output。
  answer: true
  explanation: BPE 有固定嘅 merge rules，同一個 input 永遠 tokenize 成相同 output。
  difficulty: 2
  tags:
  - recall
- id: cum.10
  type: mcq
  source_modules:
  - 3
  question: Static embedding（如 Word2Vec）嘅主要限制？
  options:
    a: 計算太慢
    b: 同一個字永遠有相同向量，忽略 context
    c: 唔能處理多語言
    d: 只能處理英文
  answer: b
  explanation: Static embedding 每個 token 有固定向量，唔理喺咩 context 下，向量都一樣。Contextual embedding（如 BERT）解決呢個問題。
  difficulty: 2
  tags:
  - recall
- id: cum.11
  type: cloze
  source_modules:
  - 4
  question: Multi-head attention 允許模型同時喺多個 {attention head} 入面學習唔同類型嘅 relationship。
  answer: attention head
  difficulty: 2
  tags:
  - recall
- id: cum.12
  type: mcq
  source_modules:
  - 5
  question: Pre-norm vs post-norm 嘅主要分別？
  options:
    a: Pre-norm 更快
    b: Pre-norm 先做 LayerNorm 再做 Attention/FFN，訓練更穩定
    c: Post-norm 更準確
    d: 冇分別
  answer: b
  explanation: Pre-norm 先做 LayerNorm，梯度可以直接 pass through residual connection，訓練更穩定。Post-norm 先做 Attention/FFN，梯度要穿過 LayerNorm。
  difficulty: 2
  tags:
  - recall
- id: cum.13
  type: mcq
  source_modules:
  - 6
  question: RoPE（Rotary Position Embedding）嘅核心特點？
  options:
    a: 用 learnable 嘅 position embedding
    b: 用旋轉矩陣將位置資訊編碼到 Q/K 入面
    c: 用 binary code 表示位置
    d: 用 hash function 表示位置
  answer: b
  explanation: RoPE 用旋轉矩陣將位置資訊直接編碼到 Q/K 向量入面，天然支持 relative position。
  difficulty: 2
  tags:
  - recall
- id: cum.14
  type: mcq
  source_modules:
  - 7
  question: Greedy decoding 嘅問題？
  options:
    a: 太慢
    b: 每步揀最高 probability 嘅 token，唔考慮全局最優
    c: 只能處理英文
    d: 需要 external memory
  answer: b
  explanation: Greedy decoding 每步揀最高 probability 嘅 token，但全局最優 sequence 可能需要某一步揀低 probability 嘅 token。
  difficulty: 2
  tags:
  - recall
