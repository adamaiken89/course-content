  question: FFN 喺 Transformer block 入面嘅作用？
  options:
    a: 計算 attention
    b: 做 non-linear transformation，提供模型嘅「記憶力」
    c: 計算 positional encoding
    d: 做 residual connection
  answer: b
  explanation: FFN 用 non-linear activation 將 hidden state 投影到更高維空間再投返嚟，提供模型嘅「記憶力」（存知識）。
  difficulty: 2
  tags:
  - recall
- id: cum.19
  type: cloze
  source_modules:
  - 7
  question: Temperature 嘅作用：T < 1 令分佈更 {sharp}，T > 1 令分佈更 {uniform}。
  answer: sharp, uniform
  difficulty: 2
  tags:
  - recall
- id: cum.20
  type: mcq
  source_modules:
  - 4
  question: Causal mask 嘅作用？
  options:
    a: 防止 attention 計算太慢
    b: 防止 token 睇到未來嘅 token
    c: 增加 model 嘅 accuracy
    d: 減少 model 嘅參數
  answer: b
  explanation: Causal mask 令每個 token 只可以 attend 到自己同之前嘅 token，確保生成過程唔會「偷睇」未來。
  difficulty: 2
  tags:
  - recall
- id: cum.21
  type: mcq
  source_modules:
  - 6
  question: ALiBi 嘅核心做法？
  options:
    a: 加 learnable 嘅 position embedding
    b: 直接喺 attention score 加距離-dependent bias
    c: 用 sinusoidal function 編碼位置
    d: 用旋轉矩陣編碼位置
  answer: b
  explanation: ALiBi 直接喺 attention score 加線性 bias，距離越遠 bias 越負，冇額外 position embedding 參數。
  difficulty: 2
  tags:
  - recall
- id: cum.22
  type: tf
  source_modules:
  - 8
  statement: Hallucination 係 engineering bug，可以透過改進 training fix。
  answer: false
  explanation: Hallucination 係 architectural limitation — LLM 本質上係 probability estimator，預測常見嘅下一個字，唔係預測事實。呢個限制唔係 engineering 問題。
  difficulty: 3
  tags:
  - recall
- id: cum.23
  type: mcq
  source_modules:
  - 2
  question: Vocabulary size 太大嘅問題？
  options:
    a: Tokenization 更快
    b: Embedding layer 參數暴增，模型更大
    c: 唔能處理生字
    d: 只能處理英文
  answer: b
  explanation: Vocab size 太大 → Embedding matrix（V × d）暴增 → 模型更大，同時 softmax output layer 參數都增加。
  difficulty: 2
  tags:
  - recall
- id: cum.24
  type: mcq
  source_modules:
  - 3
  question: Dot product 模擬乜嘢？
  options:
    a: 向量長度
    b: 兩個向量嘅相關度（一個向量對另一個嘅「投影」）
    c: 向量嘅維度
    d: 向量嘅方向
  answer: b
  explanation: Dot product 模擬相關度：A·B 大 = 方向相似（相關），A·B 細 = 方向唔相關。
  difficulty: 2
  tags:
  - recall
- id: cum.25
  type: mcq
  source_modules:
  - 5
  question: LayerNorm 嘅作用？
  options:
    a: 減少參數
    b: 正規化 hidden state，令訓練更穩定
    c: 增加 non-linearity
    d: 減少計算量
  answer: b
  explanation: LayerNorm 將 hidden state 歸一化到穩定嘅分佈，令訓練更穩定，防止梯度爆炸或消失。
  difficulty: 2
  tags:
  - recall
- id: cum.26
  type: cloze
  source_modules:
  - 4
  question: Self-attention 嘅公式：Attention(Q,K,V) = softmax({Q·K^T / √d_k}) · V
  answer: Q·K^T / √d_k
  difficulty: 2
  tags:
  - recall
- id: cum.27
  type: mcq
  source_modules:
  - 8
  question: In-context learning 點解可以冇 fine-tune？
  options:
    a: 因為模型已經學過所有 pattern
    b: 因為 attention 天然可以做 pattern matching
    c: 因為有 external memory
    d: 因為 example 有 gradient
  answer: b
  explanation: Attention mechanism 天然可以做 pattern matching，幾 个 example 就足夠「激活」訓練時學到嘅相關 pattern。
  difficulty: 2
  tags:
  - recall
- id: cum.28
  type: mcq
  source_modules:
  - 7
  question: Top-p (nucleus) sampling 嘅做法？
  options:
    a: 揀 top N 個 token
    b: 揀 probability 最高嘅 token，直到 cumulative probability 達到 p
    c: 揀所有 token
    d: 揀隨機 token
  answer: b
  explanation: Top-p 排序 probability，由高到低累加，到達 p 閾值就停，從呢個 subset 入面抽樣。
  difficulty: 2
  tags:
  - recall
- id: cum.29
  type: mcq
  source_modules:
  - 1
  question: Transfer learning 嘅核心概念？
  options:
    a: 用更大嘅 model
    b: 喺 source task 學到嘅 knowledge 應用到 target task
    c: 減少 training 時間
    d: 增加 model 嘅參數
  answer: b
  explanation: Transfer learning 嘅核心係利用喺 source task 學到嘅通用 knowledge，transfer 到相關嘅 target task。
  difficulty: 2
  tags:
  - recall
- id: cum.30
  type: mcq
  source_modules:
  - 6
  question: 為乜嘢需要 positional encoding？
  options:
    a: Attention 機制本身冇順序概念
    b: 增加模型嘅 accuracy
    c: 減少模型嘅參數
    d: 增加模型嘅深度
  answer: a
  explanation: Attention 嘅 dot product 同 sum 係 commutative，唔理 token 排列順序都計到相同結果。Position injection 解決呢個問題。
  difficulty: 2
  tags:
  - recall
