  question: 以下邊個係 decoder-only model？
  options:
    a: BERT
    b: GPT 系列
    c: T5
    d: BART
  answer: b
  explanation: GPT 系列係 decoder-only，BERT 係 encoder-only，T5/BART 係 encoder-decoder。
