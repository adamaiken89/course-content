  statement: Scaling law 指模型越大，test loss 線性下降。
  answer: false
  explanation: Scaling law 係 power law 關係（diminishing returns），唔係線性。每倍 compute 帶嚟固定比例嘅 loss 下降。
  difficulty: 2
  tags:
  - recall
