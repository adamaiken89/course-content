  statement: Logical CSS properties like margin-inline-start automatically flip in
    RTL; the same CSS handles both directions.
  answer: true
  explanation: Logical properties are direction-agnostic. The browser flips them based
    on the writing direction. The CSS writes once; the layout mirrors itself in RTL.
    Pair with [dir=rtl] attribute selectors for directional icons.
  difficulty: 1
  tags:
  - cross-module
  - css
  - rtl
