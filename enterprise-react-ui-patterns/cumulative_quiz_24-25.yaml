  question: A type-safe {translation} contract with build-time key coverage checks
    prevents {gaps} when shipping a new language; the schema (m4) is the source of
    truth for {form} fields, the i18n keys, and the {types}.
  answer: translation; gaps; form; types
  explanation: m4's zod schema is the source of truth for form fields. The i18n keys
    are derived from the schema (or aligned with it). Build-time key coverage checks
    fail CI when a language is missing keys.
