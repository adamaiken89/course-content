  question: The error boundary (m18) catches render-phase exceptions; Sentry (m25)
    reports them with a {component} stack, {breadcrumbs}, and the user's {session}.
  answer: component; breadcrumbs; session
  explanation: The boundary is the mechanism. The tracker is the value. Breadcrumbs
    accumulate user actions before the error; the component stack shows where it threw;
    the session identifies the user. Together, one report tells the full story.
  difficulty: 2
  tags:
