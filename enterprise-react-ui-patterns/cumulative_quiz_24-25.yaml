  question: A team tracks every form keystroke with the full form state to a third-party
    analytics tool. A PII audit flags the team. What went wrong?
  options:
    a: Keystroke tracking is fine
    b: The form state contains PII; the team should redact at the transport layer
      and track at meaningful events, not every keystroke
    c: The tool is at fault
    d: PII is not a real concern
  answer: b
  explanation: Form state contains names, emails, addresses. Sending it to a third-party
    tool is a PII leak. Redact at the transport layer; track at meaningful events
    (form-open, form-submit); minimize what is sent.
  difficulty: 2
  tags:
  - cross-module
  - pii
  - telemetry
