  question: PII redaction happens at the {transport} layer; the {translation} keys
    never contain PII but the form {state} may; the {analytics} call is gated on user
    consent.
  answer: transport; translation; state; analytics
  explanation: Redaction at the transport layer means every event goes through the
    same redaction function. Translation keys are not PII. Form state may contain
    PII. The analytics call is gated on consent.
