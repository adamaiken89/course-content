  question: A form has a hard-coded count === 1 ternary. The team ships Spanish. What
    is the consequence?
  options:
    a: Nothing
    b: The form crashes
    c: Spanish has its own plural rules; the hard-coded English rule produces wrong
      strings in Spanish (and Russian, Arabic, etc.)
    d: Spanish is not supported
  answer: c
  explanation: 'Spanish has two plural forms, Russian has three. The English rule
    (1 = singular, else plural) is just one of many. The fix: ICU MessageFormat encodes
    per-locale plural rules; the English string is one of many translations.'
  difficulty: 2
  tags:
  - cross-module
  - i18n
  - misconception
