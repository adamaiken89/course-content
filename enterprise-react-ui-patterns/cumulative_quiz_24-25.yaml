  question: An error boundary in m18 captures a render-phase exception. m25 wires
    it to Sentry. What is the value-add over console.error?
  options:
    a: Component stack, breadcrumbs, the user's session, the route, and aggregation
      across users
    b: Sentry is faster
    c: Sentry has a nicer UI
    d: Nothing
  answer: a
  explanation: Sentry aggregates across users, surfaces regressions, and reports the
    context (component stack, breadcrumbs, session) that console.error does not capture.
    The boundary is the hook; the tracker is the value.
  difficulty: 1
  tags:
  - cross-module
  - error-tracking
  - synthesis
