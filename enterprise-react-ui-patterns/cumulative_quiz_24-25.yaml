  question: A form uses useActionState. The action fails. The team wants to know the
    failure rate. What is missing from the implementation?
  options:
    a: useActionState tracks failures automatically
    b: A retry button
    c: A different form library
    d: A success-path and failure-path event in the analytics; useActionState does
      not emit telemetry
  answer: d
  explanation: 'useActionState does not emit telemetry. The team must add tracking
    at meaningful events: form-submit-attempt, form-submit-success, form-submit-failure.
    Gated on consent. Without it, the dashboard cannot see the failure rate.'
  difficulty: 3
  tags:
  - cross-module
  - synthesis
  - telemetry
