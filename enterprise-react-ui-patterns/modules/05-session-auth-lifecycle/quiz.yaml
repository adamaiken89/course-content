- id: "5.1"
  question: "Why does a boolean session flag (hasToken or not) fail to model a real session?"
  options:
    a: "Booleans are forbidden in TypeScript strict mode"
    b: "It collapses recoverable states like 'expired but refreshable' into logged-in or logged-out"
    c: "It reloads the page on every state change"
    d: "It makes the login button unreadable"
  answer: b
  explanation: "A boolean hides the lifecycle. 'Token exists but expired' and 'refreshing, hold on' are observable states a boolean cannot represent, so the app cannot recover from them."
  difficulty: 1
  tags: [terminology, concept]
- id: "5.2"
  question: "A queued request gets a 401, the refresh endpoint succeeds. Which state transition occurs?"
  options:
    a: "authenticated to anonymous"
    b: "authenticated to expired"
    c: "refreshing to authenticated"
    d: "anonymous to authenticating"
  answer: c
  explanation: "A 401 on the expired token triggers refreshing; a successful refresh returns to authenticated and the queued requests replay with the fresh token."
  difficulty: 1
  tags: [terminology, formula]
- id: "5.3"
  question: "In this client-only course, where does the session token live?"
  options:
    a: "In-memory, inside the zustand session store"
    b: "In localStorage so reloads stay logged in"
    c: "In an httpOnly cookie set by the real server"
    d: "In the URL query string"
  answer: a
  explanation: "Client-only means there is no server to set an httpOnly cookie, so we use an in-memory token in the store: XSS cannot scrape it, and reload returns to anonymous, which is the real lifecycle anyway."
  difficulty: 1
  tags: [comparison, scenario]
- id: "5.4"
  question: "Why avoid storing the session token in localStorage in production?"
  options:
    a: "localStorage is cleared on every navigation"
    b: "localStorage writes are slow and block the main thread"
    c: "Reload-persistence is not worth the risk"
    d: "Any injected script can read it and exfiltrate a live session"
  answer: d
  explanation: "localStorage is readable by any script running on the page. A single XSS hole turns into permanent session compromise. Enterprise prefers an httpOnly cookie, which JS never sees."
  difficulty: 2
  tags: [security, scenario]
- id: "5.5"
  question: "Three parallel requests hit an expired token and all 401. How many refresh requests should the queue fire?"
  options:
    a: "Three, one per failed request"
    b: "One for each, retried until success"
    c: "Exactly one, shared via a single-flight promise; the rest await it"
    d: "Zero - redirect straight to login"
  answer: c
  explanation: "Single-flight refresh: the first requester starts the refresh and stores the promise; the rest await the same promise and replay with the fresh token. No thundering herd, no lost requests."
  difficulty: 2
  tags: [concept, application]
- id: "5.6"
  question: "A RouteGuard renders protected screens. When the session is anonymous, what does it do?"
  options:
    a: "Render the screen anyway and let each API call fail"
    b: "Redirect to /login while remembering the intended destination via returnTo"
    c: "Clear the draft store"
    d: "Show a reconnect banner forever"
  answer: b
  explanation: "The guard is a single choke-point seam: anonymous redirects to login and records returnTo so the student returns to where they were, draft intact. The screens never know about the lifecycle."
  difficulty: 2
  tags: [scenario, application]
- id: "5.7"
  question: "Liam's 30-minute draft must survive logout and re-login. How does the draft store make that true?"
  options:
    a: "The token and the draft share one localStorage key"
    b: "The draft is copied into the mock server on every keystroke"
    c: "The draft outlives the session via zustand persist syncing to localStorage"
    d: "Saving is blocked until login completes"
  answer: c
  explanation: "The draft is persisted state that belongs to the student, not the token. Logout destroys the session, never the draft; re-login restores it from the persisted store."
  difficulty: 2
  tags: [scenario, application]
- id: "5.8"
  question: "How does a test prove that concurrent 401s trigger exactly one refresh?"
  options:
    a: "Assert the MSW request log contains exactly one POST to /api/auth/refresh"
    b: "Set localStorage to empty and check the guard"
    c: "Count the number of login renders in RTL"
    d: "Assert the state machine never enters refreshing"
  answer: a
  explanation: "MSW (m3) can log every request. Firing two parallel fetchDraft calls against an expired token should produce one refresh hit and two successful replays - the deterministic proof of single-flight."
  difficulty: 3
  tags: [process, application]
- id: "5.9"
  question: "The refresh endpoint fails while a queued batch call waits. What should the app do?"
  options:
    a: "Retry the batch call silently forever"
    b: "Ignore the failure and pretend the token is valid"
    c: "Return to anonymous with a reason, so 'session expired' UI shows and the student re-logs in with the draft intact"
    d: "Store the failed refresh in the URL"
  answer: c
  explanation: "Refresh failure ends the session. Transition refreshing -> anonymous with an explicit reason; the UI explains, the draft store protects the work, and re-login replays from a known state."
  difficulty: 2
  tags: [scenario, concept]
- id: "5.10"
  question: "Why wrap the login submit in React 19's useTransition?"
  options:
    a: "To authenticate without the server"
    b: "To keep the form responsive while the auth request runs, driving isPending into the authenticating UI"
    c: "To cache login responses in the Query cache"
    d: "To automatically rotate the refresh token"
  answer: b
  explanation: "useTransition marks the login update non-blocking: the button stays interactive and isPending drives the authenticating state. Depth on transitions and useOptimistic comes in m14."
  difficulty: 3
  tags: [terminology, application]