- id: '1.1'
  question: What is the first question to ask before structuring an enterprise screen?
  options:
    a: "Who owns what \u2014 data, layout, display, behavior"
    b: How many lines the file should stay under
    c: Which CSS framework to use
    d: Which folder should hold the component
  answer: a
  explanation: Ownership is the organizing principle. Files, line counts, and styling
    are downstream concerns.
  difficulty: 1
  tags:
  - concept
  - scenario
- id: '1.2'
  question: Which symptom indicates a god component?
  options:
    a: The component uses the router
    b: One keystroke re-renders unrelated sections of the form
    c: The component imports a global store for a single field
    d: The file is written in TypeScript
  answer: b
  explanation: 'Cross-feature re-render blast radius is the classic god component
    symptom: unrelated state changes share one render path.'
  difficulty: 2
  tags:
  - scenario
  - concept
- id: '1.3'
  question: Which owns state, data fetching, and event handlers?
  options:
    a: The page shell
    b: Smart containers
    c: The layout style object
    d: Presentational children
  answer: b
  explanation: Smart containers own logic and data; presentational children only render
    props.
  difficulty: 1
  tags:
  - terminology
  - concept
- id: '1.4'
  question: A team splits a god component into 25 tiny files without ownership rules.
    What happens?
  options:
    a: Architecture becomes perfect because components are small
    b: Tests no longer need to mount anything
    c: The component soup moves into a component forest
    d: Re-renders are eliminated automatically
  answer: c
  explanation: "Small files without ownership rules just scatter the same five concerns\
    \ \u2014 the soup changes shape, not substance."
  difficulty: 2
  tags:
  - misconception
  - concept
- id: '1.5'
  question: What does the slot pattern let the page shell avoid knowing?
  options:
    a: The internals of the sections it seats
    b: The version of React installed
    c: The routing table
    d: The number of CSS media queries
  answer: a
  explanation: Slots inject sections as JSX; the shell only places them, so it never
    learns their internals or data sources.
  difficulty: 1
  tags:
  - terminology
  - concept
- id: '1.6'
  question: When is the slot pattern overkill?
  options:
    a: When sections are stable and never change independently
    b: When the page has more than three sections
    c: When the app uses a global state store
    d: When the team prefers context
  answer: a
  explanation: Slots pay off when regions differ and swap independently. A stable,
    fixed form rarely needs injection points.
  difficulty: 2
  tags:
  - comparison
  - scenario
- id: '1.7'
  question: What changed about refs in React 19 for function components?
  options:
    a: refs now require forwardRef always
    b: refs were removed entirely
    c: ref is passed as a normal prop to function components
    d: refs only work in class components
  answer: c
  explanation: React 19 lets function components receive ref directly in props; forwardRef
    is no longer required.
  difficulty: 2
  tags:
  - terminology
  - react-19
- id: '1.8'
  question: A company adds the React Compiler. Why do component boundaries still matter?
  options:
    a: Boundaries now express ownership and testability, not just rendering
    b: The compiler only works on presentational components
    c: Boundaries mattered only before the compiler existed
    d: The compiler removes the need for any component structure
  answer: a
  explanation: The compiler automates memoization, so the value of boundaries shifts
    from render speed to ownership separation.
  difficulty: 2
  tags:
  - comparison
  - concept
- id: '1.9'
  question: The aside panel is replaced with a new urgency block. What is the expected
    blast radius under slot composition?
  options:
    a: The data store schema
    b: The page shell call site, one line, and possibly its test
    c: The coupling inside the removed panel's implementation
    d: Every shared layout component in the app
  answer: b
  explanation: Slot composition means only the call site swaps one JSX element; the
    old section's implementation is simply unmounted.
  difficulty: 3
  tags:
  - scenario
  - application
- id: '1.10'
  question: A validation panel needs the draft's field errors. Which placement matches
    ownership rules?
  options:
    a: The page shell holds errors to pass them everywhere
    b: The form container owns draft state and passes errors as props
    c: The panel fetches errors from its own local store
    d: Each input fetches its own errors on blur
  answer: b
  explanation: The container owns form state including validation; presentational
    panels render props rather than fetch.
  difficulty: 3
  tags:
  - scenario
  - application
- id: '1.11'
  question: When refactoring the 800-line ApplicationForm into containers, what is
    the single question that decides the container boundary?
  options:
    a: Which UI library provides the cleanest slot API
    b: How many files should the refactor produce
    c: How many lines does the resulting component have
    d: "Who owns the data and the lifecycle \u2014 does the boundary match an ownership\
      \ line in the team?"
  answer: d
  explanation: "Container boundaries follow data ownership, not file size. The question\
    \ is who needs the state to be alive and rendered together \u2014 that owner becomes\
    \ the container. File count and library choice follow from ownership, not the\
    \ reverse."
  difficulty: 2
  tags:
  - concept
  - comparison
