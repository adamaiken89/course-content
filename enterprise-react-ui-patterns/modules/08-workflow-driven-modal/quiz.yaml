- id: '8.1'
  question: What is the core idea of open-config-as-state for a dialog that serves
    multiple intents?
  options:
    a: Store every intent configuration in a global constant
    b: Dialog state is one object { intent, entityId, payload }
    c: One prop per intent, rendered with if branches
    d: Reuse the same component but hide unrelated fields
  answer: b
  explanation: "The dialog state is the open config \u2014 which intent, which entity,\
    \ which payload. The intent keys a config map that supplies all behavior. Booleans\
    \ (b) are the naive anti-pattern, (c) hides fields instead of modeling intent,\
    \ (d) is about where the config lives, not what state means."
  difficulty: 1
  tags:
  - terminology
  - concept
- id: '8.2'
  question: Why does workflow-modal state move to a zustand store instead of staying
    in module 7 style local useState?
  options:
    a: Local state cannot render a dialog at all
    b: The config map only works inside a store
    c: Zustand is required for all modal dialogs
    d: Multiple triggers across screens (batch bar, table row, batch summary) all
      open the same dialog
  answer: d
  explanation: "Module 7's local state works when one component owns the trigger.\
    \ Here triggers are spread across screens and must all open the same dialog instance\
    \ \u2014 the cross-screen access is what earns a zustand store. (a) overgeneralizes;\
    \ (c) is false; (d) confuses config map with state."
  difficulty: 1
  tags:
  - concept
  - comparison
- id: '8.3'
  question: In the workflowConfig map, what does each intent entry supply?
  options:
    a: The ARIA roles and focus-trap settings
    b: Only the dialog title
    c: A list of boolean flags for the dialog body
    d: Title, fields, validation, confirm label, and submit action
  answer: d
  explanation: 'The config map packs the full behavior: title, fields, validation,
    confirmLabel, submitAction. ARIA and focus (d) belong to DialogShell from module
    7. Booleans (b) are the anti-pattern this map replaces.'
  difficulty: 1
  tags:
  - terminology
- id: '8.4'
  question: A codebase has <Modal isAdd={true} isEdit={true}> and it renders the add
    form. Which statement best describes what is wrong?
  options:
    a: The boolean combination is a dead state that the render logic resolves arbitrarily
    b: "Nothing \u2014 the booleans happened to work"
    c: React will throw a rendering error
    d: The component is too slow to render two forms
  answer: a
  explanation: Intents are configurations, not presence flags. Invalid combinations
    like isAdd AND isEdit are dead states with no defined meaning; the render logic
    just picks one branch arbitrarily. The design offered no way to even express the
    error.
  difficulty: 2
  tags:
  - scenario
- id: '8.5'
  question: The batch summary ('submit 5 applications') opens a different flow than
    add/edit. What does this tell you?
  options:
    a: It proves the state machine is unnecessary
    b: "It is a different intent with distinct confirm text and more steps \u2014\
      \ the workflowConfig map handles it"
    c: It needs its own separate modal component from scratch
    d: It should reuse the add intent with a count prop
  answer: b
  explanation: "Distinct title, confirm label, and step count make it a distinct intent\
    \ entry in the config map, with the state machine providing multi-step behavior.\
    \ (b) abandons reuse; (c) corrupts the add intent; (d) is backwards \u2014 the\
    \ multi-step flow is why the state machine exists."
  difficulty: 2
  tags:
  - scenario
- id: '8.6'
  question: "In the state machine editing \u2192 confirming \u2192 submitting \u2192\
    \ done, what directly triggers the transition editing \u2192 confirming?"
  options:
    a: The user pressing the submit button on the confirming step
    b: A valid form submit
    c: A close attempt while the payload is dirty
    d: The server responding with an error
  answer: c
  explanation: "A dirty close attempts to leave the dialog with unsaved changes; the\
    \ guard routes to the confirming (discard?) step instead of closing. Valid submit\
    \ goes editing \u2192 submitting; server error goes submitting \u2192 editing,\
    \ never editing \u2192 confirming."
  difficulty: 1
  tags:
  - terminology
- id: '8.7'
  question: A dialog opens on 'Edit grades' with saved values prefilled. The user
    changes nothing and clicks close. The dirty guard should...
  options:
    a: Close immediately because nothing changed since open
    b: Always block closing until the user confirms
    c: Show the discard-confirm step because the dialog once had payload
    d: Submit the unchanged form first
  answer: a
  explanation: Dirty means changed relative to the snapshot taken at open. A prefill
    that was never edited is not dirty, so the guard must compare current draft to
    open-time payload (or use a touched flag), never against null. (a) is exactly
    the bug in the Spot-the-Mistake example.
  difficulty: 2
  tags:
  - scenario
- id: '8.8'
  question: In the RTL test for opening the dialog from a table row, which assertion
    best proves the right intent config rendered?
  options:
    a: Assert the heading AND the intent-specific confirm label and fields
    b: expect(screen.getByText('Edit grades')).toBeInTheDocument()
    c: Assert that focus is inside the dialog
    d: Snapshot the whole dialog including the state machine step
  answer: a
  explanation: "A bare getByText can match a page header that exists before the dialog\
    \ opens \u2014 a false positive. Asserting the heading plus the intent-specific\
    \ confirm label and fields distinguishes add from edit. Focus (b) tests DialogShell,\
    \ and structural snapshots (c) pin structure, not behavior."
  difficulty: 2
  tags:
  - scenario
- id: '8.9'
  question: The submit test routes through server.use(contract.updateGrades) from
    MSW. What is being pinned?
  options:
    a: The focus-trapping behavior of DialogShell
    b: The number of times the dialog re-renders
    c: The exact POST contract the app sends to the server
    d: The visual styling of the success state
  answer: c
  explanation: "An MSW handler stands in for the real endpoint and pins the request\
    \ contract \u2014 method, URL, body shape. That is the module 3 'MSW contract'\
    \ idea. Styling and focus belong to other tests; re-render counts are a performance\
    \ concern."
  difficulty: 3
  tags:
  - scenario
- id: '8.10'
  question: The nested-workflow variant needs 'Add application' to chain a prerequisite
    dialog. The cleanest approach is...
  options:
    a: Increase the config map to break the add intent into ten smaller intents
    b: Store a stack of open intents with a parent reference and render a second layer
      above the current dialog
    c: Render a raw second modal inside the first with duplicated shell code
    d: Block the second dialog entirely and show a toast
  answer: b
  explanation: "Nesting means a second open with a new intent and a parent reference,\
    \ layered above the current dialog \u2014 same shell, same config map, one extra\
    \ stack in the store. (a) explodes the config space; (c) duplicates DialogShell;\
    \ (d) avoids the actual need."
  difficulty: 3
  tags:
  - scenario
- id: '8.11'
  question: 'A modal must be unsaveable if the form is dirty. The state machine transitions:
    idle -> editing -> submitting -> done. When is the right moment to evaluate ''is
    dirty''?'
  options:
    a: Only when the API call starts
    b: On every keystroke, synchronously
    c: On every transition INTO the editing state and on every input event after that,
      with the result memoized
    d: Only when the user clicks close
  answer: c
  explanation: Dirty is a derived fact; computing it on every render is wasteful,
    but only computing it on close misses the case where the user navigates away via
    a different mechanism. The state machine's transition into 'editing' is the natural
    trigger; from there, input events keep the flag fresh.
  difficulty: 3
  tags:
  - process
  - concept
