- id: '20.1'
  question: The micro-assembly loop begins with `stage(await importCsv(file))`. Which
    module's contract does `stage` belong to?
  options:
    a: m17 async races and reconciliation
    b: m13 dependent field chains
    c: m14 batch update engine
    d: m15 CSV import and bulk entry
  answer: d
  explanation: m15 turns hostile CSV rows into validated typed drafts. Staging is
    a separate step from submitting so the reviewer can fix invalid rows before they
    hit the wire.
  difficulty: 1
  tags:
  - terminology
- id: '20.2'
  question: 'Why does the loop use `idempotencyKey: run.key` instead of `idempotencyKey:
    crypto.randomUUID()` per call?'
  options:
    a: The server rejects randomUUID
    b: randomUUID is slower
    c: A stable key lets the server dedupe a retried submit; a fresh key makes every
      retry a duplicate write
    d: run.key is shorter
  answer: c
  explanation: "Idempotency requires the key to be stable across retries. A fresh\
    \ UUID per call defeats the contract \u2014 the server cannot dedupe a write it\
    \ sees as new."
  difficulty: 2
  tags:
  - concept
- id: '20.3'
  question: The loop's resubmit step is `for (const it of failed) await batchStore.resubmit(it,
    run.key)`. What would go wrong if you replaced it with a whole-run resubmit?
  options:
    a: The server would reject it
    b: Already-landed items would re-send to the wire, wasting 197 deduped requests
    c: The run would reset to pending
    d: The key would change
  answer: b
  explanation: Server-side dedupe prevents double-enroll but does not prevent wasted
    network and ledger work. Per-item filter is a system-cost contract, not a correctness
    one.
  difficulty: 2
  tags:
  - scenario
- id: '20.4'
  question: Which module's contract catches a 90-second network drop mid-submit?
  options:
    a: m19 offline queue and persistence
    b: m14 per-item ledger
    c: m13 dependent options
    d: m15 staging
  answer: a
  explanation: m19 persists pending mutations in a queue and flushes on the `online`
    event in dependency order. The other modules are correct but do not handle the
    network drop.
  difficulty: 1
  tags:
  - concept
- id: '20.5'
  question: Two staff tabs edit the same applicant. Tab A submits first. What prevents
    Tab B from also submitting?
  options:
    a: m17 idempotency key
    b: m14 ledger
    c: m13 refetch
    d: m19 BroadcastChannel submit latch
  answer: d
  explanation: m19's submit latch is an ephemeral BroadcastChannel ticket that ensures
    only one tab holds the submit permission. Idempotency dedupes but does not gate
    the action.
  difficulty: 2
  tags:
  - concept
- id: '20.6'
  question: The reviewer reassigns a program mid-batch. What happens to the in-flight
    option fetch?
  options:
    a: It completes and overwrites the new selection
    b: m17 aborts it via the requestId guard
    c: m15 stages a new draft
    d: m14 marks the run as failed
  answer: b
  explanation: m13's `options.abortOn(() => userReassignsProgram(...))` plus m17's
    requestId guard cancels the stale fetch. The result would have been against an
    old key.
  difficulty: 2
  tags:
  - concept
- id: '20.7'
  question: What is the architectural claim of the micro-assembly?
  options:
    a: Composition across modules is the architecture; each module's exit is the next
      module's entrance
    b: Frameworks are better than seams
    c: The capstone replaces prior modules
    d: Every enterprise React app should have a useReviewerImport hook
  answer: a
  explanation: The loop is the proof that the seams compose. The seams are the architecture;
    the loop is what you get when they are well-named.
  difficulty: 3
  tags:
  - concept
- id: '20.8'
  question: If you extracted the loop into a custom hook, what would you lose?
  options:
    a: The m17 key
    b: Type safety
    c: The explicitness of the seam composition, which is the audit trail
    d: React 19 support
  answer: c
  explanation: 'A hook hides the words. The loop''s ten lines are the contract: stage,
    begin, fetch, abort, submit, filter, resubmit. Hidden contracts cannot be audited.'
  difficulty: 3
  tags:
  - concept
- id: '20.9'
  question: A CSV import has 50 valid rows and 5 invalid ones. The reviewer clicks
    'Submit valid only'. What happens to the run.key?
  options:
    a: It becomes null until the reviewer confirms
    b: It concatenates the invalid row ids
    c: It is reused from the previous staging
    d: A new key is minted for the 48-row run
  answer: d
  explanation: The key is per-run, not per-file. Each `batchStore.begin(drafts)` mints
    a fresh key for that specific staged set. Stable within the run, fresh across
    runs.
  difficulty: 3
  tags:
  - concept
- id: '20.10'
  question: Which of these is NOT something the micro-assembly loop is responsible
    for?
  options:
    a: Server-side authorization
    b: Mid-flight option refetch
    c: Idempotent resubmit
    d: Per-item settlement of failures
  answer: a
  explanation: Server-side authorization is upstream of the loop. The loop handles
    client-side composition only. Audit logging and notifications are downstream.
  difficulty: 2
  tags:
  - scenario
- id: '20.11'
  question: The micro-assembly's resubmit step filters to failed items only. A junior
    refactors it to resubmit the whole run with the same idempotency key, claiming
    'the server dedupes.' What is the missing contract?
  options:
    a: 'Per-item filter is a system-cost contract: resubmitting the whole run wastes
      the wire and the ledger on already-landed items, even though no double-enroll
      occurs'
    b: The run would reset to pending
    c: The key would change
    d: The server would reject duplicate keys
  answer: a
  explanation: Server-side dedupe is a correctness contract, not a cost contract.
    Re-sending 197 settled items to the wire is wasteful even if the server filters
    them. The loop's filter step says 'only retry the work that didn't land.' Hiding
    it costs the system its efficiency budget.
  difficulty: 3
  tags:
  - concept
  - process
- id: '20.12'
  question: Which other module's contract does this module's pattern most depend on?
  options:
    a: The test module (m3)
    b: "The module whose boundary this pattern crosses \u2014 composition (m1), state\
      \ (m2), cache (m12), persistence (m19), or batch (m14)"
    c: The schema module (m4)
    d: The cache module (m12)
  answer: b
  explanation: Every module owns one contract and depends on the contracts of the
    modules whose boundaries it crosses. The right answer names the actual boundary.
  difficulty: 2
  tags:
  - synthesis
  - concept
- id: '20.13'
  question: When this module's pattern fails in production, what is the first thing
    to check?
  options:
    a: Check the dashboard
    b: The user's network
    c: "Whether the seam between this module and its dependencies still holds \u2014\
      \ boundary ownership, error envelope, or contract"
    d: Restart the server
  answer: c
  explanation: Failures happen at boundaries. The first check is whether the contract
    between this module and the one it depends on has drifted.
  difficulty: 3
  tags:
  - synthesis
  - process
- id: '20.14'
  question: What is the smallest refactor that would make this module's pattern testable
    in isolation?
  options:
    a: Move all logic to a single hook
    b: Use a different test framework
    c: Add a unit test for every function
    d: Identify the seam that crosses the module boundary, mock it at that seam, and
      write a test that exercises the module's contract end to end
  answer: d
  explanation: Testability comes from seams. The smallest refactor is the one that
    makes the seam explicit. Tests then exercise the contract end to end.
  difficulty: 1
  tags:
  - process
  - synthesis
- id: '20.15'
  question: How does this module compose with the micro-assembly capstone (m20)?
  options:
    a: It does not
    b: "It contributes a seam \u2014 one of stage, begin, fetch, abort, submit, filter,\
      \ or resubmit \u2014 and the loop calls it through that seam"
    c: It replaces the loop
    d: It runs before the loop
  answer: b
  explanation: The micro-assembly is a composition of seams. Each module contributes
    one seam. The loop calls the module through that seam. The test of fit is whether
    the module's contract is honored by the loop.
  difficulty: 2
  tags:
  - synthesis
  - cross-module
- id: '20.16'
  question: What signal tells you this module's pattern is being misapplied in the
    codebase?
  options:
    a: Many tests
    b: Slow performance
    c: Code that should use the pattern is doing it by hand (useState for what should
      be a zustand store, manual fetches for what should be TanStack Query, raw form
      state for what should be useActionState), or code that should not use the pattern
      is using it anyway
    d: Many comments
  answer: c
  explanation: Misapplication shows up as divergence from the contract. Hand-rolled
    versions of what the module should own, or premature adoption where the contract
    does not fit, are the signals.
  difficulty: 1
  tags:
  - misconception
  - synthesis
