- id: '15.1'
  question: Why does `csvText.split('\n').map(l => l.split(','))` fail as a CSV parser?
  options:
    a: CSV is always one field per line
    b: Commas never appear inside values
    c: Quoted commas, `""` escapes, embedded newlines, CRLF, and BOM all break the
      naive splits
    d: The browser forbids string splitting on CSV data
  answer: c
  explanation: A real parser honors quoting and physical-line rules; naive splits
    mis-file rows silently.
  difficulty: 1
  tags:
  - terminology
  - concept
- id: '15.2'
  question: 'A CSV cell that begins with `=`, `+`, `-`, or `@` is a threat called:'
  options:
    a: A cache poisoning attack
    b: A row reordering bug
    c: CSV (formula) injection
    d: An XSS sanitizer bypass
  answer: c
  explanation: Spreadsheets interpret a leading operator as an expression; hostile
    cells payload the export file.
  difficulty: 2
  tags:
  - terminology
  - security
- id: '15.3'
  question: What is the correct handling of a formula-leading cell found in an inbound
    import row?
  options:
    a: Reject it at parse and report it by row number in the error report
    b: Escape `<` to `&lt;` and render it
    c: Render it via dangerouslySetInnerHTML after a replace pass
    d: Prefix with a tick and echo it as a record
  answer: a
  explanation: Inbound data flows into the store and reports; rejection at parse beats
    echoing a half-neutralized value.
  difficulty: 1
  tags:
  - concept
  - security
- id: '15.4'
  question: 300 rows import; one has a malformed grade. What happens to the other
    299?
  options:
    a: The 299 import but are silently un-validated
    b: The 23 with bad dates also abort
    c: The whole import aborts pending the fix
    d: 299 stage as valid; the 1 is categorized with its row number
  answer: d
  explanation: Per-row verdicts mean one bad row never blocks valid ones; errors route
    to the report lane.
  difficulty: 3
  tags:
  - calculation
  - scenario
- id: '15.5'
  question: 'An imported CSV contains a column the schema does not know. The portal
    should:'
  options:
    a: "Warn that the column will not be imported \u2014 a header never read is data\
      \ loss"
    b: Auto-create a free-text zod field
    c: Silently drop it to keep the store clean
    d: Throw a parse error and refuse the file
  answer: a
  explanation: Silent dropping hides data loss; a warning makes the decision visible
    and deliberate.
  difficulty: 2
  tags:
  - concept
  - comparison
- id: '15.6'
  question: What makes the import error report actionable rather than decorative?
  options:
    a: A single aggregate error count
    b: The raw stack trace of the parse
    c: The displayed original file only
    d: Row numbers plus error category and field, downloadable as CSV for fix-and-reimport
  answer: d
  explanation: 'The workflow is closed-loop: locate the row, fix the source, re-import.'
  difficulty: 2
  tags:
  - scenario
  - process
- id: '15.7'
  question: Where do staged valid import rows live?
  options:
    a: In localStorage until submitted
    b: In the zustand draft store, tagged source 'import', merged with manual drafts
    c: In the query cache, invalidation on write
    d: In component useState, dropped on unmount
  answer: b
  explanation: Client-authored drafts must merge with hand-typed ones and feed the
    batch engine (m14).
  difficulty: 1
  tags:
  - concept
  - comparison
- id: '15.8'
  question: Why must imported cells never pass through dangerouslySetInnerHTML?
  options:
    a: It parses markup instead of escaping text, so hostile cells execute
    b: It is slower than string concatenation
    c: It breaks CSV column alignment
    d: It is deprecated in React 19
  answer: a
  explanation: React's default escaping is free and total; innerHTML converts a hostile
    byte into executable DOM.
  difficulty: 1
  tags:
  - concept
  - security
- id: '15.9'
  question: The registrar fixes 3 bad rows and re-imports the same 512-row file. What
    stops duplication?
  options:
    a: A per-draft fingerprint dedupes re-imports against staged drafts; the engine's
      runId+itemId dedupes writes
    b: The server refuses duplicate filenames
    c: The batch engine blocks all imports after size 512
    d: MSW fixture caching
  answer: a
  explanation: "Same file twice is the same intake twice \u2014 stable fingerprints\
    \ and idempotent commit keys prevent it."
  difficulty: 3
  tags:
  - scenario
  - comparison
- id: '15.10'
  question: After staging, what owns the actual submission of the valid rows?
  options:
    a: A for-loop inside the import screen
    b: The CSV parser, resubmitting the file
    c: A fresh useEffect per staged row
    d: "The batch engine (m14) \u2014 its ledger handles partial failure, rollback,\
      \ and idempotent retry"
  answer: d
  explanation: Import is intake; submission is the engine's job. One ledger, no reimplementation.
  difficulty: 2
  tags:
  - comparison
  - scenario
- id: '15.11'
  question: 'A CSV import rejects a row with a validation error. The right place to
    surface the error is:'
  options:
    a: An alert at the top of the page listing all errors
    b: Silently skip the row
    c: A modal that blocks the entire import
    d: A row-level error in the staged preview, with the row still editable inline
  answer: d
  explanation: Inline row-level errors keep the import moving. The user can fix the
    row in place and re-submit without leaving the staging view. Blocking modals break
    flow; silent skips are dishonest; alert lists do not let the user act on the specific
    row.
  difficulty: 2
  tags:
  - scenario
  - process
- id: '15.12'
  question: 'A CSV import rejects a row with a validation error. The right place to
