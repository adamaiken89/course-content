- id: '7.13'
  question: Which other module's contract does this module's pattern most depend on?
  options:
    a: The schema module (m4)
    b: The cache module (m12)
    c: The test module (m3)
    d: "The module whose boundary this pattern crosses \u2014 composition (m1), state\
      \ (m2), cache (m12), persistence (m19), or batch (m14)"
  answer: d
  explanation: Every module owns one contract and depends on the contracts of the
    modules whose boundaries it crosses. The right answer names the actual boundary.
  difficulty: 2
  tags:
  - synthesis
  - concept
- id: '7.14'
  question: When this module's pattern fails in production, what is the first thing
    to check?
  options:
    a: The user's network
    b: "Whether the seam between this module and its dependencies still holds \u2014\
      \ boundary ownership, error envelope, or contract"
    c: Restart the server
    d: Check the dashboard
  answer: b
  explanation: Failures happen at boundaries. The first check is whether the contract
    between this module and the one it depends on has drifted.
  difficulty: 3
  tags:
  - synthesis
  - process
- id: '7.15'
  question: What is the smallest refactor that would make this module's pattern testable
    in isolation?
  options:
    a: Add a unit test for every function
    b: Identify the seam that crosses the module boundary, mock it at that seam, and
      write a test that exercises the module's contract end to end
    c: Move all logic to a single hook
    d: Use a different test framework
  answer: b
  explanation: Testability comes from seams. The smallest refactor is the one that
    makes the seam explicit. Tests then exercise the contract end to end.
  difficulty: 1
  tags:
  - process
  - synthesis
- id: '7.16'
  question: How does this module compose with the micro-assembly capstone (m20)?
  options:
    a: It runs before the loop
    b: It does not
    c: "It contributes a seam \u2014 one of stage, begin, fetch, abort, submit, filter,\
      \ or resubmit \u2014 and the loop calls it through that seam"
    d: It replaces the loop
  answer: c
  explanation: The micro-assembly is a composition of seams. Each module contributes
    one seam. The loop calls the module through that seam. The test of fit is whether
    the module's contract is honored by the loop.
  difficulty: 2
  tags:
  - synthesis
  - cross-module
- id: '7.17'
  question: What signal tells you this module's pattern is being misapplied in the
    codebase?
  options:
    a: Many tests
    b: Slow performance
    c: Code that should use the pattern is doing it by hand (useState for what should
      be a zustand store, manual fetches for what should be TanStack Query, raw form
      state for what should be useActionState), or code that should not use the pattern
      is using it anyway
    d: Many comments
  answer: c
  explanation: Misapplication shows up as divergence from the contract. Hand-rolled
    versions of what the module should own, or premature adoption where the contract
    does not fit, are the signals.
  difficulty: 1
  tags:
  - misconception
  - synthesis
