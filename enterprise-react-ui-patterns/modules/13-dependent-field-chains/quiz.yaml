- id: '13.1'
  question: What structure models dependent fields better than per-select useEffect?
  options:
    a: A schema-driven dependency DAG with derived resolution
    b: A single effect watching all values
    c: Nested ternaries in render
    d: A global promise array
  answer: a
  explanation: The DAG centralizes deps/reset/refetch edges; effects couple fields
    invisibly.
  difficulty: 2
  tags:
  - concept
  - comparison
- id: '13.2'
  question: In a cascade, what must happen to child values when a parent changes?
  options:
    a: They persist to speed re-entry
    b: They re-render only
    c: They reset via the dependency map
    d: They stay valid
  answer: c
  explanation: Reset clears stale children; their hidden errors clear with them.
  difficulty: 2
  tags:
  - concept
  - scenario
- id: '13.3'
  question: Why is AbortController alone insufficient to fix the stale option race?
  options:
    a: Abort is best-effort; a near-resolved response may still land
    b: It re-renders on each signal
    c: It blocks the request-id counter
    d: It doesn't free memory
  answer: a
  explanation: The request-id guard on resolution is the contract; Abort is optimization.
  difficulty: 2
  tags:
  - concept
  - misconception
- id: '13.4'
  question: An option request guard compares `my === writer.id` on resolution. What
    does that protect against?
  options:
    a: A slow cache hit
    b: A stale response overwriting a newer selection
    c: A retried authentication request
    d: A duplicate zod parse
  answer: b
  explanation: Only the newest selection id may paint the list; older resolves are
    dropped.
  difficulty: 3
  tags:
  - scenario
  - concept
- id: '13.5'
  question: When should remote field validation run?
  options:
    a: On every keystroke
    b: Only on submit
    c: Once per mount
    d: On touch/blur, debounced, flushed on blur
  answer: d
  explanation: Type-ahead validation storms the network; touch/blur with flush is
    deterministic.
  difficulty: 2
  tags:
  - concept
  - scenario
- id: '13.6'
  question: Cohort was 'valid' under the old program. The program changes. What must
    happen?
  options:
    a: Only submit re-checks
    b: "Nothing \u2014 validity persists per field"
    c: The cohort stays valid by default
    d: Chain revalidation re-runs children under new deps
  answer: d
  explanation: A valid cohort under old deps is meaningless under new ones; revalidateChain
    re-runs them.
  difficulty: 3
  tags:
  - scenario
  - application
- id: '13.7'
  question: Which React 19 tool keeps the program-swap cascade from blocking the select?
  options:
    a: useDeferredValue
    b: useTransition
    c: useSyncExternalStore
    d: useImperativeHandle
  answer: b
  explanation: "The cascade swap is a transition \u2014 the select responds immediately,\
    \ options hydrate after."
  difficulty: 2
  tags:
  - react-19
  - formula
- id: '13.8'
  question: 'The option-load version counters should live in:'
  options:
    a: React state, to re-render on write
    b: LocalStorage
    c: "Module-level refs \u2014 written frequently, read by guards only"
    d: zustand state, to persist across screens
  answer: c
  explanation: A version is a sync guard, not UI truth; refs avoid needless renders.
  difficulty: 2
  tags:
  - concept
  - comparison
- id: '13.9'
  question: Where do the option lists (cohorts for program X) belong?
  options:
    a: In the query cache keyed by dependency values
    b: In the draft store alongside field values
    c: In component useMemo
    d: In the URL
  answer: a
  explanation: "Server truth, keyed by deps \u2192 cache; refetches on dependency\
    \ change come free."
  difficulty: 2
  tags:
  - concept
  - comparison
- id: '13.10'
  question: A server-driven fields schema would replace what part of the client DAG
    map?
  options:
    a: The zod validation entirely
    b: The MSW wire fixtures
    c: The drag-and-drop layout
    d: The dependsOn/reset/requiredWhen edges served as config
  answer: d
  explanation: The DAG edges become server config; the client applies them, no drift
    of rules.
  difficulty: 3
  tags:
  - comparison
  - application
- id: '13.11'
  question: Field B's options depend on Field A. User changes A. What is the right
    moment to refetch B?
  options:
    a: On every keystroke in A
    b: Immediately on A's onChange, debounced
    c: When A's value is committed (on blur or on submit), and only if A actually
      changed
    d: Never; B is always editable
  answer: c
  explanation: Fetching on every keystroke wastes requests for partial input. Fetching
    on A's commit, gated by an actual-change check, gives the user a stable B that
    reflects the final A. Debouncing on every keystroke is a compromise that loses
    the stability property.
  difficulty: 2
  tags:
  - process
  - scenario
