  - 21
  question: The micro-assembly submits a batch. The form uses useActionState. After
    success, the applicant list does not refresh. Why?
  options:
    a: useActionState invalidates queries by default
    b: useActionState has no concept of query invalidation; the original mutation's
      onSuccess owned that coordination
    c: The list refreshes automatically
    d: The form must use server actions
  answer: b
  explanation: 'useActionState is local to the form''s lifecycle. Cache coordination
    is TanStack Query''s job. The fix: keep the action in a TanStack Query mutation,
    or call queryClient.invalidateQueries from inside the useActionState action after
    success.'
  difficulty: 3
  tags:
  - cross-module
  - query-cache
  - actions
