  - 23
  question: Suspense catches the {initial} load; SSE updates the {cache} on each event;
    the boundary stays {committed}.
  answer: initial; cache; committed
  explanation: Suspense is for initial load (a throw, then a fallback, then a re-render
    with the resolved children). Real-time updates bypass Suspense by writing directly
    to the cache. The boundary does not re-engage on each event.
  difficulty: 2
  tags:
  - cross-module
  - recall
- id: cum.50
  type: mcq
  source_modules:
  - 23
  - 20
  question: The micro-assembly's loop is running. The user closes the tab. SSE was
    the live update channel. What happens to in-flight mutations?
  options:
    a: They are lost
    b: They are persisted by m19's offline queue and resumed on reconnect
    c: The server detects the close and retries
    d: They are sent to the next user
  answer: b
  explanation: m19's offline queue persists pending mutations. SSE is for server-to-client
    push only and does not buffer for closed tabs. The mutation path is independent
    of the SSE path; the queue is the source of truth for survival.
  difficulty: 2
  tags:
  - cross-module
  - persistence
  - synthesis
