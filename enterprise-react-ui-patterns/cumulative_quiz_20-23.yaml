  - synthesis
- id: cum.48
  type: mcq
  source_modules:
  - 22
  - 23
  question: An applicant list page is wrapped in a Suspense boundary. Real-time updates
    arrive via SSE. The boundary does not re-suspend. Why?
  options:
    a: Real-time updates do not re-trigger Suspense; they update the cache directly
    b: The boundary is broken
    c: SSE always re-suspends
    d: The cache rejects the update
  answer: a
  explanation: Suspense catches initial-load throws. Real-time updates use setQueryData
    to merge into the cache without throwing. The boundary stays committed; only the
    rendered children update.
  difficulty: 3
  tags:
  - cross-module
  - synthesis
  - cache
- id: cum.49
  type: cloze
  source_modules:
