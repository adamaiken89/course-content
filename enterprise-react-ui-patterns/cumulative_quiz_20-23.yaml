  - 20
  question: A team replaces a TanStack Query mutation with useActionState because
    the form is simple. What is the most likely regression?
  options:
    a: The form becomes harder to use
    b: The query cache stops being invalidated; other components that read the same
      data become stale
    c: The form becomes inaccessible
    d: useActionState is slower
  answer: b
  explanation: 'useActionState has no concept of query invalidation. The ''simpler''
    replacement lost the cache coordination seam. The fix: call queryClient.invalidateQueries
    from inside the action, or keep the action in a mutation.'
  difficulty: 2
  tags:
  - cross-module
  - query-cache
  - actions
