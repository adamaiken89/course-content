  question: useActionState handles the form's {submit} lifecycle; useSuspenseQuery
    throws to a {Suspense} boundary; the seam between them is that the form owns {field}
    state and the boundary owns {fallback} state.
  answer: submit; Suspense; field; fallback
  explanation: useActionState is a reducer for the submit action. useSuspenseQuery
    throws a Promise to a Suspense boundary. Form fields use local useState; the boundary
    shows the fallback. Different seams, different responsibilities.
  difficulty: 3
