  question: Which symptom signals a container has decayed into a god component that the state decision matrix was meant to prevent?
  options:
    a: It holds one state value consumed by a single leaf
    b: It mixes unrelated state slices, effects, and render logic for several UI regions
    c: It only forwards props to children
    d: It reads theme from context
  answer: b
  difficulty: 1
  tags:
  - cross-module
  - container-pattern
