subject: "Enterprise React UI Patterns"
language: en
time_budget_hours: 22
target_level: advanced
domain: "enterprise-react-ui-patterns"
prerequisites: [react, typescript, testing]
learning_objectives:
  - "Architect a client-only React 19 app as composable containers with owned state, not component soup"
  - "Choose where state lives (useState / lifted / context / zustand / server cache) from measurable conditions"
  - "Apply testing as a companion vocabulary across layers, with snapshot and E2E boundaries"
  - "Derive end-to-end TypeScript safety from shared zod schemas"
  - "Build session, impersonation, and workflow-modal flows over a typed mock server contract"
  - "Compose application shell and layout containers with owned focus and accessibility"
  - "Build performant tracker grids and large-data UI with virtualization and deferral"
  - "Engineer dependent fields, batch submission, and CSV import with validation and rollback"
  - "Reconcile async races and design error UX with boundaries, retries, and offline messaging"
  - "Assemble extended patterns: autosave, offline queue, undo, and micro-stitched composition"

modules:
