- id: "c.1"
  question: "現金戶口（{cash account}）只可以用戶口入面嘅錢買嘢，唔可以借款。"
  answer: "cash account"
  explanation: "購買力等於現金餘額。想買更多，要入多啲錢。"
  difficulty: 1
  tags: [terminology]

- id: "c.2"
  question: "保證金戶口（{margin account}）可以向銀行借款買嘢，放大購買力，但股價跌穿門檻會收到 {margin call}。"
  answer: "margin account / margin call"
  explanation: "孖展係雙刃劍：放大回報同時放大損失，margin call 會喺你最唔想沽嘅時候強制沽貨。"
  difficulty: 1
  tags: [terminology]

- id: "c.3"
  question: "全權委託（{discretionary}）戶口由銀行自主決定買乜，客人唔使逐筆批准，主要收 {all-in 管理費}（按 AUM %，通常包托管）。"
  answer: "discretionary / all-in 管理費"
  explanation: "discretionary 嘅定義就係銀行代客決策。all-in fee 按 AUM 百分比收，托管多數已包；交易成本包唔包視乎銀行，簽約前要問清。"
  difficulty: 1
  tags: [terminology]

- id: "c.4"
  question: "諮詢服務（advisory）係銀行建議、客人 {逐筆批准}，主要收 {佣金} 加托管費。"
  answer: "逐筆批准 / 佣金"
  explanation: "advisory 同 discretionary 最大分別係「邊個話事」：advisory 客人有最終決定權。佣金係逐筆收，托管費分開列；discretionary 則多數 all-in。"
  difficulty: 2
  tags: [comparison]

- id: "c.5"
  question: "複合戶口（{omnibus}）真戶口開喺 CSD、以銀行名義，客人 sub-account 只係銀行內部 {記帳} 分邊個揸幾多。"
  answer: "omnibus / 記帳"
  explanation: "客人冇獨立市場戶口；CSD 只見銀行一個總戶口。法律上啲貨仲係客人嘅，但因為係記帳，對帳（reconciliation）特別關鍵。"
  difficulty: 2
  tags: [concept]

- id: "c.6"
  question: "保證金戶口買 $1,000,000 股票（自己 $500,000 + 借 $500,000），股價跌大約 {29%} 就可能收到 margin call（假設維持保證金率 30%，即市值 ≈ $714,000）。"
  answer: "29%"
  explanation: "保證金率 = 權益 ÷ 現市值。借 $500k，觸發點 (MV − 500k) ÷ MV = 30% → MV ≈ $714k，即跌約 29%。跌 20% 時仲有 37.5%，未觸發。實際數字視乎銀行規則。"
  difficulty: 3
  tags: [calculation]

- id: "c.7"
  question: "全權委託戶口冇「客人批准」呢一步，所以 {合規}（suitability 適當性）檢查變得更嚴格。"
  answer: "合規"
  explanation: "銀行要確保投資方案適合呢個客人，因為客人冇機會喺落單前把關。"
  difficulty: 2
  tags: [concept]

- id: "c.8"
  question: "私人銀行嘅 {RM}（客戶經理）屬於 Front Office，幫客人開戶口同落單。"
  answer: "RM"
  explanation: "Relationship Manager 係客人嘅第一接觸點，屬於前台部門。"
  difficulty: 1
  tags: [terminology]

- id: "c.9"
  question: "複合戶口對生命週期嘅影響：{分配} 同 {結算} 呢兩步會多一層內部拆帳。"
  answer: "分配 / 結算"
  explanation: "生命週期六步唔會變多，但複合戶口令分配同結算多一層「由銀行戶口分俾客人」。"
  difficulty: 2
  tags: [concept]
