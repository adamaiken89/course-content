  question: Herstatt 風險係指?
  options:
    a: 股票停牌風險
    b: 外匯兩邊交割唔同時完成嘅風險
    c: 印花稅加價風險
    d: 佣金折扣取消風險
  answer: b
  explanation: 'Herstatt: 一邊俾咗錢，另一邊未交——時間差風險。外匯雙幣交割最常見。'
  difficulty: 3
  tags:
  - cross-module
  - terminology
