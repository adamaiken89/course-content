  question: CCP 最核心嘅功能係?
  options:
    a: 替客人揀股票
    b: 取代對手方，保證交收
    c: 收取佣金
    d: 出月結單
  answer: b
  explanation: CCP = Central Counterparty，做中央對手方。買賣雙方都對 CCP，唔使擔心對手方倒閉。
  difficulty: 1
  tags:
  - cross-module
  - terminology
