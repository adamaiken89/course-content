  question: Clearing 同 Settlement 分別係?
  options:
    a: Clearing = 確認淨額保證交收；Settlement = 錢貨兩訖真正交割
    b: 冇分別，同一件事
    c: Settlement 先，Clearing 後
    d: Clearing 由政府做，Settlement 由交易所做
  answer: a
  explanation: Clearing 先（淨額 + 保證），settlement 後（錢貨同時過戶）。次序固定。
  difficulty: 2
  tags:
  - cross-module
  - comparison
