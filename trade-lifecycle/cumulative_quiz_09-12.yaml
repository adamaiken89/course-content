  question: 以下邊個工具生命週期同股票最唔同?
  options:
    a: 藍籌股
    b: 普通港股
    c: ETF
    d: 債券（多數 OTC，多數冇 CCP）
  answer: d
  explanation: 債券多數 OTC、多數冇 CCP → 對手方風險自己扛，流程同股票差好遠。
  difficulty: 2
  tags:
  - cross-module
  - comparison
