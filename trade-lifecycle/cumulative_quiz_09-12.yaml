  question: Netting（淨額結算）嘅主要好處係?
  options:
    a: 可以跳過清算所
    b: 令印花稅減半
    c: 減少交割次數同結算風險
    d: 保證成交價
  answer: c
  explanation: '淨額: 多單對沖成一個淨數，交割次數大減，風險敞口細好多。'
  difficulty: 2
  tags:
  - cross-module
  - concept
