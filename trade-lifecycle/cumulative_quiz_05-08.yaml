  - 8
  statement: 平均價分配對所有客人公平，因為大家同一單價。
  answer: true
  explanation: 公平 = 成本一致。總成本 ÷ 總股數 = 單一平均價，全組客人用同一價。
  difficulty: 1
  tags:
  - cross-module
  - concept
