  question: TCA（交易成本分析）唔包括以下邊項指標?
  options:
    a: 印花稅稅率
    b: Fill rate
    c: Market impact
    d: Slippage
  answer: a
  explanation: 'TCA 指標: slippage、fill rate、時間、market impact。印花稅係固定稅率，唔係執行質素指標。'
  difficulty: 2
  tags:
  - cross-module
  - terminology
