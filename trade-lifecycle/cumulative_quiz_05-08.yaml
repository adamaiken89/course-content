  question: Omnibus account 點解增加配對難度?
  options:
    a: 因為 omnibus 唔使配對
    b: 因為 omnibus 只可以用現金
    c: 因為 omnibus 唔成交
    d: 因為對手方只見一張總數，內部要再拆落各客
  answer: d
  explanation: 'Omnibus: 外面一張總數，內部要自行分配。多一層內部簿記 = 多一層出錯風險。'
  difficulty: 3
  tags:
  - cross-module
  - concept
