  - 8
  question: Contract Note 同 fill report 最大分別係?
  options:
    a: 冇分別，同一件事
    b: Contract Note 係法律文件列費用；fill report 只係成交通知
    c: Fill report 有法律效力，Contract Note 冇
    d: Contract Note 由交易所出，fill report 由政府出
  answer: b
  explanation: Fill report 即時通知成交；Contract Note 係法律文件，列成交細節同費用，雙方簽收。
  difficulty: 2
  tags:
  - cross-module
  - comparison
