  - 7
  - 8
  question: 平均價 = 總{成本} ÷ 總{股數}；全組客人同一單價。
  answer: 成本 / 股數
  explanation: 公平係成本一致，唔係回報一致。
  difficulty: 1
  tags:
  - cross-module
  - formula
