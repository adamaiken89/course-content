  question: Closing auction 嘅目的係?
  options:
    a: 俾散戶優先落單
    b: 撮合出公平嘅收市價
    c: 取消全日訂單
    d: 計算印花稅
  answer: b
  explanation: Closing auction 集中收市前需求，撮合出一個公平參考收市價，減人為操縱。
  difficulty: 1
