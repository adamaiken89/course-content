  - 7
  - 8
  question: 8 個客嘅訂單合併做一張大單，主要好處係?
  options:
    a: 可以跳過配對
    b: 唔使交印花稅
    c: 佣金更平、market impact 更細、fill rate 更高
    d: 可以保證成交價
  answer: c
  explanation: '合併: 大單攤薄佣金、減衝擊成本、提高成交率。但要公平分配返俾各客。'
  difficulty: 2
  tags:
  - cross-module
  - concept
- id: cum.7
  type: cloze
  source_modules:
