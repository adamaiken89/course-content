- id: '40.1'
  question: What is the primary purpose of Style Dictionary?
  options:
    d: A build tool that transforms design tokens into platform-specific output
    a: A CSS framework for responsive design
    b: A design tool for creating color palettes
    c: A runtime theme engine for React
  answer: d
  explanation: Style Dictionary takes structured token JSON and generates platform-specific
    files (CSS, JS, TS, Android XML, etc.) via transforms and formats.
  difficulty: 1
  tags:
  - style-dictionary
  - tokens
- id: '40.2'
  question: In the token hierarchy, what is the difference between alias tokens and
    component tokens?
  options:
    a: Alias tokens map global tokens to semantic purposes; component tokens scope
      overrides to specific components
    b: Alias tokens are for JavaScript; component tokens are for CSS
    c: They are the same thing with different naming conventions
    d: Alias tokens are deprecated; component tokens are the standard
  answer: a
  explanation: Alias tokens add semantic meaning (color.danger). Component tokens
    further scope values to specific components (button.background.danger).
  difficulty: 2
  tags:
  - tokens
  - hierarchy
- id: '40.3'
  question: How do CSS custom properties enable runtime theming without re-render?
  options:
    b: Custom properties resolve at paint time; changing data-theme attribute swaps
      values without component re-render
    a: CSS custom properties trigger React re-render when changed
    c: They use JavaScript setters to update the DOM
    d: They are polyfilled by Style Dictionary at build time
  answer: b
  explanation: CSS custom properties are evaluated by the browser at paint time. Changing
    data-theme on a parent element cascades new values to all children without JavaScript
    re-render.
  difficulty: 2
  tags:
  - css-variables
  - theming
- id: '40.4'
  question: What does a custom Style Dictionary transform do?
  options:
    b: Modifies token values during build (e.g., px to dp, px to rem)
    a: Changes the file format of the output
    c: Validates token JSON schema
    d: Compresses the output CSS
  answer: b
  explanation: Transforms are middleware that modify token values (or attributes)
    during build, enabling platform-specific value conversion.
  difficulty: 2
  tags:
  - style-dictionary
  - transforms
- id: '40.5'
  question: Why are static class names compiler-friendly for React Compiler?
  options:
    c: Static class names produce no dynamic style objects, so the compiler can memoize
      the rendering unconditionally
    a: Static class names are faster to hash
    b: React Compiler only works with className strings, not objects
    d: Static class names automatically tree-shake unused styles
  answer: c
  explanation: Static class names avoid dynamic style object creation. React Compiler
    can memoize the virtual DOM output without tracking style dependencies.
  difficulty: 3
  tags:
  - react-compiler
  - class-names
  - tokens
- id: '40.6'
  question: What is the token reference syntax Style Dictionary uses for alias resolution?
  options:
    a: '{path.to.token}'
    b: '$ref: path.to.token'
    c: '@path/to/token'
    d: var(--path-to-token)
  answer: a
  explanation: Style Dictionary uses {path.to.token} to reference other tokens. References
    are resolved at build time, not runtime.
  difficulty: 1
  tags:
  - style-dictionary
  - references
- id: '40.7'
  question: How does the CI token diff checker detect breaking changes?
  options:
    c: Parsing CSS custom properties from current and base branch, then checking for
      value changes on existing keys
    a: Comparing file sizes of the output CSS
    b: Running the full Style Dictionary build twice
    d: Comparing git commit hashes of token files
  answer: c
  explanation: 'The checker parses --variable: value pairs from CSS output on both
    branches. If an existing key has a different value, it''s a breaking change.'
  difficulty: 2
  tags:
  - ci
  - tokens
  - breaking-changes
- id: '40.8'
  question: What is the benefit of Server Components consuming token CSS?
  options:
    d: Zero JS runtime cost for theming — CSS custom properties resolve at paint time
      on the client
    a: Server Components can modify CSS custom properties
    b: Server Components inline all CSS into the HTML
    c: Tokens are compiled to inline styles by the server
  answer: d
  explanation: Server Components emit HTML with class names. CSS custom properties
    handle theming at paint time. No JavaScript executes for token resolution.
  difficulty: 2
  tags:
  - server-components
  - tokens
  - css-variables
- id: '40.9'
  question: Which Style Dictionary format output would you use to generate TypeScript
    type definitions for tokens?
  options:
    a: typescript/es6-declarations
    b: css/variables
    c: javascript/es6
    d: scss/variables
  answer: a
  explanation: typescript/es6-declarations generates .d.ts type definitions alongside
    .js token files for TypeScript consumers.
  difficulty: 2
  tags:
  - style-dictionary
  - typescript
  - formats
- id: '40.10'
  question: What scenario would require a custom Style Dictionary format instead of
    a built-in format?
  options:
    b: Generating a Tailwind CSS config extension from tokens
    a: Generating CSS custom properties for the web
    c: Generating SCSS variables for a Sass project
    d: Generating JavaScript ES6 module exports
  answer: b
  explanation: Tailwind config is a custom JSON structure not covered by built-in
    formats. A custom format function transforms tokens into the Tailwind extend config
    shape.
  difficulty: 3
  tags:
  - style-dictionary
  - custom-format
  - tailwind

