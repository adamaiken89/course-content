- id: '28.1'
  question: 'What does dependsOn: [''^build''] mean in turbo.json?'
  options:
    a: Wait for upstream dependency builds before running this task
    b: Run build after all tasks complete
    c: Build current package, then build dependencies
    d: Skip cache for build task
  answer: a
  explanation: ^ prefix indicates upstream dependencies. '^build' means this package's
    build waits for its dependencies' build tasks to complete first. Ensures compiled
    dependencies are available.
  difficulty: 1
  tags:
  - terminology
- id: '28.2'
  question: What determines whether Turborepo returns a cache hit or executes a task?
  options:
    a: Hash of task definition + input file hashes + global dependency hashes + env
      vars
    b: Only the source file modification timestamps
    c: Git commit hash
    d: Package version number
  answer: a
  explanation: Cache key = hash(task definition, input glob hashes, globalDependencies
    hashes, env vars, lockfile). Any change invalidates cache. Consistent across machines.
  difficulty: 2
  tags:
  - concept
- id: '28.3'
  question: How does shared TypeScript config prevent configuration drift across packages?
  options:
    c: Packages extend a base config from a shared package — changes propagate automatically
    a: Each package has independent config — no drift possible
    b: TypeScript CLI flags override per-package config
    d: Turborepo enforces tsconfig rules
  answer: c
  explanation: 'Shared config package (e.g., config-typescript/base.json) defines
    base compiler options. Consumer tsconfig uses extends: ''config-typescript/nextjs.json''.
    Updating shared config updates all consumers.'
  difficulty: 1
  tags:
  - pattern
- id: '28.4'
  question: What is the purpose of remote caching in Turborepo?
  options:
    d: Share cached build outputs across CI machines and developer machines
    a: Store build artifacts on users local machine
    b: Replace package manager's lockfile
    c: Cache npm packages for faster installs
  answer: d
  explanation: Remote cache stores build outputs in cloud (Vercel, S3). CI pipeline
    and developers share cache. PR build skips if main branch already built same inputs.
  difficulty: 1
  tags:
  - concept
- id: '28.5'
  question: What is the correct way for a library package to declare React dependency
    in a monorepo?
  options:
    a: Peer dependency with supported version range
    b: Direct dependency on react in library's package.json
    c: No declaration — React is provided globally
    d: Dependency on React in turbo.json
  answer: a
  explanation: 'Peer dependency: ''react'': ''^18.0.0 || ^19.0.0''. Ensures consumer
    app controls React version. Monorepo''s single React instance shared across all
    packages. Avoids duplicate React installation.'
  difficulty: 2
  tags:
  - pattern
- id: '28.6'
  question: 'What does outputs: [] in a turbo.json pipeline task mean?'
  options:
    b: Task has no cacheable outputs — always executes
    a: Task outputs are stored in default cache directory
    c: Outputs are deleted after task completes
    d: Outputs are streamed to stdout
  answer: b
  explanation: 'Empty outputs array means task produces no cacheable artifacts. Examples:
    lint, typecheck, test. These tasks always execute because caching them provides
    no benefit.'
  difficulty: 1
  tags:
  - api
- id: '28.7'
  question: How to run a Turborepo task for only one workspace?
  options:
    c: turbo run build --filter=@myorg/ui
    a: turbo run build --workspace=@myorg/ui
    b: cd packages/ui && turbo run build
    d: turbo run build @myorg/ui
  answer: c
  explanation: '--filter flag targets specific workspace. Example: turbo run build
    --filter=@myorg/ui. Builds only that package and its dependencies. Other workspaces
    unaffected.'
  difficulty: 1
  tags:
  - api
- id: '28.8'
  question: What is the recommended strategy for adopting React 19 in a monorepo with
    existing React 18 packages?
  options:
    b: Create canary versions of packages, canary app workspace, dual peer dependency
      support
    a: Upgrade all packages at once
    c: Stay on React 18 until all dependencies support React 19
    d: Use React 18 and React 19 in same bundle
  answer: b
  explanation: 'Gradual rollout: canary package variants with React 19, separate canary
    app workspace, peer dependency range ''^18.0.0 || ^19.0.0''. Test in CI with both
    versions before full migration.'
  difficulty: 2
  tags:
  - pattern
- id: '28.9'
  question: What file defines Turborepo's task graph, dependencies, caching, and outputs?
  options:
    d: turbo.json
    a: package.json
    b: .turborepo.yaml
    c: workspace.json
  answer: d
  explanation: turbo.json at project root defines pipeline (tasks, dependsOn, outputs,
    inputs, env), globalDependencies, remoteCache configuration. Schema at https://turbo.build/schema.json.
  difficulty: 1
  tags:
  - terminology
- id: '28.10'
  question: 'What does globalDependencies: [''.env''] in turbo.json achieve?'
  options:
    b: Includes .env hash in cache key — cache invalidates when .env changes
    a: Makes .env available to all task processes
    c: Copies .env to each workspace during build
    d: Validates .env file exists before running tasks
  answer: b
  explanation: globalDependencies lists files whose content contributes to cache key
    for all tasks. .env changes invalidate all caches. Prevents stale builds when
    environment variables change.
  difficulty: 2
  tags:
  - concept

