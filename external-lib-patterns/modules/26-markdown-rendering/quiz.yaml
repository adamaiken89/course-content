- id: '26.1'
  question: What is the correct unified pipeline order in react-markdown?
  options:
    c: remark plugins → rehype plugins → React elements
    a: rehype plugins → remark plugins → React elements
    b: React elements → remark plugins → rehype plugins
    d: rehype plugins → React elements → remark plugins
  answer: c
  explanation: 'Pipeline order: remarkParse (mdast) → remarkPlugins (transform mdast)
    → remarkRehype (mdast→hast) → rehypePlugins (transform hast) → render to React
    elements.'
  difficulty: 1
  tags:
  - architecture
- id: '26.2'
  question: What threat does rehype-sanitize protect against in react-markdown?
  options:
    a: 'XSS attacks via embedded HTML and javascript: URLs'
    b: Slow rendering performance
    c: Memory leaks from large markdown files
    d: Unicode normalization issues
  answer: a
  explanation: 'rehype-sanitize strips dangerous HTML elements and attributes. Prevents
    XSS vectors like <script> tags, javascript: URLs in links, onerror handlers, and
    other injection attacks.'
  difficulty: 1
  tags:
  - security
- id: '26.3'
  question: How would you add a Copy button to code blocks rendered by react-markdown?
  options:
    a: Override the pre component in components prop with a wrapper containing Copy
      button
    b: Not possible — react-markdown does not support custom UI
    c: Use CSS ::after pseudo-element
    d: Inject Copy button via rehype plugin only
  answer: a
  explanation: Override pre element renderer via components prop. Wrap children with
    div containing Clipboard API button. Rehype plugin approach also works but component
    override is simpler.
  difficulty: 2
  tags:
  - application
- id: '26.4'
  question: What does remark-gfm add that base react-markdown does not support?
  options:
    b: Tables, strikethrough, task lists, URL autolinks
    a: Bold and italic text
    c: Image embedding
    d: Ordered and unordered lists
  answer: b
  explanation: GitHub Flavored Markdown adds tables (| col | col |), strikethrough
    (~~text~~), task lists (- [x]), URL autolinks, and footnotes. Base commonmark
    does not include these.
  difficulty: 1
  tags:
  - terminology
- id: '26.5'
  question: How does React 19 Server Component rendering benefit markdown display?
  options:
    b: react-markdown bundle (~8KB) not sent to client — rendered to HTML on server
    a: Markdown can be edited by server admins at runtime
    c: Server Components allow real-time markdown collaboration
    d: Server Components automatically add syntax highlighting
  answer: b
  explanation: Server Component renders markdown on server, sends HTML. Client never
    downloads react-markdown or its plugin dependencies. Smaller bundle, faster initial
    render.
  difficulty: 2
  tags:
  - react19
- id: '26.6'
  question: What unist utility is commonly used to traverse and modify the markdown
    AST in custom remark plugins?
  options:
    d: unist-util-visit
    a: unist-walk
    b: mdast-traverse
    c: hast-walk
  answer: d
  explanation: 'unist-util-visit visits nodes matching a type. Pattern: visit(tree,
    ''heading'', (node) => { ... }). Used in custom remark plugins to extract, modify,
    or annotate AST nodes.'
  difficulty: 2
  tags:
  - pattern
- id: '26.7'
  question: What happens when rehype-raw is used without rehype-sanitize?
  options:
    d: Embedded HTML from markdown source renders without restriction — XSS risk
    a: Nothing — rehype-raw includes sanitization
    b: rehype-raw errors without rehype-sanitize
    c: Only text content is rendered
  answer: d
  explanation: 'rehype-raw parses HTML tags embedded in markdown into hast. Without
    rehype-sanitize, <script>, onerror, and javascript: URLs render. Always pair rehype-raw
    with rehype-sanitize.'
  difficulty: 2
  tags:
  - security
- id: '26.8'
  question: How does React 19 Suspense integrate with react-markdown for async content
    loading?
  options:
    b: Use use() hook with fetch promise inside component, wrapped in Suspense boundary
    a: Wrap ReactMarkdown in Suspense — no additional setup
    c: ReactMarkdown has built-in async loading prop
    d: Suspense only works with Server Components
  answer: b
  explanation: 'Fetch markdown as promise, pass to component using use() hook. Suspense
    boundary handles loading state. Pattern: const content = use(markdownPromise);
    return <ReactMarkdown>{content}</ReactMarkdown>.'
  difficulty: 2
  tags:
  - react19
- id: '26.9'
  question: Which prop on ReactMarkdown overrides default HTML element rendering?
  options:
    c: components
    a: elements
    b: renderers
    d: overrides
  answer: c
  explanation: 'components prop maps HTML tag names to custom React components. Example:
    components={{ pre: CustomPre, a: CustomLink, code: CustomCode }}.'
  difficulty: 1
  tags:
  - api
- id: '26.10'
  question: What is the purpose of remarkRehype in the unified pipeline?
  options:
    a: Converts mdast (remark AST) to hast (rehype AST)
    b: Parses markdown string into mdast
    c: Adds syntax highlighting to code blocks
    d: Sanitizes HTML output
  answer: a
  explanation: remarkRehype bridges remark and rehype ecosystems. Converts mdast (Markdown
    AST) to hast (HTML AST) so rehype plugins can process the tree before React rendering.
  difficulty: 1
  tags:
  - architecture

