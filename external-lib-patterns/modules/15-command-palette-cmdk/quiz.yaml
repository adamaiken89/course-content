- id: '15.1'
  question: What is the purpose of cmdk's CommandInput component?
  options:
    b: Renders a styled text input that filters CommandItems by default
    a: Provides a search bar but filtering must be implemented manually
    c: Shows keyboard shortcut hints
    d: Renders input for command arguments
  answer: b
  explanation: CommandInput renders a search input that automatically filters CommandItem
    children by their value and keywords props. onValueChange callback provides custom
    filtering alternative.
  difficulty: 1
  tags:
  - terminology
- id: '15.2'
  question: How does cmdk rank search results by default?
  options:
    c: Exact match > prefix match > substring match > keyword match
    a: Alphabetical order — no ranking
    b: Random order each search
    d: By order items appear in DOM
  answer: c
  explanation: 'cmdk''s built-in filter ranks: exact value match highest, then prefix
    match, then substring, then keyword match. Helps users find common actions quickly.'
  difficulty: 2
  tags:
  - concept
- id: '15.3'
  question: What pattern enables feature modules to add their own commands without
    modifying a central file?
  options:
    d: Command registration pattern — modules call registry.register() at init
    a: Central commands.tsx file with all commands
    b: Environment variables for each command
    c: Runtime JSON fetch from /api/commands
  answer: d
  explanation: CommandRegistry singleton accepts register() calls from any module.
    Each module calls register() during initialization. Registry aggregates and provides
    commands to CommandMenu component.
  difficulty: 2
  tags:
  - concept
- id: '15.4'
  question: How to implement a submenu/nested command in cmdk?
  options:
    c: Render separate Command tree when user selects parent item — swap visible content
    a: cmdk does not support nested commands
    b: Use nested CommandGroup components
    d: Set depth prop on CommandItem
  answer: c
  explanation: Submenus are separate Command trees rendered conditionally. Parent
    item's onSelect sets state to show submenu. Submenu includes back button to return
    to main menu.
  difficulty: 2
  tags:
  - application
- id: '15.5'
  question: What is the difference between Dialog and Inline mode in cmdk?
  options:
    a: Dialog mode renders overlay with backdrop. Inline embeds command list in page
      flow.
    b: No difference — same functionality
    c: Dialog mode has search, Inline does not
    d: Inline mode requires shouldFilter={false}
  answer: a
  explanation: CommandDialog wraps Command in a modal dialog (overlay, backdrop, focus
    trap). Inline mode renders Command directly in DOM for embedded use cases.
  difficulty: 1
  tags:
  - terminology
- id: '15.6'
  question: When should you set shouldFilter={false} on Command?
  options:
    b: When implementing custom filtering logic external to cmdk
    a: Always — built-in filtering is buggy
    c: When CommandItems have no value prop
    d: Only in Dialog mode
  answer: b
  explanation: 'shouldFilter={false} disables cmdk''s built-in filtering. Use when:
    fetch-as-you-type with debounce, server-side search, or custom ranking algorithm.
    You control what renders in CommandList.'
  difficulty: 2
  tags:
  - application
- id: '15.7'
  question: How does useHotkeys handle platform modifier differences?
  options:
    d: Automatically maps meta to cmd on Mac, ctrl on Windows
    a: No platform detection — use 'meta' for both Mac and Windows
    b: Developer must provide separate key combos per platform
    c: Uses navigator.platform to conditionally register
  answer: d
  explanation: react-hotkey detects OS and maps 'meta' to command key ⌘ on macOS and
    ctrl on Windows/Linux. useHotkeys('meta+k') works on both platforms without conditional
    logic.
  difficulty: 2
  tags:
  - concept
- id: '15.8'
  question: How to add keyboard shortcut hints to CommandItems?
  options:
    b: Use <CommandShortcut> children inside CommandItem
    a: Not supported — shortcuts displayed in separate component
    c: Add shortcut prop to CommandItem
    d: Shortcuts are automatically detected from useHotkeys
  answer: b
  explanation: CommandShortcut renders styled keyboard shortcut text inside CommandItem.
    Visual only — does not register key bindings. Pair with useHotkeys for actual
    key handling.
  difficulty: 1
  tags:
  - terminology
- id: '15.9'
  question: What happens when a user types a query that matches no commands?
  options:
    a: <CommandEmpty> renders with the unmatched query text
    b: CommandList shows nothing — empty state
    c: cmdk throws error
    d: Previous results remain visible
  answer: a
  explanation: CommandEmpty renders when no CommandItem matches current search query.
    Typically shows 'No results found' or 'No results for {query}'. Only visible when
    its parent CommandList has no visible CommandItems.
  difficulty: 1
  tags:
  - terminology
- id: '15.10'
  question: How to handle async data fetching in command items?
  options:
    a: Fetch in useEffect with query dependency, abort previous request, render results
      as CommandItems
    b: cmdk has built-in async support — pass fetch function
    c: Fetch all data upfront — async fetching not supported
    d: Use Web Workers for async command data
  answer: a
  explanation: Implement async fetch in useEffect. Use query state as deps. Abort
    previous fetch on new query via AbortController. Map results to CommandItems.
    Show loading state during fetch.
  difficulty: 2
  tags:
  - application

