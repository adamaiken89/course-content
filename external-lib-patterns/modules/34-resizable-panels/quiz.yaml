- id: '34.1'
  question: What are the three core components of react-resizable-panels?
  options:
    b: PanelGroup, Panel, PanelResizeHandle
    a: Splitter, Pane, Divider
    c: Container, Section, Handle
    d: Row, Column, Gutter
  answer: b
  explanation: PanelGroup wraps the layout (direction). Panel defines resizable regions
    with min/max/collapse. PanelResizeHandle is the draggable separator between panels.
  difficulty: 1
  tags:
  - architecture
- id: '34.2'
  question: What is the difference between controlled and uncontrolled Panel?
  options:
    b: Controlled uses size prop with onLayout; uncontrolled uses defaultSize
    a: Controlled panels are not resizable by users
    c: Uncontrolled panels require minSize prop
    d: No difference — they are aliases
  answer: b
  explanation: 'Controlled mode: parent manages sizes via size prop and receives updates
    via onLayout. Uncontrolled mode: panel manages own size via defaultSize without
    external state.'
  difficulty: 1
  tags:
  - control
- id: '34.3'
  question: What happens if panel sizes total exceeds 100%?
  options:
    c: Sizes are normalized proportionally to sum to 100%
    a: PanelGroup throws error
    b: Last panel is clipped
    d: Overflow scrollbar appears
  answer: c
  explanation: PanelGroup auto-normalizes sizes. If panels sum > 100%, each scales
    down proportionally. Use onLayout output (always normalized) for persistence.
  difficulty: 2
  tags:
  - behavior
- id: '34.4'
  question: How to persist panel layout across sessions?
  options:
    c: Use onLayout callback to save sizes array to localStorage; restore via size
      prop
    a: PanelGroup auto-saves to localStorage
    b: Panels persist automatically via React state
    d: Store panel refs in global context
  answer: c
  explanation: onLayout fires number[] of percentage sizes. Save to localStorage.
    On mount, read saved array and pass as size prop to each Panel in controlled mode.
  difficulty: 2
  tags:
  - persistence
- id: '34.5'
  question: Why use useTransition when persisting panel layout to localStorage?
  options:
    a: Debounces high-frequency onLayout calls during drag, preventing main thread
      blocking
    b: Required for localStorage write permission
    c: Transition enables undo of layout changes
    d: Layout persistence is async by default
  answer: a
  explanation: onLayout fires during every pixel of drag at high frequency. useTransition
    marks localStorage write as low priority, keeping resize responsive.
  difficulty: 2
  tags:
  - react
  - performance
- id: '34.6'
  question: How are Suspense boundaries used with resizable panels?
  options:
    d: Each Panel wraps its content in Suspense for lazy-loaded panel content
    a: Suspense wraps PanelGroup for loading state
    b: PanelResizeHandle supports Suspense for resize animations
    c: Suspense replaces PanelResizeHandle
  answer: d
  explanation: Each Panel wraps its content in <Suspense> so lazy-loaded panel sections
    stream independently. One panel's loading state does not block adjacent panels.
  difficulty: 2
  tags:
  - react
  - suspense
- id: '34.7'
  question: What keyboard keys resize panels by default?
  options:
    a: Arrow keys (left/right/up/down), Home/End, Enter
    b: Tab and Shift+Tab
    c: Space and Escape
    d: Page Up and Page Down
  answer: a
  explanation: Arrow keys adjust size incrementally. Home/End minimize/maximize panel.
    Enter toggles collapse. Enabled without extra configuration.
  difficulty: 1
  tags:
  - accessibility
- id: '34.8'
  question: How to create a collapsible sidebar that hides completely?
  options:
    a: Set collapsible=true and collapsedSize=0 on Panel
    b: Use visibility:hidden CSS class
    c: Set minSize=0 on Panel
    d: Wrap sidebar in conditional render
  answer: a
  explanation: collapsible=true enables collapse. collapsedSize=0 hides panel completely.
    onCollapse/onExpand callbacks notify parent of state change.
  difficulty: 2
  tags:
  - collapse
- id: '34.9'
  question: How does RTL support work in react-resizable-panels?
  options:
    b: dir='rtl' prop on PanelGroup reverses handle resize direction
    a: Must set document.dir manually
    c: CSS direction property on parent element
    d: Auto-detected from HTML lang attribute
  answer: b
  explanation: dir='rtl' on PanelGroup reverses resize behavior — dragging handle
    left increases right panel. Arrow keys also reverse accordingly.
  difficulty: 2
  tags:
  - rtl
- id: '34.10'
  question: How to programmatically trigger panel resize via React 19 ref?
  options:
    d: Panels expose resize(percentage) and collapse()/expand() methods on ref
    a: Set size prop to new value — ref not needed for imperative control
    b: Dispatch custom DOM event on panel element
    c: Call panelRef.current.style.flex property
  answer: d
  explanation: 'Panels expose imperative API via ref: resize(percentage), collapse(),
    expand(). Pass ref as prop (React 19 pattern) for parent-controlled imperative
    operations.'
  difficulty: 3
  tags:
  - react
  - imperative

