- id: '22.1'
  question: What problem does the twMerge function in the cn() helper solve?
  options:
    a: It resolves conflicting Tailwind utility classes, keeping the last one
    b: It merges Tailwind config files
    c: It combines separate CSS files into one bundle
    d: It converts inline styles to Tailwind classes
  answer: a
  explanation: twMerge resolves specificity conflicts between Tailwind utilities (e.g.,
    px-4 vs px-6), keeping the last defined class.
  difficulty: 1
  tags:
  - tailwind
  - tailwind-merge
  - utilities
- id: '22.2'
  question: Why is Tailwind fully compatible with React 19 Compiler?
  options:
    c: Tailwind generates static class names at build time with zero runtime CSS-in-JS
    a: Tailwind includes a React 19 plugin
    b: React 19 Compiler only works with Tailwind
    d: Tailwind uses runtime style injection for compatibility
  answer: c
  explanation: React 19 Compiler memoizes components automatically. Tailwind's static
    class names need no runtime style computation, so no migration effort is needed.
  difficulty: 2
  tags:
  - react-19
  - compiler
  - tailwind
- id: '22.3'
  question: What is the correct pattern for making a Button component accept custom
    styles from consumers?
  options:
    a: Accept a className prop merged with cn()
    b: Accept a style object prop
    c: Use CSS variables for all visual properties
    d: Extend Tailwind config per consumer
  answer: a
  explanation: Accepting className and merging with cn() allows consumers to override
    or extend styles while preserving internal component styles.
  difficulty: 1
  tags:
  - tailwind
  - component-patterns
  - className
- id: '22.4'
  question: How do you configure Tailwind to support class-based dark mode toggling?
  options:
    a: 'Set darkMode: ''class'' in tailwind.config'
    b: 'Set darkMode: ''media'' in tailwind.config'
    c: Use the @dark directive in CSS
    d: Import a dark mode plugin
  answer: a
  explanation: 'darkMode: ''class'' enables toggling dark mode by adding/removing
    the ''dark'' class on the HTML element. ''media'' follows system preference.'
  difficulty: 1
  tags:
  - tailwind
  - dark-mode
  - configuration
- id: '22.5'
  question: What is the advantage of mapping design tokens via CSS variables in tailwind.config?
  options:
    b: CSS variables allow runtime theme switching without recompilation
    a: CSS variables are faster than Tailwind utility classes
    c: Tailwind only supports CSS variable tokens
    d: CSS variables eliminate the need for Tailwind config
  answer: b
  explanation: CSS variables can be toggled at runtime for theme switching. Tailing
    config references them, so utility classes automatically reflect the current theme.
  difficulty: 2
  tags:
  - tailwind
  - design-tokens
  - CSS-variables
- id: '22.6'
  question: Which Radix UI state attribute does Tailwind use for styling open/closed
    transitions?
  options:
    b: data-state
    a: aria-expanded
    c: data-open
    d: role
  answer: b
  explanation: Radix UI components expose data-state attribute (e.g., data-[state=open],
    data-[state=closed]) for styling via Tailwind's data-* variant.
  difficulty: 2
  tags:
  - radix
  - tailwind
  - data-attributes
- id: '22.7'
  question: What is the difference between Tailwind utility-first approach and CSS-in-JS?
  options:
    c: Tailwind generates CSS at build time; CSS-in-JS generates styles at runtime
      or build time via JavaScript
    a: They are the same approach with different syntax
    b: CSS-in-JS is faster than Tailwind
    d: Tailwind only works with React
  answer: c
  explanation: Tailwind uses PostCSS to generate CSS at build time. CSS-in-JS libraries
    may generate styles at runtime or use compile-time extraction.
  difficulty: 1
  tags:
  - tailwind
  - css-in-js
  - architecture
- id: '22.8'
  question: Which responsive breakpoint pattern creates a 4-column grid on desktop
    and 2-column on tablet?
  options:
    d: grid-cols-2 lg:grid-cols-4
    a: grid-cols-4 sm:grid-cols-2
    b: grid-cols-4 md:grid-cols-2
    c: grid-cols-2 md:grid-cols-4
  answer: d
  explanation: 'In Tailwind mobile-first breakpoints, lg: overrides the default (mobile)
    grid. grid-cols-2 default becomes lg:grid-cols-4 on large screens.'
  difficulty: 1
  tags:
  - tailwind
  - responsive
  - grid
- id: '22.9'
  question: How should you handle repeated utility patterns that appear many times
    across components?
  options:
    b: Extract into a reusable component with className prop
    a: Keep inline utilities for consistency
    c: Add a custom utility class via @apply
    d: Use inline styles for the repeated patterns
  answer: b
  explanation: Reusable components encapsulate utility patterns. className prop allows
    consumer customization while reducing duplication.
  difficulty: 2
  tags:
  - tailwind
  - component-extraction
  - patterns
- id: '22.10'
  question: What does the clsx function in the cn() helper do?
  options:
    d: Conditionally joins class names together
    a: Merges Tailwind classes resolving conflicts
    b: Converts CSS modules to Tailwind
    c: Generates responsive variants
  answer: d
  explanation: clsx handles conditional class name joining (e.g., clsx('base', condition
    && 'extra')) returning a single string.
  difficulty: 1
  tags:
  - tailwind
  - clsx
  - utilities

