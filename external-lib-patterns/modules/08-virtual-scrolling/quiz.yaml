- id: '8.1'
  question: How many DOM nodes does a virtual scroll list typically render regardless
    of total items?
  options:
    a: Only visible items + overscan buffer (typically 10-30 nodes)
    b: All items — virtual scrolling does not reduce DOM nodes
    c: Exactly 100 nodes
    d: 10% of total items
  answer: a
  explanation: Virtual scroll renders only visible viewport items plus overscan (items
    just above/below). With 100k items, typically 10-30 DOM nodes. Significantly reduces
    render time and memory.
  difficulty: 1
  tags:
  - concept
- id: '8.2'
  question: What is the overscan property in TanStack Virtual?
  options:
    d: Extra items rendered above and below viewport to reduce blank areas during
      fast scroll
    a: Number of items to skip before rendering starts
    b: Maximum number of items to render
    c: Percentage of container height to reserve
  answer: d
  explanation: Overscan renders extra items beyond viewport so fast scrolling does
    not show blank space while new items load. Higher overscan = smoother scroll but
    more DOM nodes.
  difficulty: 1
  tags:
  - terminology
- id: '8.3'
  question: How does TanStack Virtual handle variable item heights?
  options:
    d: estimateSize provides initial estimate; measureElement callback measures actual
      height after render
    a: All items must be same height
    b: Variable heights are not supported
    c: Developer must pre-calculate all heights before rendering
  answer: d
  explanation: estimateSize gives initial guess. measureElement reads actual DOM height
    after render. Cached per index. Re-measure on content change.
  difficulty: 2
  tags:
  - concept
- id: '8.4'
  question: When combining infinite scroll with virtual scrolling, where does the
    endReached callback trigger?
  options:
    b: When virtual scroll's last item enters viewport minus threshold distance
    a: When user scrolls to last item
    c: When all items are loaded
    d: On component mount
  answer: b
  explanation: endReached fires when scroll position is within threshold px of total
    content bottom. Virtual scroll's total size includes loaded items; endReached
    detects when user approaches loaded boundary.
  difficulty: 2
  tags:
  - application
- id: '8.5'
  question: Chat prepends messages when scrolling up. How to prevent scroll position
    jump?
  options:
    a: After prepend, increase scrollTop by total height of new items
    b: Cannot — virtual scroll cannot handle prepended items
    c: Reload entire list
    d: Disable virtual scrolling for chat
  answer: a
  explanation: Prepending shifts all items down. Adjust scrollTop by sum of new item
    heights (from estimate or measure). Virtualizer re-indexes. User stays at same
    logical position.
  difficulty: 3
  tags:
  - application
- id: '8.6'
  question: What must be true for virtual scrolling to work?
  options:
    c: Container must have a fixed or computed height (not auto)
    a: Container must be the document body
    b: Items must be <table> elements
    d: Browser must support WebGL
  answer: c
  explanation: 'Virtual scrolling needs scrollable container with defined height.
    Height: auto means container grows with content — cannot virtualize. Set explicit
    height or use flex-basis + overflow.'
  difficulty: 2
  tags:
  - concept
- id: '8.7'
  question: VirtualList wrapper hides TanStack Virtual API. How to allow scrollToIndex?
  options:
    b: Provide onVirtualizerReady callback that gives consumer access to virtualizer
    a: Expose scrollToIndex as prop that changes trigger scroll
    c: Cannot — virtualizer is internal
    d: Consumer must use native scroll method on container ref
  answer: b
  explanation: onVirtualizerReady callback provides controlled access to virtualizer
    for advanced operations (scrollToIndex, getTotalSize). Used in conjunction with
    imperative handle (useImperativeHandle).
  difficulty: 3
  tags:
  - application
- id: '8.8'
  question: How to restore scroll position when navigating back to a list?
  options:
    b: Save scrollTop to sessionStorage on unmount, restore on mount
    a: Virtualizer remembers its position
    c: Use browser History API scroll restoration
    d: Scroll position cannot be restored
  answer: b
  explanation: Save scrollRef.current.scrollTop to sessionStorage/navigation state
    before unmount. On mount, read saved value and set scrollRef.current.scrollTop
    = saved. browser History API scrollRestoration = 'manual' to prevent conflict.
  difficulty: 2
  tags:
  - application
- id: '8.9'
  question: When should you skip virtual scrolling?
  options:
    c: When list has <100 items and rendering all is performant
    a: Never — always use virtual scroll
    b: When data comes from GraphQL
    d: When using TypeScript
  answer: c
  explanation: Virtual scroll overhead (measurement, re-renders, scroll synchronization)
    is unnecessary for small lists. For <100 items, rendering all is simpler and performant.
  difficulty: 2
  tags:
  - concept
- id: '8.10'
  question: Virtual scroll with animated item enter/exit (Framer Motion) is tricky
    because?
  options:
    a: Animated enter/exit changes item height dynamically, causing layout shift and
      measurement issues
    b: Motion library does not support virtual scroll
    c: Virtual scroll and animations cannot coexist
    d: Framer Motion breaks TanStack Virtual
  answer: a
  explanation: 'Animation that changes item height (collapse, expand, fade-out with
    height change) breaks virtualizer''s measurement. Solution: overlay animations
    on top of virtualized container using absolute positioning, outside virtualized
    items.'
  difficulty: 3
  tags:
  - application

