- id: '29.1'
  question: What is the preferred locator strategy in Playwright?
  options:
    d: Accessible locators (getByRole, getByLabel) — resilient to DOM changes
    a: CSS selectors for performance
    b: XPath for complex DOM queries
    c: data-testid attributes for all elements
  answer: d
  explanation: getByRole and getByLabel match how users and assistive tech interact.
    Resilient to DOM structure changes. CSS/XPath tied to implementation. Prefer role/label,
    then text, then test-id.
  difficulty: 1
  tags:
  - pattern
- id: '29.2'
  question: What does page.route() intercept in Playwright?
  options:
    a: Network requests — allows mocking, blocking, or modifying responses
    b: JavaScript errors
    c: Console messages
    d: Page navigation events
  answer: a
  explanation: page.route() intercepts HTTP requests matching URL pattern. Supports
    fulfill (mock response), abort (block), fetch (pass through and modify). Used
    for offline testing, error states, slow responses.
  difficulty: 1
  tags:
  - api
- id: '29.3'
  question: How does Playwright handle dynamic content loading without explicit waits?
  options:
    b: Assertions auto-retry until condition met or timeout — no manual wait/sleep
    a: Use page.waitForTimeout() for all dynamic content
    c: Playwright does not support dynamic content
    d: CSS animations must be disabled for assertions to work
  answer: b
  explanation: Playwright assertions (toHaveText, toBeVisible) auto-retry with configurable
    timeout. No manual sleep/wait. Waits disappear with each retry — test stays as
    fast as content loads.
  difficulty: 1
  tags:
  - concept
- id: '29.4'
  question: What is the purpose of BrowserContext in Playwright?
  options:
    d: Isolated session with own cookies, localStorage, and storageState
    a: Represents a single browser tab
    b: Configuration file for browser launch options
    c: Test runner instance
  answer: d
  explanation: BrowserContext is isolated browser session. Each context has separate
    cookies, localStorage, and cache. Enables parallel tests with different auth states.
    storageState persists context.
  difficulty: 1
  tags:
  - terminology
- id: '29.5'
  question: What does toHaveScreenshot() compare against?
  options:
    b: Stored baseline screenshot in snapshot directory
    a: Previous test run screenshot
    c: Design mockup image
    d: DOM structure hash
  answer: b
  explanation: toHaveScreenshot compares current render against stored baseline image
    in snapshotDir (default __snapshots__/). maxDiffPixelRatio allows small tolerance.
    Fails if diff exceeds threshold.
  difficulty: 2
  tags:
  - api
- id: '29.6'
  question: How should React 19 Server Components be identified in E2E tests?
  options:
    a: Use data attributes (data-server-rendered) or locator text content — HTML present
      in initial response
    b: Server Components cannot be tested in E2E
    c: Test only client components wrapping Server Components
    d: Use React DevTools protocol
  answer: a
  explanation: Server Components render HTML server-side, visible in page source.
    Use data attributes for resilience or text-based assertions. getByRole/getByText
    work on server-rendered content.
  difficulty: 2
  tags:
  - react19
- id: '29.7'
  question: What is the Page Object Model pattern in Playwright?
  options:
    a: Class that encapsulates page interactions and locators — reusable across tests
    b: Pattern where each test file represents one page
    c: Page is mocked object in test setup
    d: Page rendered as object in snapshot
  answer: a
  explanation: Page Object Model creates class per page (LoginPage, CheckoutPage).
    Exposes locators and methods (login(), fillShippingInfo()). Reduces duplication
    when same interaction used across tests.
  difficulty: 2
  tags:
  - pattern
- id: '29.8'
  question: How should visual regression tests handle components with dynamic data?
  options:
    c: Mock API data with page.route() before navigation — deterministic snapshots
    a: Do not use visual regression for dynamic components
    b: Use larger pixel diff threshold
    d: Disable visual regression in CI
  answer: c
  explanation: Mock API responses with page.route() to control rendered data. Same
    mock each run produces identical snapshots. Works for any component fetching data.
  difficulty: 2
  tags:
  - pattern
- id: '29.9'
  question: What Playwright feature records execution details for debugging failures?
  options:
    b: Trace Viewer — captures action log, screenshots, network, console, and DOM
      snapshots
    a: Screenshots only
    c: Video recording of full test
    d: Console.log output
  answer: b
  explanation: 'Trace records full execution: timeline, DOM snapshots before/after
    each action, network requests, console logs. Opened via npx playwright show-trace.
    Enabled with trace: ''on'' or ''on-first-retry''.'
  difficulty: 1
  tags:
  - terminology
- id: '29.10'
  question: 'What is the purpose of test.use({ storageState: ''auth/user.json'' })
    in Playwright?'
  options:
    c: Reuses pre-authenticated browser state — skips login step for subsequent tests
    a: Stores test results in JSON file
    b: Saves page screenshot to file
    d: Caches API responses for faster tests
  answer: c
  explanation: storageState loads saved cookies and localStorage into BrowserContext.
    Tests start already authenticated. Commonly created by first test (login → save
    context) then reused by remaining suite.
  difficulty: 1
  tags:
  - api

