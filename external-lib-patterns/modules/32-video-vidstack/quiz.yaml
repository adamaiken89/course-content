- id: '32.1'
  question: What is the purpose of Vidstack provider abstraction?
  options:
    a: Normalizes Html5Video, HLS, YouTube, and Vimeo APIs behind common interface
    b: Provides DRM decryption for all video formats
    c: Replaces HTMLVideoElement entirely with WebGL rendering
    d: Compresses video files on the client
  answer: a
  explanation: Provider abstraction lets developers swap between video sources (mp4,
    HLS, YouTube, Vimeo) without changing player UI or control logic. Each provider
    implements MediaProviderAdapter.
  difficulty: 1
  tags:
  - architecture
- id: '32.2'
  question: Which Vidstack components are required for a minimal player?
  options:
    a: MediaPlayer and MediaOutlet
    b: MediaProvider and MediaUI
    c: MediaContainer and MediaSource
    d: MediaHost and MediaRenderer
  answer: a
  explanation: MediaPlayer orchestrates state and tracks. MediaOutlet renders the
    underlying video element/iframe. Controls are optional and slot into MediaControls.
  difficulty: 1
  tags:
  - syntax
- id: '32.3'
  question: How does Vidstack determine which provider to use?
  options:
    d: Auto-detection from src URL extension or type
    a: Manual provider prop on MediaPlayer
    b: Separate import for each provider
    c: Configuration in MediaPlayer constructor
  answer: d
  explanation: Vidstack inspects src extension (.mp4, .m3u8) or URL pattern (youtube.com,
    vimeo.com) to select appropriate provider. Manual override via type prop if needed.
  difficulty: 1
  tags:
  - architecture
- id: '32.4'
  question: How does Vidstack integrate hls.js for HLS streaming?
  options:
    b: Separate @vidstack/hls package with HlsProvider registration
    a: Bundled inside Vidstack core
    c: Manual hls.js instance passed via ref
    d: HLS support only available in premium tier
  answer: b
  explanation: '@vidstack/hls exports HlsProvider registered via defineCustomElement.
    hlsConfig prop passes options like maxBufferLength, startLevel, abrEwmaDefaultEstimate.'
  difficulty: 2
  tags:
  - hls
  - integration
- id: '32.5'
  question: What is the slot system in Vidstack UI components?
  options:
    c: Named slots replacing default icons (play/pause/fullscreen) with custom SVGs
    a: CSS grid slots for layout
    b: Slot machine animation for loading states
    d: Time slots for ad insertion
  answer: c
  explanation: Slot attribute (slot='play', slot='pause', slot='on', slot='off') on
    child elements replaces default icons while preserving accessibility and behavior.
  difficulty: 2
  tags:
  - ui
  - customization
- id: '32.6'
  question: Why use useTransition for timeupdate event handlers in Vidstack?
  options:
    d: Prevents UI jank by marking progress setState as non-urgent during 4-60Hz events
    a: Transition increases video playback speed
    b: Required for HLS buffer management
    c: Transition synchronizes subtitle rendering
  answer: d
  explanation: timeupdate fires at high frequency. useTransition marks React state
    update as low priority to avoid frame drops during video playback. UI stays responsive.
  difficulty: 2
  tags:
  - react
  - performance
- id: '32.7'
  question: Which track types does Vidstack support?
  options:
    b: Subtitles, chapters, and quality levels
    a: Subtitles only
    c: Audio description tracks only
    d: Metadata and cue points
  answer: b
  explanation: Vidstack supports subtitles (VTT), chapter markers (VTT), and quality
    level tracks rendered via MediaQualitySlider. Track elements declared as children
    of MediaPlayer.
  difficulty: 2
  tags:
  - tracks
- id: '32.8'
  question: How does Vidstack handle responsive video across screen sizes?
  options:
    b: aspectRatio prop for ratio locking and src array with media conditions for
      art direction
    a: Media queries in CSS only
    c: JavaScript resize observer only
    d: Separate player component per breakpoint
  answer: b
  explanation: aspectRatio prop locks player dimensions. src array with media condition
    strings enables art-direction responsive video (different source per breakpoint).
  difficulty: 2
  tags:
  - responsive
- id: '32.9'
  question: What is the benefit of React Compiler with Vidstack media event handlers?
  options:
    c: Auto-memoizes event handlers, preventing unnecessary re-renders from high-frequency
      media events
    a: Compiler converts media events to Web Workers
    b: Compiler generates native video element code
    d: No benefit — media events are not reactive
  answer: c
  explanation: React Compiler automatically memoizes callbacks and components. Vidstack
    onTimeUpdate fires 4-60 times/second — Compiler prevents these from causing cascading
    re-renders.
  difficulty: 3
  tags:
  - react
  - compiler
- id: '32.10'
  question: When would you NOT use Vidstack and instead use raw HTMLVideoElement?
  options:
    a: Simple single-MP4 playback without controls customization
    b: HLS live streaming with quality selector
    c: Multi-provider support (YouTube + MP4)
    d: Application with subtitle track requirements
  answer: a
  explanation: Vidstack adds bundle size for provider abstraction. For a single MP4
    with default controls, bare <video> element with controls attribute is simpler
    and lighter.
  difficulty: 2
  tags:
  - trade-off

