- id: '17.1'
  question: What Liveblocks hook reads shared storage state reactively?
  options:
    b: useStorage
    a: useMyPresence
    c: useState
    d: useSharedState
  answer: b
  explanation: useStorage reads Live structures (LiveList, LiveObject, LiveMap) and
    re-renders component when any observed property changes.
  difficulty: 1
  tags:
  - api
- id: '17.2'
  question: What is the difference between Storage and Presence?
  options:
    d: Storage persists across sessions; presence is transient (cursors, selection)
    a: Storage is client-only; presence syncs to server
    b: Storage is read-only; presence is writable
    c: No difference — interchangeable
  answer: d
  explanation: Storage holds durable shared state (documents, blocks). Presence holds
    ephemeral state (cursor position, focus) not persisted after disconnect.
  difficulty: 1
  tags:
  - concept
- id: '17.3'
  question: How does Liveblocks undo/redo handle changes from other users?
  options:
    d: History is local — each client has own undo stack; undo reverses client's own
      mutations on shared storage
    a: Undoing Alice's change removes it for everyone
    b: Undo only affects local presence, not storage
    c: Undo/redo disabled in collaborative rooms
  answer: d
  explanation: Each client has independent undo stack. Undoing Alice's own mutation
    reverts that change from shared storage. Bob sees the block disappear. No per-user
    isolated history.
  difficulty: 2
  tags:
  - concept
- id: '17.4'
  question: What data structure stores an ordered list of objects in Liveblocks storage?
  options:
    b: LiveList
    a: LiveArray
    c: LiveSequence
    d: LiveOrderedSet
  answer: b
  explanation: LiveList is ordered sequence supporting insert, move, delete, and push
    operations. Children are LiveObject or other Live structures.
  difficulty: 1
  tags:
  - api
- id: '17.5'
  question: Presence data includes cursor coordinates. How often should presence be
    sent?
  options:
    a: Throttled to ~30fps or 33ms intervals for reasonable bandwidth
    b: Every pointer move event (up to 60fps)
    c: Once per second
    d: Only on pointer up
  answer: a
  explanation: Sending every pointer-move event generates excessive WebSocket messages.
    Throttle to ~30fps. For 100+ concurrent users, consider throttling further or
    limiting to visible users.
  difficulty: 2
  tags:
  - pattern
- id: '17.6'
  question: Which hook provides threads for comment annotations?
  options:
    a: useThreads
    b: useComments
    c: useAnnotations
    d: useDiscussions
  answer: a
  explanation: useThreads returns all threads in current room. useCreateThread creates
    new thread with body content and metadata (position, resolved status).
  difficulty: 2
  tags:
  - api
- id: '17.7'
  question: Two clients simultaneously rename same block to different names. What
    happens?
  options:
    c: Last-write-wins — CRDT converges to single name based on deterministic ordering
    a: Both names appear — conflict error
    b: First write wins — second rename rejected
    d: Block splits into two blocks with different names
  answer: c
  explanation: Liveblocks CRDT uses last-write-wins for scalar values. Concurrent
    operations ordered by vector clock converge deterministically. Both clients see
    same final state.
  difficulty: 2
  tags:
  - concept
- id: '17.8'
  question: What makes a `useMutation` call undoable as a single step?
  options:
    c: Each mutation call is automatically one undoable step
    a: Must call history.batch() to group operations
    b: Only singleton mutations are undoable
    d: Mutations are not undoable by default
  answer: c
  explanation: Each useMutation invocation is one undoable history entry. Multiple
    storage.set() calls inside same mutation are grouped as one undo step.
  difficulty: 2
  tags:
  - api
- id: '17.9'
  question: Why must room state be persisted to external database periodically?
  options:
    a: Liveblocks does not store data durably — in-memory CRDT lost when room becomes
      idle
    b: Liveblocks has no storage capability
    c: Database persistence is optional — Liveblocks handles durability
    d: Only needed for billing purposes
  answer: a
  explanation: Liveblocks holds CRDT state in memory for active rooms. State lost
    when all clients disconnect or room idle. Use REST API to read state and persist
    to database on save events.
  difficulty: 2
  tags:
  - concept
- id: '17.10'
  question: 'React 19 Suspense with RoomProvider: what does Suspense wait for?'
  options:
    b: Room connection establishes and initial storage loads
    a: React hydration completes
    c: All presence data arrives from other clients
    d: First useMutation call
  answer: b
  explanation: useSuspenseStorage triggers Suspense boundary during room connection
    and initial storage synchronization. Component renders only after storage is available.
  difficulty: 2
  tags:
  - react19

