- id: '14.1'
  question: How is Sonner's Toaster component configured in an app?
  options:
    d: Single instance placed once in app root — all toasts render from it
    a: Wraps each component that needs notifications
    b: Toaster is automatically injected by Sonner — no component needed
    c: Each toast call creates its own Toaster instance
  answer: d
  explanation: Place <Toaster /> once at app root (App.tsx, layout.tsx). All toast.success/error/info
    calls render into this Toaster. Position, styling, expand mode configured here.
  difficulty: 1
  tags:
  - terminology
- id: '14.2'
  question: What does toast.promise() return?
  options:
    a: A promise that resolves with toast ID
    b: The same promise passed in — toast.promise does not block
    c: Void — no return value
    d: A new promise that resolves when toast is dismissed
  answer: a
  explanation: toast.promise returns a promise that resolves with the toast ID string/number.
    The original promise runs in parallel — the function does not await it.
  difficulty: 2
  tags:
  - terminology
- id: '14.3'
  question: What is the benefit of typed notification helpers (notifySuccess, notifyError)?
  options:
    c: Enforces consistent duration, dismissible behavior, and action button style
      across app
    a: No benefit — direct toast calls are simpler
    b: Reduces bundle size
    d: Required for TypeScript compilation
  answer: c
  explanation: 'Typed helpers centralize toast configuration: error toasts get longer
    duration, all toasts get consistent action button styling, dismissible behavior
    is standardized. Changing app-wide behavior changes one file.'
  difficulty: 2
  tags:
  - concept
- id: '14.4'
  question: How does Sonner handle multiple toasts stacking?
  options:
    a: Toasts stack vertically, newest at top. visibleToasts prop limits count.
    b: Only one toast visible at a time
    c: Toasts appear in random positions
    d: Toasts replace each other — only latest stays
  answer: a
  explanation: 'Default stacking: newest on top, older below. visibleToasts (default
    3) limits simultaneous display. Excess queue until dismissal. Expand mode shows
    full content stacks.'
  difficulty: 1
  tags:
  - terminology
- id: '14.5'
  question: When would you use expand={true} on Toaster?
  options:
    a: When toasts contain important information that should not be truncated
    b: Always — expanded mode is better UX
    c: Never — expand mode is deprecated
    d: Only on mobile devices
  answer: a
  explanation: 'Expanded mode shows toast content in full vertical layout. Good for:
    error details, multiple action buttons, rich content. Stacked mode better for
    high-frequency updates.'
  difficulty: 2
  tags:
  - application
- id: '14.6'
  question: How to update a toast after it's shown?
  options:
    b: 'Call toast.success(newMsg, { id: existingToastId })'
    a: Cannot update — dismiss and show new
    c: Use toast.update() method
    d: Modify toast DOM directly
  answer: b
  explanation: 'Pass existing toast ID to toast.success/error/info to update content.
    Pattern: const id = toast.loading(''Uploading...''); later toast.success(''Done'',
    { id }). Updating dismisses loading and shows success.'
  difficulty: 2
  tags:
  - application
- id: '14.7'
  question: How does Sonner integrate with React 19 useActionState?
  options:
    c: Call toast in server action result handler — useEffect reacts to state change
    a: Sonner has built-in useActionState wrapper
    b: Server actions cannot call Sonner — client-only
    d: Wrap useActionState with Sonner's withToast() higher-order function
  answer: c
  explanation: Call toast from client component. Server action returns result object.
    Client useEffect watches state changes and calls appropriate toast helper. toast
    itself is client-side only.
  difficulty: 2
  tags:
  - application
- id: '14.8'
  question: How to create a toast with custom JSX content in Sonner?
  options:
    b: Use toast.custom((t) => <div>...</div>) — receives toast ID for dismiss
    a: Not supported — string messages only
    c: Pass JSX as first argument to toast.success
    d: Use dangerouslySetInnerHTML in toast message
  answer: b
  explanation: toast.custom() accepts render function. Receives toast ID as argument
    for custom dismiss behavior. Used for complex layouts with buttons, icons, and
    formatted text.
  difficulty: 2
  tags:
  - terminology
- id: '14.9'
  question: How to style Sonner toasts using CSS?
  options:
    d: CSS custom properties (--sonner-normal-bg, --sonner-success-bg, etc.) on Toaster
      container
    a: Sonner does not support custom styling
    b: Inline styles on toast.success() call only
    c: CSS modules imported from Sonner package
  answer: d
  explanation: 'Sonner exposes CSS custom properties on the Toaster element. Override:
    --sonner-normal-bg, --sonner-normal-text, --sonner-success-bg, --sonner-error-bg,
    --sonner-radius, etc.'
  difficulty: 2
  tags:
  - concept
- id: '14.10'
  question: How should toast duration differ between success and error?
  options:
    b: Error toasts should be longer (5-8s) than success (2-4s) — user needs more
      time to read error
    a: Both should use same duration
    c: Success should be longer — user wants to celebrate
    d: Duration does not matter — toasts auto-dismiss on click
  answer: b
  explanation: Errors need longer duration because user must read and understand failure.
    Action button (Retry, Undo) increases duration further. Success toasts disappear
    faster — positive feedback is lightweight.
  difficulty: 1
  tags:
  - concept

