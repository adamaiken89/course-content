- id: '25.1'
  question: Which component serves as the root container in @react-pdf/renderer?
  options:
    d: Document
    a: Root
    b: PDF
    c: Container
  answer: d
  explanation: Document is the root component that wraps one or more Page components.
    It receives global style and metadata props.
  difficulty: 1
  tags:
  - react-pdf
  - components
  - architecture
- id: '25.2'
  question: What layout system does @react-pdf/renderer use for positioning elements?
  options:
    a: Flexbox
    b: CSS Grid
    c: Absolute positioning only
    d: Table layout
  answer: a
  explanation: '@react-pdf/renderer uses Flexbox for layout. Properties like flexDirection,
    justifyContent, alignItems, and flex work similarly to CSS Flexbox.'
  difficulty: 1
  tags:
  - react-pdf
  - layout
  - flexbox
- id: '25.3'
  question: How do you add custom fonts to a @react-pdf document?
  options:
    c: Call Font.register with family name and source paths
    a: Import font file directly in the component
    b: Add font to a global CSS file
    d: Use @font-face in a style tag
  answer: c
  explanation: Font.register registers fonts before rendering. It accepts a family
    name and array of font variants (weight, style, src).
  difficulty: 1
  tags:
  - react-pdf
  - fonts
  - configuration
- id: '25.4'
  question: Which method converts a @react-pdf document to a downloadable Blob?
  options:
    b: pdf(document).toBlob()
    a: document.renderToBlob()
    c: PDFGenerator.blob(document)
    d: convertToPdf(document).blob()
  answer: b
  explanation: pdf(document).toBlob() asynchronously renders the document and returns
    a Blob object suitable for download or URL creation.
  difficulty: 2
  tags:
  - react-pdf
  - download
  - blob
- id: '25.5'
  question: Why should useTransition be used for PDF generation button clicks?
  options:
    c: It prevents UI freezes by marking PDF generation as a non-urgent state update
    a: It speeds up PDF rendering
    b: It adds animation to the download process
    d: It automatically retries failed PDF generation
  answer: c
  explanation: useTransition marks the state update as non-urgent, allowing the browser
    to remain responsive during the PDF generation process.
  difficulty: 2
  tags:
  - react-19
  - useTransition
  - performance
- id: '25.6'
  question: Which component is used to embed an image in a @react-pdf document?
  options:
    a: Image
    b: Img
    c: Photo
    d: Picture
  answer: a
  explanation: The Image component accepts src (local path, remote URL, or base64
    data URI), width, height, and objectFit props.
  difficulty: 1
  tags:
  - react-pdf
  - images
  - components
- id: '25.7'
  question: What is the equivalent of a div element in @react-pdf/renderer?
  options:
    b: View
    a: Box
    c: Container
    d: Section
  answer: b
  explanation: View is the generic layout container, equivalent to a div in HTML.
    Use it for grouping elements and applying layout styles.
  difficulty: 1
  tags:
  - react-pdf
  - components
  - layout
- id: '25.8'
  question: How should you handle large PDF documents in @react-pdf/renderer?
  options:
    d: Use toBuffer() for server-side streaming with appropriate Content-Length headers
    a: Generate the entire PDF in memory and download
    b: Split the document into multiple smaller PDFs
    c: Use client-side rendering only
  answer: d
  explanation: For large PDFs, use toBuffer() on the server and stream the response
    with Content-Length header for efficient delivery.
  difficulty: 2
  tags:
  - react-pdf
  - streaming
  - performance
- id: '25.9'
  question: How does React 19 Suspense integrate with @react-pdf document generation?
  options:
    b: Use Suspense to show fallback UI while async data for PDF content is loading
    a: Suspense wraps PDF generation automatically
    c: '@react-pdf does not support Suspense'
    d: Suspense replaces pdf().toBlob() for async generation
  answer: b
  explanation: Suspense wraps async data fetching for PDF content. The PDF component
    tree renders once data resolves, showing a fallback during loading.
  difficulty: 2
  tags:
  - react-19
  - suspense
  - async
- id: '25.10'
  question: What happens if you use HTML elements like div or span inside a @react-pdf
    component?
  options:
    a: They cause a runtime error or produce empty output
    b: They render with basic styling
    c: They are converted to View and Text components
    d: They render correctly in all cases
  answer: a
  explanation: '@react-pdf/renderer only understands its own components (Document,
    Page, View, Text, Image). HTML elements are not supported and cause errors or
    blank output.'
  difficulty: 2
  tags:
  - react-pdf
  - limitations
  - components

