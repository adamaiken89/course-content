- id: '13.1'
  question: What is a supergraph in Apollo Federation?
  options:
    b: A single GraphQL schema that aggregates subgraph schemas into one unified endpoint
    a: A database that stores all GraphQL types
    c: A monitoring tool for GraphQL performance
    d: A client-side cache for federated queries
  answer: b
  explanation: Supergraph is the composed schema from all subgraphs. Router exposes
    supergraph as single endpoint. Clients query it directly, unaware of subgraph
    boundaries.
  difficulty: 2
  tags: []
- id: '13.2'
  question: Which language is the Apollo Router written in?
  options:
    a: Rust
    b: Node.js / TypeScript
    c: Go
    d: Python
  answer: a
  explanation: Apollo Router is built in Rust for high performance (~50x faster than
    Gateway). Apollo Gateway is the Node.js/TypeScript alternative.
  difficulty: 2
  tags: []
- id: '13.3'
  question: 'Two subgraphs define `User.email`. Subgraph A says `email: String!`.
    Subgraph B says `email: String`. What happens during composition?'
  options:
    c: Composition fails — type mismatch (String! ≠ String)
    a: Composition succeeds, merges as `String!` (non-null wins)
    b: Composition succeeds, merges as `String` (nullable wins)
    d: Composition succeeds, router picks one at runtime
  answer: c
  explanation: Nullable vs non-null is a type difference. Composition requires exact
    type match. Safe failure guards against runtime null pointer errors.
  difficulty: 2
  tags: []
- id: '13.4'
  question: What is the purpose of the @shareable directive?
  options:
    a: Indicates a field can be resolved by multiple subgraphs
    b: Marks a field as accessible to all users
    c: Shares the field's resolver logic across services
    d: Copies the field value to all subgraphs
  answer: a
  explanation: '@shareable signals router that multiple subgraphs can resolve this
    field. Router picks one at query time. Reduces cross-subgraph calls.'
  difficulty: 2
  tags: []
- id: '13.5'
  question: 'During migration, Products subgraph has `Product.name`. Search subgraph
    needs it temporarily with @override(from: "search"). What is the correct migration
    sequence?'
  options:
    b: 'Add name to Search with @override(from: "search") → deploy → remove name from
      Products'
    a: Remove name from Products → add name to Search with @override → deploy
    c: Add @shareable to both → deploy → add @override → deploy → remove from Products
    d: Duplicate name in both subgraphs → let composition merge automatically
  answer: b
  explanation: '@override enables gradual migration. Add field to Search with @override
    first (Search''s version wins). After verifying Search resolves correctly, remove
    the field from Products. No breaking intermediate state.'
  difficulty: 2
  tags: []
- id: '13.6'
  question: Which directive hides a field from the supergraph schema?
  options:
    b: '@inaccessible'
    a: '@private'
    c: '@hidden'
    d: '@internal'
  answer: b
  explanation: '@inaccessible keeps field in subgraph schema but removes from composed
    supergraph schema. Useful for fields needed by other subgraphs but not client-facing.'
  difficulty: 2
  tags: []
- id: '13.7'
  question: A company has 3 engineers, 12 GraphQL types, and <50 req/s. Should they
    adopt Apollo Federation?
  options:
    d: No — operational overhead exceeds benefit for small team
    a: Yes — federation prepares them for future scalability
    b: Yes — federation simplifies deployment
    c: No — federation only works with Apollo GraphOS
  answer: d
  explanation: 3 engineers on 12 types = monolith fits. Federation adds deployment
    pipelines, schema coordination, distributed tracing. Start monolith, extract subgraphs
    when team or schema scales.
  difficulty: 2
  tags: []
- id: '13.8'
  question: An order subgraph needs `Product.price` at time of purchase. How should
    it model this?
  options:
    d: Store snapshot `priceAtPurchase` on OrderItem
    a: Reference live price via @key on Product
    b: Query Products subgraph for price on every order read
    c: Cache Product.price locally in Orders DB
  answer: d
  explanation: Live price changes after order. Snapshot preserves order total. @key
    reference to live price would change historical order values. Snapshot = historical
    accuracy.
  difficulty: 2
  tags: []
- id: '13.9'
  question: A developer runs `rover subgraph check` and it fails. What should they
    do?
  options:
    a: Fix schema to maintain backward compatibility, re-run check
    b: Override check with --force flag and deploy anyway
    c: Ignore — check is advisory only
    d: Remove all subgraph schemas and re-compose from scratch
  answer: a
  explanation: Check detects breaking changes. Failure means new schema would break
    existing queries. Fix schema (make compatible), re-run check, then publish. CI
    should enforce check pass before deploy.
  difficulty: 2
  tags: []
- id: '13.10'
  question: What design principle should guide subgraph boundary definition?
  options:
    c: DDD bounded contexts — each subgraph owns one domain concept
    a: Database table boundaries — one subgraph per database
    b: Team size — one subgraph per 5 engineers
    d: HTTP method — one subgraph per CRUD operation
  answer: c
  explanation: Subgraph boundaries follow domain boundaries (bounded contexts), not
    database or HTTP structure. Users subgraph owns identity, Products owns catalog,
    Orders owns sales — each a coherent domain.
  difficulty: 2
  tags: []

