- id: '11.1'
  question: Why can't CDNs cache standard GraphQL POST requests?
  options:
    d: CDNs cache by URL, but POST body content is not part of the cache key
    a: POST requests are inherently uncacheable by HTTP spec
    b: GraphQL responses are too large for CDN caches
    c: 'CDNs require Cache-Control: public, which GraphQL never sets'
  answer: d
  explanation: CDNs use URL as cache key. POST requests have query in the body, not
    URL. Without GET or APQ, every POST request appears unique to the CDN.
  difficulty: 2
  tags: []
- id: '11.2'
  question: What happens on the first APQ request when the server has never seen the
    query hash?
  options:
    c: Server returns PersistedQueryNotFound error, client resends with full query
    a: Server executes a default query and returns result
    b: Server returns data with a warning header
    d: Server computes the query from the hash using reverse lookup
  answer: c
  explanation: 'APQ protocol: server returns error on cache miss, client resends with
    full query + hash. Server stores the mapping for future requests.'
  difficulty: 2
  tags: []
- id: '11.3'
  question: 'Two GraphQL queries are semantically identical but formatted differently:
    `query { user(id:1) { name } }` vs `query{user(id:1){name}}`. When using query-based
    cache keys, they produce different cache entries. What is the best solution?'
  options:
    b: 'Normalize queries before hashing: strip whitespace, sort fields'
    a: Use a longer TTL to compensate for lower hit rate
    c: Store both mappings in the cache
    d: Enforce a single query format at the API gateway
  answer: b
  explanation: Normalization before hashing ensures semantically equivalent queries
    produce the same cache key. Enforcing format is impractical. Longer TTL and storing
    both do not solve the root cause.
  difficulty: 2
  tags: []
- id: '11.4'
  question: A mutation updates a user's profile picture. Which cache entries should
    be invalidated?
  options:
    a: User profile + any feed that displays the user's posts
    b: Only the user profile cache entry
    c: Nothing — mutations should not invalidate caches
    d: All cache entries, regardless of content
  answer: a
  explanation: 'Profile picture appears on user profile, user''s posts in feeds, comment
    threads, etc. Tag-based invalidation helps: tag cache entries with domain entities
    and invalidate all affected tags.'
  difficulty: 2
  tags: []
- id: '11.5'
  question: In the cache-aside pattern, who is responsible for loading data into the
    cache on a miss?
  options:
    b: The application/resolver code
    a: The cache itself (e.g., Redis module)
    c: A background worker process
    d: The database triggers a cache update automatically
  answer: b
  explanation: 'Cache-aside: application checks cache, on miss fetches from data source,
    stores result in cache. Application owns cache population logic.'
  difficulty: 2
  tags: []
- id: '11.6'
  question: A GraphQL resolver returns `[User!]!` and uses DataLoader to batch-fetch
    users. Two clients send the same query simultaneously. How many DB queries execute?
  options:
    c: 2 — DataLoader is per-request, so each client gets its own DataLoader
    a: 1 — DataLoader batches both requests
    b: 4 — DataLoader batches within each request, but two requests mean two batches
    d: Depends on timing — if requests overlap, DataLoader merges them
  answer: c
  explanation: DataLoader is instantiated per request. Two separate requests → two
    separate DataLoader instances → two DB batch queries. A shared response cache
    (Redis) would prevent the second DB call if the first already cached the result.
  difficulty: 2
  tags: []
- id: '11.7'
  question: Which cache pattern guarantees that reads never see stale data after a
    write?
  options:
    a: None — all caching patterns have eventual consistency windows
    b: Cache-Aside with TTL
    c: Read-Through with TTL
    d: Write-Through (write to cache synchronously with DB write)
  answer: a
  explanation: 'Even write-through has a window: between cache write and DB write
    (or vice versa). Distributed systems cannot guarantee read-your-writes without
    coordination overhead. Strong consistency and caching are fundamentally at odds.'
  difficulty: 2
  tags: []
- id: '11.8'
  question: What does `s-maxage` in Cache-Control header control?
  options:
    d: Shared cache (CDN/proxy) TTL, overriding max-age
    a: Browser cache TTL
    b: Server-side cache TTL
    c: Stale content serving duration
  answer: d
  explanation: s-maxage (shared max age) specifies TTL for shared caches like CDNs
    and reverse proxies. It overrides max-age for these caches. Browser caches still
    use max-age.
  difficulty: 2
  tags: []
- id: '11.9'
  question: A GraphQL API has 10 popular query shapes. Each shape has ~1000 unique
    variable combinations per minute. TTL is 60 seconds. What is the approximate cache
    miss rate assuming steady traffic?
  options:
    b: ~17% — each variable combination is requested roughly once per minute, so TTL
      covers ~1 request
    a: 100% — every request is a miss because variables change
    c: ~50% — random distribution means half the requests hit the first request's
      TTL window
    d: 0% — if all queries share the same normalized form, cache hit rate is 100%
  answer: b
  explanation: 1000 unique variable combinations per minute = ~16.7 combinations per
    second. With 60s TTL, each combination is cached for 60s but requested roughly
    once per minute on average. Roughly 1 hit per cache entry per TTL window. Miss
    rate ≈ 1 - (1/avg_requests_per_TTL) = high miss rate. Consider normalization or
    partial caching (e.g., cache DB results, not full response).
  difficulty: 2
  tags: []
- id: '11.10'
  question: A cache warming script runs every 5 minutes and executes 50 query shapes.
    Only 5 of those shapes are actually requested by users. What is the waste?
  options:
    a: 90% compute waste — 45/50 warmed queries are never used
    b: 0% — warming is always beneficial
    c: 10% — only the 5 unused queries waste resources
    d: Depends on cache eviction policy — if LRU, unused entries get evicted anyway
  answer: a
  explanation: 'Each warming execution consumes compute resources (DB queries, serialization)
    and memory. Warming 45 unused queries wastes 90% of warming effort, potentially
    evicting useful entries. Warm based on telemetry: only cache queries with proven
    demand.'
  difficulty: 2
  tags: []

