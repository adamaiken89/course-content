- type: mcq
  question: In (parent, args, context, info), what does the context argument carry?
  options:
    c: Request-scoped dependencies like auth and dataloaders
    a: The parent object
    b: Field arguments
    d: The schema SDL
  answer: c
  explanation: Context is assembled per request and passed to every resolver — the home for auth, loaders,
    datasources.
  difficulty: 2
  tags:
  - recall
  id: cum.2
  source_modules:
  - 2
