- type: mcq
  question: Which type best models "a field that may return several object types"?
  options:
    b: Union or interface
    a: Enum
    c: Scalar
    d: Input object
  answer: b
  explanation: Unions/interfaces let a field resolve to multiple object types; fragments handle type-specific
    selection.
  difficulty: 1
  tags:
  - recall
  id: cum.1
  source_modules:
