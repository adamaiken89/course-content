- id: c.1
  question: 'Complete: Deliberate practice is distinguished from naive practice by
    targeting {specific weaknesses} with immediate feedback.'
  answer: specific weaknesses
  explanation: Naive practice repeats known tasks. Deliberate practice isolates and
    attacks specific weaknesses, which is uncomfortable but necessary for growth.
  difficulty: 1
  tags:
  - terminology
- id: c.2
  question: 'Complete: The 10,000-hour rule oversimplifies Ericsson''s finding by
    conflating {total practice hours} with deliberate practice hours.'
  answer: total practice hours
  explanation: The quality of practice (deliberate vs naive) matters more than quantity.
    10,000 hours of naive practice produces much less improvement than 2,000 hours
    of deliberate practice.
  difficulty: 1
  tags:
  - terminology
- id: c.3
  question: 'Complete: Mental representations are internal models that allow experts
    to recognize {patterns}, {predict} outcomes, and self-correct.'
  answer: patterns, predict
  explanation: Mental representations enable chunking (seeing structure instead of
    pieces) and feedforward (anticipating what comes next). This is the mechanism
    of expert intuition.
  difficulty: 2
  tags:
  - concept
- id: c.4
  question: 'Complete: Deliberate practice feedback should be immediate, specific,
    {corrective}, and comparative.'
  answer: corrective
  explanation: Corrective feedback tells not just what was wrong but what to do differently.
    'Incorrect' identifies error. 'Use Q instead of R because Z' corrects the approach.
  difficulty: 1
  tags:
  - terminology
- id: c.5
  question: 'Complete: The optimal first-attempt success rate for deliberate practice
    is around {80} percent.'
  answer: '80'
  explanation: Lower = frustration (task too hard), higher = comfort (task too easy).
    80% provides enough failure to generate learning signals while maintaining motivation.
  difficulty: 2
  tags:
  - concept
- id: c.6
  question: 'Complete: A student answering correctly but slowly should receive {same
    difficulty} level with a speed target for the next attempt.'
  answer: same difficulty
  explanation: Speed indicates fluency. Slow-but-correct means the skill is not yet
    automatic. Keep difficulty constant and add speed as a new performance dimension
    to optimize.
  difficulty: 3
  tags:
  - application
- id: c.7
  question: 'Complete: Feedback in deliberate practice should show the difference
    between {current performance} and target performance.'
  answer: current performance
  explanation: Comparative feedback (you did X, target is Y) gives a clear direction
    for improvement. It transforms a vague 'try harder' into specific actionable gap
    closure.
  difficulty: 2
  tags:
  - concept
- id: c.8
  question: 'Complete: Experience without deliberate practice leads to {plateau} —
    the same skill level maintained but not improved.'
  answer: plateau
  explanation: Doing the same thing at the same level for years builds fluency but
    not new capability. Deliberate practice is needed to break plateaus.
  difficulty: 2
  tags:
  - concept
- id: c.9
  question: 'Complete: The deliberate practice feedback loop consists of: Perform,
    Evaluate, Compare to target, Identify gap, and {Adjust approach}.'
  answer: Adjust approach
  explanation: Adjustment is the action step. Without it, evaluation is analysis without
    change. Deliberate practice requires changing approach based on feedback.
  difficulty: 2
  tags:
  - process
- id: c.10
  question: 'Complete: Deliberate practice is exhausting and often not {enjoyable}
    because it requires sustained cognitive effort at the edge of ability.'
  answer: enjoyable
  explanation: 'If learning feels easy and fun, it''s likely naive practice (comfortable
    repetition). Deliberate practice should feel effortful. This is a useful diagnostic:
    pain = growth signal.'
  difficulty: 1
  tags:
  - concept
