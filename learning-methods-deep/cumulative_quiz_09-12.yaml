  question: Which principle explains why a learner prefers blocked practice (study one module fully) even though interleaving roughly triples long-term retention?
  options:
    a: Interleaving requires context-switching, which feels harder (desirable difficulty), so learners prefer blocked practice which feels easier
    b: Content engineering should generate interleaved questions
    c: Streak mechanics reward blocked practice
    d: FSRS-5 optimizes for blocked schedules
  answer: a
  explanation: Interleaving requires identifying which concept applies before answering — cognitively demanding. Learners prefer blocked practice because it feels productive. The protocol must override this preference.
  difficulty: 2
  tags:
  - cross-module
- id: cum.13
  type: mcq
  source_modules:
  - 12
  question: 'A weekly meta-learning review shows: REVIEW sessions have 60% completion rate, BLURT sessions have 90% completion rate. What does the protocol suggest?'
  options:
    a: Replace REVIEW with more BLURT sessions
    b: Reduce REVIEW time budget or FSRS-5 desired retention — cards pile up beyond capacity
    c: Ignore the data — patterns emerge over months
    d: Add more LEARN sessions to compensate for poor REVIEW
  answer: b
  explanation: 60% REVIEW completion means the time budget or card volume exceeds capacity. Reduce desired retention in FSRS-5 (fewer cards due daily) or shorten the time budget to match actual capacity.
  difficulty: 3
  tags:
  - scenario
- id: cum.14
  type: mcq
  source_modules:
  - 9
  question: In the Hook cycle, which phase makes the next trigger more effective over time by improving the learner's FSRS model?
  options:
    a: Trigger
    b: Action
    c: Reward
    d: Investment
  answer: d
  explanation: Investment adds to the product of use — each review updates FSRS-5 stability/difficulty, so future sessions are better calibrated and the next trigger lands in a stronger habit loop.
  difficulty: 2
  tags:
  - concept
