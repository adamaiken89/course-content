  question: A learner has 3 missed days in 2 weeks. The meta-learning analysis identifies trigger failure as the cause. Which principle applies?
  options:
    a: Increase streak freeze count from 1 to 3
    b: Skip the missed days — they don't matter long-term
    c: Design external triggers (fixed-time notifications) and context-dependent cues to rebuild habit
    d: Extend REVIEW session time to compensate
  answer: c
  explanation: "Missed days indicate trigger failure. Solution: use fixed-time external triggers and context cues to rebuild the habit pattern. Streak freeze is a safety net, not a fix for trigger failure."
  difficulty: 2
  tags:
  - scenario
