  statement: For a learner who just missed 2 days, showing 'Days studied 45/60 (75%)' motivates persistence better than showing 'Current streak 3 days.'
  answer: true
  explanation: Consistent percentage reframes a miss as a minor blip, not a reset. A short streak makes the learner feel like they're just starting despite overall consistency.
