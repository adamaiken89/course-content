- id: cum.4
  type: mcq
  source_modules:
  - 7
  question: A content engineering team uses Pass@k with k=1 for MCQ generation. Based on Module 07 principles, what quality issue is most likely?
  options:
    a: Questions will be too hard
    b: Questions will be too easy
    c: No quality issue — k=1 is optimal
    d: Without candidate selection, quality is unpredictable — factual errors and weak distractors pass through unfiltered
  answer: d
  explanation: Pass@k generates k candidates and keeps the best. k=1 means no filtering — all generated content is accepted regardless of quality. k=3-5 filters bottom candidates and improves overall quality.
  difficulty: 2
  tags:
  - scenario
- id: cum.5
  type: mcq
  source_modules:
  - 8
  question: A question labeled difficulty 3 is answered correctly by a learner who only memorized the answer. What should quality control do?
  options:
    a: Accept it — the label is set by the generation prompt
    b: Reject it — difficulty labels need post-generation validation
    c: Escalate it to difficulty 1 automatically
    d: Keep it but remove the explanation
  answer: b
  explanation: AI labeling is unreliable (label bias). Post-generation validation must check whether a difficulty-3 question can be answered by memorization alone. If so, relabel or regenerate.
  difficulty: 2
  tags:
  - scenario
- id: cum.6
  type: tf
  source_modules:
  - 8
  statement: 'True or False: ''A high-quality distractor should be obviously wrong so no one selects it.'''
  answer: false
  explanation: A high-quality distractor is plausible to someone with partial understanding. It tests a specific misconception. Obviously wrong distractors are easy to eliminate and don't discriminate understanding.
  difficulty: 1
  tags:
  - recall
