  question: 'Complete: Distractor quality ranks: common {misconception} > partial truth > related concept > random fact.'
  answer: misconception
  explanation: A common-misconception distractor tests a real understanding gap. A random fact is easy to eliminate and fails to discriminate understanding.
  difficulty: 2
  tags:
  - recall
