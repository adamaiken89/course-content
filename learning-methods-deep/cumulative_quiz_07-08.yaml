  question: A content engineer generates 50 MCQs with prompt 'Generate diverse chemistry questions.' The output has 35 recall-level, 10 comprehension, 5 application. Which module's principles explain this distribution?
  options:
    a: Content engineering — AI output mirrors training data frequency without explicit distribution enforcement
    b: FSRS-5 algorithm — difficulty is calibrated by ease factor
    c: Adaptive difficulty — the difficulty ramp failed to advance
    d: Persistence architecture — the prompt lacked engagement mechanics
  answer: a
  explanation: Without explicit topic/difficulty distribution enforcement, AI defaults to most common patterns in training data. The prompt should specify exact counts per difficulty level.
  difficulty: 2
  tags:
  - cross-module
- id: cum.2
  type: mcq
  source_modules:
  - 7
  question: What is the relationship between multi-shot prompting (Module 07) and Marva Collins' orchestrated success cycles (Module 02)?
  options:
    a: No relationship — content engineering and pedagogy are unrelated
    b: Both use examples/experience to calibrate performance — multi-shot examples set quality bar, Marva's cycles build confidence through achievable challenges
    c: Multi-shot replaces Marva's method entirely
    d: Marva's method is for humans, multi-shot is for AI
  answer: b
  explanation: "Both modules share a principle: examples define the bar. Multi-shot prompting gives the AI quality examples to calibrate output. Marva's orchestrated success cycles give the learner achievable challenges to build confidence. Same mechanism, different domain."
  difficulty: 3
  tags:
  - cross-module
  - synthesis
