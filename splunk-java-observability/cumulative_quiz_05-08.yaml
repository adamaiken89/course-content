- id: "cum.12"
  type: mcq
  source_modules: [6, 7]
  question: "Given INDEXED_EXTRACTIONS=JSON, fields are extracted at index time. What does the indexer write so the search head can reference field=value without re-extracting from _raw?"
  options:
    a: "The raw event only"
    b: "Search-time extractions via props.conf"
    c: "Extracted key/value segments plus a TSIDX/structure"
    d: "A run-time regex in transforms.conf"
  answer: c
  difficulty: 2
  tags: [synthesis, cross-module]
- id: "cum.13"
  type: mcq
  source_modules: [6, 7, 8]
  question: "Which decision creates the risk of many distinct high-cardinality values and is best avoided when designing fields at the source?"
  options:
    a: "snake_case field names"
    b: "Embedding request-unique IDs as a new indexed field"
    c: "Omitting nulls"
    d: "Keeping types stable across events"
  answer: b
  difficulty: 2
  tags: [synthesis, cross-module, misconception]
