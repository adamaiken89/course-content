  question: "A line in transforms.conf writes REGEX=([^=]+)=(?<field>.+); FORMAT=field::$1. What is the purpose of DEST_KEY=_meta in this search-time field extraction?"
  options:
    a: "Delete the extracted value after indexing"
    b: "Store fields in event metadata along with TRANSFORMS- application"
    c: "Force index-time storage in the TSIDX bloom"
    d: "Deduplicate repeated values across events"
  answer: b
  difficulty: 2
  tags: [recall, misconception]
