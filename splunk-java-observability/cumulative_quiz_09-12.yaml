- id: "cum.21"
  type: mcq
  source_modules: [9, 10]
  question: "Which SPL clause returns the distinct count of a field across events?"
  options:
    a: "stats dc(field)"
    b: "eval field=count"
    c: "top field"
    d: "sort -count"
  answer: a
  difficulty: 1
  tags: [recall]
- id: "cum.22"
  type: mcq
  source_modules: [9, 10]
  question: "A search has both a leading-wildcard pattern and a field=value filter with an exclusive PostgreSQL index. Which defeats the TSIDX bloom and forces a scan?"
  options:
    a: "Pattern 'level=ERROR' leftmost"
    b: "Ledger filter '*'.log-error at leftmost"
    c: "search terms wrapped in quotes"
    d: "time range narrowed to 1h"
  answer: b
  difficulty: 2
  tags: [synthesis, cross-module, misconception]
