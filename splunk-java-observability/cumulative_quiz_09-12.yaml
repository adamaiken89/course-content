  type: mcq
  source_modules: [10, 12]
  question: "Which reconstruction of a latency analysis is most targeted for a slow SQL segment of an endpoint?"
  options:
    a: "stats avg(duration) by host"
    b: "search level=ERROR | stats count"
    c: "timechart span=1h avg(latency) | top 20 slow_sql"
    d: "sourcetype=jvm_logs | table _raw"
